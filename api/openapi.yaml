openapi: 3.1.0
info:
  title: PressFleet API
  version: 0.1.0
  summary: Control plane API for the PressFleet WordPress application platform.
  description: |
    Spec-first API (design doc §4.5). This document is the source of truth;
    the Go server interfaces and the dashboard's TypeScript client are
    generated from it.

    ## Conventions

    * All API endpoints live under `/api/v1`. Breaking changes require a new
      version prefix; additive changes (new fields, endpoints, or enum values)
      do not, so clients must ignore unknown fields.
    * Request and response bodies are JSON. Field names are `snake_case`.
      Timestamps are RFC 3339 strings in UTC.
    * Long-running operations return `202 Accepted` with the queued job in the
      body and its URL in the `Location` header. Poll `GET /api/v1/jobs/{job_id}`
      until the job reaches a terminal state (`succeeded`, `failed`, or
      `rollback_failed`).
    * Every error response is an RFC 9457 Problem Details document
      (`application/problem+json`) that carries the request ID.
    * List endpoints use cursor pagination: pass `limit` and, for later pages,
      the `next_cursor` from the previous response as `cursor`. Cursors are
      opaque.

    ## Authentication

    Every operation requires authentication except login and the health
    endpoints. Unauthenticated requests get `401` with a `WWW-Authenticate`
    header.

    * **Session cookie (dashboard).** `POST /api/v1/auth/login` sets the
      `pressfleet_session` cookie (`HttpOnly`, `SameSite=Lax`, `Path=/`, and
      `Secure` when the request arrived over HTTPS). Sessions end after 12
      hours without use, 7 days after login, on logout, and when the user's
      password changes or the user is disabled.
    * **Bearer API token (automation).** Send `Authorization: Bearer pft_...`.
      Tokens are created with `POST /api/v1/auth/tokens` and shown only once.
      If an `Authorization` header is present, the cookie is ignored.

    ### CSRF protection

    Cookie-authenticated requests with an unsafe method (anything but `GET`,
    `HEAD`, and `OPTIONS`) must send the session's CSRF token in the
    `X-CSRF-Token` header. The token is returned as `csrf_token` by login and
    by `GET /api/v1/auth/me`. In addition, unsafe requests that don't use a
    bearer token (including login) are rejected if the browser marks them as
    cross-origin (`Sec-Fetch-Site`, or an `Origin` that doesn't match the
    host). Both failures return `403`. Bearer-token requests are exempt,
    because browsers never attach them automatically.

    ### Login throttling

    Failed logins return `401` without saying whether the email exists.
    Repeated failures for one account or from one client address are
    throttled with `429` and a `Retry-After` header.

    ## Authorization

    Each user has one platform-wide role: `admin`, `operator`, or `viewer`
    (design doc §4.6). A token's effective permissions are the intersection of
    its scope and its owner's current role. Denied requests get `403`.

    * Every role may read sites, client groups, and jobs, and manage its own
      password, API tokens, and SSH keys. Only Operators and Admins may
      connect to the SFTP gateway with their keys.
    * Operators and Admins may also create and change sites and client groups.
    * Only Admins may delete sites and client groups and manage users.
    * `read-only` tokens may only read, whatever the owner's role.

    Role changes apply to the user's existing sessions and tokens at once. The
    last enabled Admin can't be demoted, disabled, or deleted (`409`).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The control plane that serves this document.
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: health
    description: Liveness and readiness probes. Unauthenticated and outside `/api/v1`.
  - name: auth
    description: Sessions and the current user.
  - name: tokens
    description: The current user's API tokens.
  - name: users
    description: User management (Admin only).
  - name: ssh-keys
    description: |
      SSH public keys for the SFTP gateway (design doc §5.8). Developers
      connect with `sftp -P <port> <site-slug>@<dashboard domain>`: the SSH
      username names the site and the key names the user.
  - name: client-groups
    description: Client groups own sites and a backup repository.
  - name: sites
    description: WordPress sites.
  - name: backups
    description: Site backups, kept in the site's client group backup repository.
  - name: uploads
    description: Resumable uploads of large files for site imports and code deployments.
  - name: deployments
    description: Theme and plugin deployments for CI pipelines.
  - name: database
    description: Access to a site's database without its password (exports).
  - name: jobs
    description: Long-running operations.
  - name: audit
    description: The audit log (Admin only).

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: Returns `200` while the process is running. Performs no dependency checks.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe
      description: Runs every registered readiness check (for example, the state database). Returns `503` if any check fails.
      security: []
      responses:
        "200":
          description: Every check passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in and start a session
      description: |
        Verifies the credentials and sets the session cookie. The response body
        is the logged-in user. Failed logins return `401` without revealing
        whether the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              description: The session cookie (`HttpOnly`, `SameSite=Lax`, and `Secure` over HTTPS).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Deletes the session. With a bearer token there is no session, and the call only clears the cookie.
      responses:
        "204":
          description: Logged out; the session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user
      description: Also returns the session's CSRF token, so the dashboard can recover it after a page reload.
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      description: |
        Requires the current password. Signs out the user's other sessions and
        revokes all of their API tokens (including the one making the request,
        if any); the current session stays signed in. A wrong current password
        returns `422` and counts toward login throttling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/tokens:
    get:
      operationId: listApiTokens
      tags: [tokens]
      summary: List the current user's API tokens
      description: Token secrets are never returned after creation.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiToken
      tags: [tokens]
      summary: Create an API token for the current user
      description: |
        The response contains the plaintext token. It is shown only once and
        cannot be retrieved again; only a hash is stored.

        When the request itself is authenticated with an API token, the new
        token can't be broader than it: a read-only token can't create tokens
        at all, and a token with an expiry can only create tokens that expire
        no later. Violations return `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: Token created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeApiToken
      tags: [tokens]
      summary: Revoke one of the current user's API tokens
      description: Revocation takes effect immediately.
      responses:
        "204":
          description: Token revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: role
          in: query
          description: Only return users with this role.
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      description: |
        Changes apply immediately to the user's existing sessions and tokens.
        Setting a password or disabling the user signs them out everywhere and
        revokes their API tokens; re-enabling a user doesn't restore them.
        Demoting or disabling the last Admin returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: Also revokes the user's sessions, tokens, and SSH keys. Deleting the last Admin returns `409`.
      responses:
        "204":
          description: User deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/me/ssh-keys:
    get:
      operationId: listOwnSshKeys
      tags: [ssh-keys]
      summary: List the current user's SSH keys
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of SSH keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addOwnSshKey
      tags: [ssh-keys]
      summary: Register an SSH public key for the current user
      description: |
        Registers a public key for the SFTP gateway. Only public keys are
        accepted, and only key login is possible: the gateway has no
        passwords. A key can belong to one user only; registering a key that
        is already registered, to anyone, returns `409`.

        Every role may register keys, but only Operators and Admins may
        connect with them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SshKeyCreate"
      responses:
        "201":
          description: Key registered.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/me/ssh-keys/{ssh_key_id}:
    parameters:
      - $ref: "#/components/parameters/SSHKeyID"
    delete:
      operationId: deleteOwnSshKey
      tags: [ssh-keys]
      summary: Remove one of the current user's SSH keys
      description: |
        Takes effect immediately: new connections with the key are refused,
        and open SFTP sessions using it are ended within seconds.
      responses:
        "204":
          description: Key removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{user_id}/ssh-keys:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: listUserSshKeys
      tags: [ssh-keys]
      summary: List a user's SSH keys (Admin only)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of SSH keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addUserSshKey
      tags: [ssh-keys]
      summary: Register an SSH public key for a user (Admin only)
      description: Like `addOwnSshKey`, for another user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SshKeyCreate"
      responses:
        "201":
          description: Key registered.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{user_id}/ssh-keys/{ssh_key_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/SSHKeyID"
    delete:
      operationId: deleteUserSshKey
      tags: [ssh-keys]
      summary: Remove one of a user's SSH keys (Admin only)
      description: Like `deleteOwnSshKey`, for another user.
      responses:
        "204":
          description: Key removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/client-groups:
    get:
      operationId: listClientGroups
      tags: [client-groups]
      summary: List client groups
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of client groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroupList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createClientGroup
      tags: [client-groups]
      summary: Create a client group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientGroupCreate"
      responses:
        "201":
          description: Client group created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/client-groups/{client_group_id}:
    parameters:
      - $ref: "#/components/parameters/ClientGroupID"
    get:
      operationId: getClientGroup
      tags: [client-groups]
      summary: Get a client group
      responses:
        "200":
          description: The client group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateClientGroup
      tags: [client-groups]
      summary: Update a client group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientGroupUpdate"
      responses:
        "200":
          description: The updated client group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteClientGroup
      tags: [client-groups]
      summary: Delete a client group
      description: A client group that still has sites or a backup repository can't be deleted (`409`); offboarding exports or deletes the repository first.
      responses:
        "204":
          description: Client group deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List sites
      description: |
        Newest first. Listings come from the recorded state alone, so they
        omit `runtime`; get a site for its live state.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: client_group_id
          in: query
          description: Only return sites in this client group.
          schema:
            $ref: "#/components/schemas/ID"
        - name: status
          in: query
          description: Only return sites with this status.
          schema:
            $ref: "#/components/schemas/SiteStatus"
      responses:
        "200":
          description: A page of sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site
      description: |
        Starts the one-click provisioning workflow (design doc §5.1). The site
        record is created immediately with status `provisioning`; the job
        creates the database and containers and installs WordPress.

        The generated WordPress admin password is stored encrypted and can be
        retrieved exactly once with
        `POST /api/v1/sites/{site_id}/admin-credentials`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
      responses:
        "202":
          description: Provisioning job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/import:
    post:
      operationId: importSite
      tags: [sites]
      summary: Import a site
      description: |
        Imports an existing WordPress site from a `wp-content` archive and a
        SQL dump (design doc §5.7) into a new site in a client group. Send
        both files through the upload API first (`POST /api/v1/uploads` with
        purpose `site_import` and the same `client_group_id`), then name the
        complete uploads here. The job takes the uploads, which no other job
        can then use; they are removed when the job ends.

        * The archive is a `.tar.gz`, `.tar.bz2`, `.tar`, or `.zip` file of
          the site's `wp-content` directory: its contents at the top, a
          `wp-content` directory, or a whole WordPress install with one.
          Symbolic links and other special entries are skipped; absolute
          paths and `..` are refused.
        * The dump is a `.sql` or `.sql.gz` file of the site's database, as
          `wp db export`, mysqldump, mariadb-dump, or phpMyAdmin write
          them. `DEFINER` clauses, `CREATE DATABASE` and `USE` statements,
          and MySQL GTID statements are removed before it is imported.

        The archive and dump are large, so they are checked by the job's
        first step (`validate`), **before the site is created**: an archive
        without a `wp-content` directory, a dump that isn't a readable dump
        of one WordPress site's database, a multisite network, or a
        database from a WordPress core newer than the newest site image
        fails the job, and no site is created. The site's table prefix,
        source URL, and core version are read from the dump.

        The site is then created like `POST /api/v1/sites` (status
        `provisioning`, on the newest core, named after the imported site's
        title unless `name` is given) with the dump's table prefix; its
        `wp-content` is replaced with the archive's, the dump is imported,
        `wp core update-db` runs, the source's `siteurl` and `home` URLs are
        rewritten to the preview URL (`http` and `https` alike), and the
        default plugin stack is applied. The previous host's drop-ins
        (`object-cache.php`, `advanced-cache.php`, `db.php`) are replaced by
        the platform's; its must-use plugins are kept and reported as
        warnings in the job's log. The site keeps its own WordPress users,
        so no admin credentials are generated. The source's `wp-config.php`
        is never imported.

        The response holds the new site's ID, which `GET
        /api/v1/sites/{site_id}` finds once the job has created it, and the
        job, whose result holds `site_id`, `source_url`, and
        `table_prefix`. A job that fails after the site was created deletes
        the site again, with its containers, database, and data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteImport"
      responses:
        "202":
          description: Import job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteImportAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a site
      description: |
        Returns the site with its live runtime state in `runtime`, read from
        the container runtime with a short timeout. If the container runtime
        can't be reached, `runtime.phase` is `unknown` and `status` is the
        last recorded status; the request still succeeds.
      responses:
        "200":
          description: The site, including its live runtime status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a site's settings
      description: |
        Changes the PHP version, resource limits, or preview password
        protection. The settings are validated, saved as the site's desired
        state, and applied by a job that recreates the affected containers
        (design doc §5.5); changing the PHP version recreates the `php`
        container on the new image. The response contains the site with the
        requested settings and status `updating`, and the job. A stopped
        site stays stopped and runs with the new settings when started.

        `preview_protection.enabled` turns HTTP basic auth on the preview
        domain on or off (design doc §5.1); production domains are never
        protected. The platform generates the password the first time
        protection is turned on and returns it in `preview_credentials` of
        this response only; it is never shown again, but can be replaced
        with `POST /api/v1/sites/{site_id}/preview-password`. Turning
        protection off keeps the credentials, so turning it on again
        restores them. The username defaults to the site's slug.

        If the job fails, it reverts: the previous settings are applied and
        saved again, the status returns to what the containers are doing,
        and `status_message` says why the update failed. Only if reverting
        fails too is the site marked `failed`.

        A site that is `provisioning`, `updating`, or `deleting`, or whose
        provisioning failed, can't be changed (`409`). The PHP version is
        only validated when it changes, so a site on a PHP version past end
        of life can still get new resource limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
      responses:
        "202":
          description: Update job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site
      description: |
        Queues a job that removes the site's containers, network, volumes,
        database, secrets, and rendered files. The site's status becomes
        `deleting`; the site disappears when the job succeeds.
      responses:
        "202":
          description: Deletion job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/start:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: startSite
      tags: [sites]
      summary: Start a stopped site
      description: |
        Queues a job that starts the site's containers and waits for them to
        be healthy, then sets the status to `running`. The status doesn't
        change until then. Starting a running site succeeds without changing
        it. If the job fails, the site is marked `failed` with the reason in
        `status_message`. A site that is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed, returns `409`.
      responses:
        "202":
          description: Start job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/stop:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: stopSite
      tags: [sites]
      summary: Stop a running site
      description: |
        Queues a job that stops the site's containers, keeping its data,
        then sets the status to `stopped`. A stopped site stays stopped when
        Docker restarts, and WP-Cron doesn't run for it. Stopping a stopped
        site succeeds without changing it. If the job fails, the site is
        marked `failed` with the reason in `status_message`. A site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409`.
      responses:
        "202":
          description: Stop job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/cache/purge:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: purgeSiteCache
      tags: [sites]
      summary: Purge a site's caches
      description: |
        Queues a job that empties the site's object cache (its database on
        the shared object cache server), then its page cache (the FastCGI
        cache nginx keeps), so the next requests are rendered afresh. The
        site keeps serving throughout and its status doesn't change; stopped
        sites are purged too. WordPress already purges the pages a change
        affects when content is published or edited (Nginx Helper); this is
        for everything else, such as a theme change or an edit made directly
        in the database. A site that is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed, returns `409`.
      responses:
        "202":
          description: Cache purge job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/admin-credentials:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: retrieveSiteAdminCredentials
      tags: [sites]
      summary: Retrieve the initial WordPress admin credentials (once)
      description: |
        Returns the WordPress admin credentials generated when the site was
        created, then discards the stored password. Later calls return `410`,
        as do calls for a site whose provisioning failed. While the site is
        still being provisioned the credentials aren't usable yet, and the
        call returns `409`. This is a `POST` because it changes state.
      responses:
        "200":
          description: The initial admin credentials. They can't be retrieved again.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAdminCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/maintenance:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    put:
      operationId: setSiteMaintenance
      tags: [sites]
      summary: Turn maintenance mode on or off
      description: |
        Records whether the site is in maintenance mode and queues a job
        that applies it (design doc §5.4). In maintenance mode, every domain
        of the site answers `503 Service Unavailable` with `Retry-After` and
        the platform's maintenance page, served by the edge router without
        the site's containers; WP-CLI and other platform tasks keep working.
        The change takes effect a few seconds after the job has finished,
        and stays across updates and restarts until it is turned off. The
        site's `status` doesn't change. If the job fails, the previous
        setting is restored. A site that is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed, returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteMaintenance"
      responses:
        "202":
          description: The site with the recorded setting, and the job that applies it.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/go-live:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: goLiveSite
      tags: [sites]
      summary: Switch a site to its primary domain
      description: |
        Sets the site's primary domain and aliases and queues a job that
        switches the site to them (design doc §5.2):

        1. The edge router routes the primary domain and each alias, and
           gets a certificate for each with the ACME HTTP-01 challenge. The
           site's containers aren't recreated.
        2. WordPress's URLs are rewritten from the preview domain (and any
           earlier primary domain) to `https://<primary_domain>` with
           `wp search-replace`, serialized data included and GUIDs left
           alone, and `home` and `siteurl` are set to it.
        3. The site's object cache and page cache are purged.

        From then on, the preview domain and the aliases answer with a
        permanent redirect (`301`) to the primary domain that keeps the path
        and query. A protected preview domain asks for its password before
        redirecting. The primary domain and aliases never ask for the
        preview password, never send `X-Robots-Tag: noindex`, and, when the
        platform's security headers are on, send
        `Strict-Transport-Security: max-age=31536000` (without
        `includeSubDomains`).

        **DNS check.** Before anything changes, the control plane checks
        that each domain the site doesn't have yet resolves (A and AAAA) to
        this host only: to `public_ip` or the dashboard domain's addresses.
        If one doesn't, the request fails with `422` and the problem type
        `https://github.com/rchouinard/pressfleet/blob/main/docs/configuration.md#dns-check`,
        with one entry in `errors` per domain saying what it resolves to and
        where it should point. Nothing is recorded; send the request again
        once the records have propagated. Hosts behind a CDN or load
        balancer, whose domains resolve elsewhere, set `skip_dns_check`.

        The response contains the site with the new domains and status
        `updating`, and the job. If the job fails before WordPress's URLs
        are rewritten, it reverts: the previous domains and routes are back
        and `status_message` says why. If it fails later, the site keeps its
        new domains and `status_message` says the go-live didn't finish;
        going live again with the same domains finishes it.

        Going live again with another primary domain moves the site: the
        old primary domain's URLs are rewritten too, and it stops being
        served unless it is listed as an alias. Going back to the preview
        domain alone isn't supported.

        The site must be `running` (`409` otherwise). A site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409` too. A domain under the preview base domain,
        the dashboard's domain, or one another site uses is refused with
        `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteGoLive"
      responses:
        "202":
          description: The site with its new domains, and the job that applies them.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableDomains"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/aliases:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    put:
      operationId: setSiteAliases
      tags: [sites]
      summary: Replace a live site's aliases
      description: |
        Replaces the aliases of a site that has gone live and queues a job
        that routes them (design doc §5.2). Each alias gets a certificate
        of its own with the ACME HTTP-01 challenge and answers with a
        permanent redirect (`301`) to the primary domain, keeping the path
        and query (with HSTS when the platform's security headers are on).
        Aliases no longer listed stop being served. The change takes effect
        within seconds of the job finishing, without recreating the site's
        containers, so the site keeps serving throughout. WordPress's
        content and caches aren't touched: aliases only redirect.

        New aliases get the same DNS check as go-live, and fail it the same
        way (`422` with the DNS problem type, nothing changed);
        `skip_dns_check` skips it. Aliases the site has already aren't
        checked again. The site's status is `updating` until the job has
        finished; if the job fails, the previous aliases are restored.

        A site that hasn't gone live returns `409`; so does one that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed. A stopped site can change its aliases.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteAliases"
      responses:
        "202":
          description: The site with its new aliases, and the job that applies them.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableDomains"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/preview-password:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: regenerateSitePreviewPassword
      tags: [sites]
      summary: Generate a new preview password (shown once)
      description: |
        Replaces the password of the site's preview domain protection
        (design doc §5.1) with a newly generated one, returns it, and queues
        a job that applies it; the old password stops working when the job
        has finished. The password is returned by this response only. It
        can be generated whether or not protection is on; with protection
        off, it is kept for when it is turned on. The site's status is
        `updating` until the job has finished. A site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409`.
      responses:
        "202":
          description: The new credentials, and the job that applies them.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPasswordAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/backups:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: listSiteBackups
      tags: [backups]
      summary: List a site's backups
      description: |
        The platform's record of every backup of the site, newest first,
        including backups that are running or failed. Listing reads the
        records alone; it doesn't open the backup repository. A backup
        whose snapshot has since been removed from the repository (by the
        retention policy) is still listed.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Only return backups with this status.
          schema:
            $ref: "#/components/schemas/BackupStatus"
      responses:
        "200":
          description: A page of backups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSiteBackup
      tags: [backups]
      summary: Back up a site
      description: |
        Queues a job that backs up the site (design doc §5.3): it dumps the
        site's database and snapshots the dump together with the site's
        `wp-content` into the client group's backup repository, which it
        creates on the group's first backup. WordPress core and
        `wp-config.php` are not backed up; both are reproducible from the
        site's WordPress version and settings. The site keeps serving
        throughout, and stopped sites can be backed up too. The job's result
        holds `backup_id` and `snapshot_id`; the backup is listed at once
        with status `running`. The job runs after any other job working on
        the site. A site that is `provisioning` or `deleting`, or whose
        provisioning failed, returns `409`.
      responses:
        "202":
          description: Backup job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/backup-schedule:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: getSiteBackupSchedule
      tags: [backups]
      summary: Get a site's backup schedule
      description: |
        When the site is backed up automatically (design doc §5.3), and when
        its next scheduled backup is due. Every site is backed up daily by
        default, at a time within the platform's backup window
        (`backup.schedule` in the config file) that stays the same from day
        to day and differs between sites, so backups are spread out.
      responses:
        "200":
          description: The site's backup schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setSiteBackupSchedule
      tags: [backups]
      summary: Change a site's backup schedule
      description: |
        Replaces the site's backup schedule; omitted fields take their
        defaults, so `{"enabled": true}` restores the daily backup in the
        platform's window. The change applies at once, without a job: the
        response says when the next backup is due. Scheduled backups are
        recorded like manual ones, with kind `scheduled`. A backup that is
        due while the control plane is down runs when it starts again, once
        however many were missed. Turning the schedule off doesn't affect
        existing backups or manual ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupScheduleUpdate"
      responses:
        "200":
          description: The site's new backup schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/restore:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: restoreSite
      tags: [backups]
      summary: Restore a site from a snapshot
      description: |
        Queues a job that restores a snapshot into the site (design doc
        §5.4). The snapshot is one of the site's own (`snapshot_id` of a
        backup from `GET /api/v1/sites/{site_id}/backups`), or of another
        site in the same client group, named by `source_site_id`, whose
        content then replaces this site's. The job:

        1. takes a pre-restore backup of the site (kind `pre_restore`), so
           the restore can be undone;
        2. puts the site in maintenance mode;
        3. if the snapshot was taken on a newer WordPress core than the
           site runs, moves the site to the oldest site image with at least
           that version;
        4. replaces the site's `wp-content` with the snapshot's (files added
           since are removed) and its database with the snapshot's,
           restarts the site's containers, and runs `wp core update-db`;
        5. if the restored database names another host than the site's
           URL (a snapshot of another site, or from before go-live),
           rewrites its URLs to the site's with `wp search-replace`, as
           go-live does, and sets `home` and `siteurl`;
        6. purges the object cache and the page cache, and takes the site
           out of maintenance mode (unless it was in maintenance mode
           before).

        The response contains the site with status `updating`, and the
        job, whose result holds `pre_restore_backup_id`. If the job fails
        once the site's data was touched, it restores the pre-restore
        backup (and the previous WordPress core), and the site **stays in
        maintenance mode** with `status_message` saying what happened; turn
        maintenance mode off once the site has been checked. If rolling
        back fails too, the site is `failed` and `status_message` names the
        pre-restore backup, which can be restored like any other.

        A snapshot that isn't the source site's, a source site in another
        client group (restores stay within a client group, whose sites
        share one backup repository), or a snapshot from a WordPress core
        newer than any site image returns `422`, and nothing changes. The
        site must be `running` (`409` otherwise); a site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409` too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteRestore"
      responses:
        "202":
          description: The site, now updating, and the restore job.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/uploads:
    post:
      operationId: createUpload
      tags: [uploads]
      summary: Start an upload
      description: |
        Starts a resumable upload of a large file for a site import
        (`purpose: site_import`, with the `client_group_id` the new site will
        join) or a code deployment (`purpose: site_deploy`, with the
        `site_id` to deploy to). It needs the same permission as the import
        or deployment itself, and only its creator can send it, see it, or
        use it.

        Declare the file's exact size, at most `uploads.max_size_mb`
        (`422` if larger), and its SHA-256 checksum here or when completing
        the upload. Then send the content with `PATCH
        /api/v1/uploads/{upload_id}` in chunks of at most `max_chunk_bytes`,
        in order, and complete the upload with `POST
        /api/v1/uploads/{upload_id}/complete`. The import or deployment then
        takes the upload by its `id`.

        If a chunk fails, for example because the connection dropped, none
        of it counts: `GET /api/v1/uploads/{upload_id}` says how many bytes
        arrived (`received_bytes`), and the upload resumes with a chunk from
        there.

        An upload that no job has taken is removed once it goes
        `uploads.expiry_hours` (default 24) without a chunk (`expires_at`).
        One that a job has taken is removed when the job ends. Uploads are
        stored in the data directory, never in backups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreate"
      responses:
        "201":
          description: Upload started; send its first chunk.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/uploads/{upload_id}:
    parameters:
      - $ref: "#/components/parameters/UploadID"
    get:
      operationId: getUpload
      tags: [uploads]
      summary: Get an upload
      description: |
        Where the upload stands: after an interrupted chunk, resume from
        `received_bytes`. Only the upload's creator can see it; for anyone
        else it doesn't exist (`404`).
      responses:
        "200":
          description: The upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: appendUploadChunk
      tags: [uploads]
      summary: Send a chunk of an upload
      description: |
        Appends the request body, the file's bytes from `offset` on, to the
        upload. `offset` must equal the upload's `received_bytes` (`409`
        otherwise, with the expected offset in `detail`), and the chunk
        must hold at least one byte, at most `max_chunk_bytes` (`413`), and
        not go past the declared size (`413`). The chunk counts only once
        all of it has arrived and is on disk: if the request fails, send
        the same bytes again. One request at a time may send chunks of an
        upload (`409` meanwhile). A completed upload takes no more chunks
        (`409`).
      parameters:
        - name: offset
          in: query
          required: true
          description: Where in the file the chunk starts; the upload's current `received_bytes`.
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The chunk was stored; the upload after it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUpload
      tags: [uploads]
      summary: Cancel an upload
      description: |
        Removes an upload and its content. An upload a job has taken can't
        be removed (`409`); it goes when the job ends.
      responses:
        "204":
          description: Upload removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadID"
    post:
      operationId: completeUpload
      tags: [uploads]
      summary: Complete an upload
      description: |
        Finishes an upload that has received all its bytes (`409`
        otherwise): it checks the content against the SHA-256 checksum,
        given here or when the upload was started (`422` if neither, or if
        they differ), and makes the upload available to the import or
        deployment it is for (`status: complete`). If the content doesn't
        match the checksum, the upload is removed and the response is
        `422`: start a new one. Completing a complete upload again returns
        it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadComplete"
      responses:
        "200":
          description: The complete upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/deploy:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: deploySiteCode
      tags: [deployments]
      summary: Deploy a theme or plugin package
      description: |
        Queues a job that deploys a theme or plugin package into the site's
        `wp-content` (design doc §5.8), for CI pipelines and scripts using
        API tokens. Upload the package first, a zip or tar.gz, with
        `POST /api/v1/uploads` (`purpose: site_deploy`, this `site_id`), and
        pass its `upload_id`. The package goes to
        `wp-content/themes/<name>`, `wp-content/plugins/<name>`, or
        `wp-content/mu-plugins/<name>`; if all its files are in one
        top-level directory, as in theme and plugin zips, that directory is
        left out. WordPress only loads the top-level files of
        `mu-plugins`, so a must-use plugin deployed as a directory needs a
        loader file there.

        The job:

        1. checks the package before anything touches the site: plain
           files and directories only (no links or device files), no paths
           outside the package, at most 100,000 entries and 2 GiB unpacked;
        2. unpacks it as the site's user into a hidden directory next to
           the target;
        3. swaps it in with one atomic rename, keeping the previous version,
           and reloads PHP so no cached copy of the previous files keeps
           running: requests see either the old version or the new one,
           never a half-written copy;
        4. with `activate`, activates the theme or plugin with WP-CLI;
        5. purges the object cache and the page cache;
        6. checks the site's health: WordPress must load (WP-CLI), and the
           home page must answer without a server error (`5xx`);
        7. removes the previous version.

        If the health check or another step fails for good, the job rolls
        back: the previous version is swapped back (a first deployment is
        removed), a theme or plugin it activated is switched back, and the
        caches are purged again. The job then ends `failed` with the reason
        in its `error`. Its `result` holds `kind`, `name`, `path`, `files`,
        `bytes`, `replaced` (whether a previous version was replaced), and
        `activated`. The upload is removed when the job ends.

        The site must be `running` (`409` otherwise, as when another job
        works on it). An upload that doesn't exist, isn't the caller's, or
        was made for another site returns `422`; one that isn't complete,
        or that another job uses, `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteDeployment"
      responses:
        "202":
          description: Deployment job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/database/export:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: exportSiteDatabase
      tags: [database]
      summary: Export a site's database
      description: |
        Queues a job that dumps the site's database and compresses it with
        gzip (design doc §5.8). The dump is plain SQL without `CREATE
        DATABASE` or `USE` statements, so it imports into whichever database
        the importer selects, e.g. `gunzip < dump.sql.gz | mariadb mydb`.
        The site's own database password is never revealed. The site keeps
        serving throughout, and stopped sites can be exported too. The job
        runs after any other job working on the site.

        When the job has succeeded, its result holds `export_id`,
        `download_url` (the `GET` below), `size_bytes`, and `expires_at`.
        Download the dump with the same session or API token before it
        expires, one hour after it is ready by default
        (`database_export.ttl_seconds`); the file is then deleted. Every
        export and every download is recorded in the audit log.

        A site that is `provisioning` or `deleting`, or whose provisioning
        failed, returns `409`.
      responses:
        "202":
          description: Export job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/database/exports/{export_id}/download:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - name: export_id
        in: path
        required: true
        description: The `export_id` from the export job's result.
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: downloadSiteDatabaseExport
      tags: [database]
      summary: Download a database export
      description: |
        Returns the compressed dump of a finished export
        (`POST /api/v1/sites/{site_id}/database/export`) as
        `application/gzip`. It needs the same permission as starting an
        export (Operators and Admins; not `read-only` tokens), and each
        download is recorded in the audit log. An export that doesn't
        exist, isn't finished, belongs to another site, or has expired
        returns `404`; an expired export's file has been deleted.
      responses:
        "200":
          description: The compressed dump.
          headers:
            Content-Disposition:
              description: '`attachment` with the file name, `<site slug>-<export ID>.sql.gz`.'
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/core:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: getSiteCore
      tags: [sites]
      summary: Get a site's WordPress core updates
      description: |
        The site's WordPress core version and what the core rollout will do
        with it (design doc §5.5): the release it moves to next (`target`),
        the newest major release it may not move to yet (`pending`), its
        own and its client group's policy, and warnings about its branch.
        Minor and security releases (x.y.Z) roll out automatically, one
        site at a time and within the maintenance window if one is set
        (`updates` in the config file). Major releases (x.Y) wait for
        approval of the site or its client group, or for
        `updates.core.major_auto_approve_days`. A held site stays on its
        major branch and keeps getting the branch's minor and security
        releases.
      responses:
        "200":
          description: The site's core update status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteCore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/core/policy:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    put:
      operationId: setSiteCorePolicy
      tags: [sites]
      summary: Hold a site's core, or approve a major release
      description: |
        Replaces the site's own core update policy. `{"hold": true}` keeps
        the site on its current major branch, which still gets its minor
        and security releases. `{"approved_branch": "7.2"}` lets it move
        to the newest release of any branch up to 7.2; the branch must
        have site images. `{}` makes the site follow its client group
        again. A site's own policy wins over its group's. The change takes
        effect at the core rollout's next pass, which is queued at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorePolicyUpdate"
      responses:
        "200":
          description: The site's core update status with the new policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteCore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/core/update:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: updateSiteCore
      tags: [sites]
      summary: Update a site's WordPress core now
      description: |
        Queues the update to the site's `target` release (`GET
        /api/v1/sites/{site_id}/core`) now, outside the maintenance window
        and even if the rollout's update to it failed before. The job takes
        a pre-update backup (kind `pre_update`), recreates the site's
        `php` and `nginx` containers on the new release's images (both
        always carry the same WordPress core), runs `wp core update-db`,
        and checks the site's health (an HTTP request to the site and
        WP-CLI loading WordPress on the new core). If anything fails, it
        restores the pre-update backup if the database schema changed, and
        moves the site back to its previous images; `status_message` says
        what happened. A site without a `target` returns `409`, as does a
        site that isn't `running`, is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed.
      responses:
        "202":
          description: The site, now updating, and the core update job.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/client-groups/{client_group_id}/core-policy:
    parameters:
      - $ref: "#/components/parameters/ClientGroupID"
    get:
      operationId: getClientGroupCorePolicy
      tags: [client-groups]
      summary: Get a client group's core update policy
      description: The policy the group's sites follow unless they have one of their own.
      responses:
        "200":
          description: The group's core update policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorePolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setClientGroupCorePolicy
      tags: [client-groups]
      summary: Hold a client group's cores, or approve a major release
      description: |
        Like `PUT /api/v1/sites/{site_id}/core/policy`, for every site of
        the group that has no policy of its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorePolicyUpdate"
      responses:
        "200":
          description: The group's new core update policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorePolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/core-rollout:
    get:
      operationId: getCoreRollout
      tags: [sites]
      summary: Get the WordPress core rollout
      description: |
        The releases the platform has site images for, the maintenance
        window, and whether the rollout is halted. The rollout updates one
        site at a time and halts after `max_failures` failed site updates
        in a row (`updates.max_failures`), until it is resumed or new
        releases arrive. Sites whose update failed aren't tried again with
        the same release.
      responses:
        "200":
          description: The core rollout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoreRollout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/core-rollout/resume:
    post:
      operationId: resumeCoreRollout
      tags: [sites]
      summary: Resume a halted core rollout
      description: Lifts a halt, resets the failure count, and queues a rollout pass.
      responses:
        "200":
          description: The core rollout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoreRollout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      description: Newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          description: Only return jobs in this state.
          schema:
            $ref: "#/components/schemas/JobState"
        - name: target_type
          in: query
          description: Only return jobs whose target has this type.
          schema:
            $ref: "#/components/schemas/JobTargetType"
        - name: target_id
          in: query
          description: Only return jobs for this target.
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: A page of jobs. Step logs are omitted; get a job to see them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job, including its steps and step log
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List audit events (Admin only)
      description: |
        Newest first. Every authenticated state-changing request, every
        authorization denial, and every login and logout is recorded with its
        actor, action, target, result, and client address. Request bodies and
        secrets are never recorded. Events older than the configured retention
        (`audit.retention_days`) are deleted daily.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: actor_user_id
          in: query
          description: Only return events by this user.
          schema:
            $ref: "#/components/schemas/ID"
        - name: action
          in: query
          description: Only return events for this action, e.g. `site.delete`.
          schema:
            type: string
            maxLength: 100
        - name: target_type
          in: query
          description: Only return events whose target has this type, e.g. `site`.
          schema:
            type: string
            maxLength: 50
        - name: target_id
          in: query
          description: Only return events for this target.
          schema:
            $ref: "#/components/schemas/ID"
        - name: since
          in: query
          description: Only return events at or after this time.
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: until
          in: query
          description: Only return events before this time.
          schema:
            $ref: "#/components/schemas/Timestamp"
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pressfleet_session
      description: |
        Session cookie set by `POST /api/v1/auth/login`. Used by the dashboard.
        Unsafe requests must also send the `X-CSRF-Token` header (see CSRF
        protection above).
    bearerToken:
      type: http
      scheme: bearer
      description: "An API token created with `POST /api/v1/auth/tokens`, sent as `Authorization: Bearer <token>`."

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
        maxLength: 512
    TokenID:
      name: token_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    SSHKeyID:
      name: ssh_key_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    ClientGroupID:
      name: client_group_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    SiteID:
      name: site_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    UploadID:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"

  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    JobLocation:
      description: URL of the queued job (`/api/v1/jobs/{job_id}`).
      schema:
        type: string
        format: uri-reference

  responses:
    BadRequest:
      description: The request is malformed (invalid JSON, unknown parameter format, or body too large).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller's role or token scope doesn't allow this action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource doesn't exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state (for example, a duplicate name or a job already running for the target).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: The resource was available once and has been consumed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: The request is well-formed but fails validation. `errors` lists each invalid field.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableDomains:
      description: |
        A domain fails validation (`about:blank`), or its DNS records don't
        point at this host (type
        `https://github.com/rchouinard/pressfleet/blob/main/docs/configuration.md#dns-check`,
        title `DNS check failed`). Either way `errors` lists each domain's
        problem, and nothing was changed. A DNS check that couldn't run at
        all, because the control plane doesn't know this host's public
        address, has the DNS type, no `errors`, and says why in `detail`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ContentTooLarge:
      description: The request body is larger than the operation allows.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body has the wrong content type.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many failed attempts. Try again after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: Any other error, including `500` and `501 Not Implemented`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ID:
      type: string
      description: Opaque, server-assigned identifier.
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
      examples: ["01J9ZQ3V6T8K4M2N5P7R9S1X3Y"]

    Timestamp:
      type: string
      format: date-time
      examples: ["2026-09-26T17:25:00Z"]

    Problem:
      type: object
      description: RFC 9457 Problem Details. Additional members may be added.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type. `about:blank` means the HTTP status says it all.
          default: about:blank
          examples: ["about:blank"]
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          examples: ["Not Found"]
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code.
          examples: [404]
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: The request path that produced the problem.
        request_id:
          type: string
          description: The request ID (also in the `X-Request-ID` response header). Include it when reporting issues.
        errors:
          type: array
          description: Validation errors, one per invalid field (`422` only).
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, detail]
      properties:
        field:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid member of the request body, or the parameter name.
          examples: ["/php_version"]
        detail:
          type: string
          examples: ["must be one of 8.2, 8.3, 8.4"]

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"

    ReadinessCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          examples: ["database"]
        status:
          type: string
          enum: [ok, failed]
        error:
          type: string
          description: Why the check failed.

    Role:
      type: string
      description: Platform-wide role (design doc §4.6).
      enum: [admin, operator, viewer]

    Email:
      type: string
      format: email
      maxLength: 254

    Password:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 256

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256

    User:
      type: object
      required: [id, email, role, disabled, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
          description: Disabled users can't log in and their tokens are rejected.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        last_login_at:
          description: Null if the user has never logged in.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    CurrentUser:
      description: The authenticated user, and how they authenticated.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [auth_method, csrf_token]
          properties:
            auth_method:
              type: string
              enum: [session, token]
              x-enum-varnames: [AuthMethodSession, AuthMethodToken]
            csrf_token:
              description: |
                The session's CSRF token. Send it in the `X-CSRF-Token` header
                with every cookie-authenticated unsafe request. Null for bearer
                token authentication, which needs none.
              oneOf:
                - type: string
                - type: "null"

    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256
        new_password:
          $ref: "#/components/schemas/Password"

    UserCreate:
      type: object
      required: [email, password, role]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        role:
          $ref: "#/components/schemas/Role"

    UserUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean

    UserList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    TokenScope:
      type: string
      description: |
        What the token may do, intersected with its owner's current role
        (design doc §4.6). `full` allows everything the owner's role allows;
        `read-only` allows only read actions.
      enum: [full, read-only]

    ApiToken:
      type: object
      required: [id, name, scope, prefix, created_at, expires_at, last_used_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          description: A label to tell tokens apart.
          examples: ["CI deploys"]
        scope:
          $ref: "#/components/schemas/TokenScope"
        prefix:
          type: string
          description: The first characters of the token, so it can be recognized without revealing it.
          examples: ["pft_3kq9"]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          description: Null if the token never expires.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        last_used_at:
          description: Null if the token has never been used.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ApiTokenWithSecret:
      description: A newly created token, including its plaintext value. Returned only by `createApiToken`.
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The plaintext token. Store it now; it can't be retrieved again.

    ApiTokenCreate:
      type: object
      required: [name, scope]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scope:
          $ref: "#/components/schemas/TokenScope"
        expires_at:
          description: When the token stops working. Omit or send null for no expiry.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ApiTokenList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SshKey:
      type: object
      required: [id, name, type, fingerprint, public_key, created_at, last_used_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          description: A label to tell keys apart; the key's comment unless one was given.
          examples: ["dev@laptop"]
        type:
          type: string
          description: The key's algorithm.
          examples: ["ssh-ed25519"]
        fingerprint:
          type: string
          description: The key's SHA-256 fingerprint, as `ssh-keygen -l` prints it.
          examples: ["SHA256:uNiVztksCsDhcc0u9e8BujQXVUpKZIDTMczCvj3tD2s"]
        public_key:
          type: string
          description: The public key in authorized_keys format, without its comment.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          description: When the key last opened an SFTP session; null if never.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    SshKeyCreate:
      type: object
      required: [public_key]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          description: A label for the key. Defaults to the key's comment, or its type.
        public_key:
          type: string
          minLength: 1
          maxLength: 16384
          description: |
            One public key in authorized_keys format, as in a `.pub` file:
            `ssh-ed25519 AAAA... name@host`. Ed25519 (recommended), ECDSA,
            security key (`sk-`), and RSA keys of at least 2048 bits are
            accepted; DSA keys, certificates, and authorized_keys options
            are not.
          examples: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB7Wz8dE9FkE5o0B1QZq9kX0a8Qm3Yt0mC0hEo8dT0c7 dev@laptop"]

    SshKeyList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SshKey"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    ClientGroup:
      type: object
      required: [id, name, notes, site_count, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          examples: ["Acme Corp"]
        notes:
          type: string
          description: Free-form notes for the agency. Empty if unset.
        site_count:
          type: integer
          minimum: 0
          description: Number of sites in the group.
        backup_repository:
          description: |
            The group's backup repository, managed by the platform. Null until
            the repository has been initialized. Its encryption key is never
            exposed through the API.
          oneOf:
            - $ref: "#/components/schemas/BackupRepository"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    BackupKind:
      type: string
      description: |
        What asked for the backup: a user (`manual`), the site's backup
        schedule (`scheduled`), or a restore, which backs up its target site
        first so the restore can be undone (`pre_restore`), or a WordPress
        core update, which backs up its site first so a failed update can
        be reverted (`pre_update`).
      enum: [manual, scheduled, pre_restore, pre_update]

    BackupStatus:
      type: string
      enum: [running, succeeded, failed]

    Backup:
      type: object
      required: [id, site_id, client_group_id, kind, status, snapshot_id, wp_core_version, size_bytes, added_bytes,
        file_count, message, job_id, created_at, started_at, finished_at, expired_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        site_id:
          $ref: "#/components/schemas/ID"
        client_group_id:
          description: The client group whose backup repository holds the snapshot.
          allOf:
            - $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/BackupKind"
        status:
          $ref: "#/components/schemas/BackupStatus"
        snapshot_id:
          description: The Restic snapshot's ID; null until the backup has succeeded.
          oneOf:
            - type: string
              examples: ["3be90c95b9962949a5d839b7fd7adbef112b4a3d667f214a32989f615ce4f20b"]
            - type: "null"
        wp_core_version:
          type: string
          description: The site's WordPress core version when it was backed up. A restore needs at least this version.
          examples: ["6.9.1"]
        size_bytes:
          description: The size of the files backed up (the database dump and `wp-content`); null until the backup has succeeded.
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        added_bytes:
          description: |
            What the backup added to the repository after deduplication and
            compression; null until the backup has succeeded.
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        file_count:
          description: The number of files backed up; null until the backup has succeeded.
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        message:
          type: string
          description: |
            Why the backup failed, or a warning about a backup that succeeded
            without some files it couldn't read. Empty otherwise.
        job_id:
          description: The job that took the backup; null once the job is gone.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          description: When the latest attempt at the backup began.
          allOf:
            - $ref: "#/components/schemas/Timestamp"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        expired_at:
          description: |
            When the backup's snapshot was found to be gone from the
            repository, normally removed by the retention policy
            (`backup.retention`); it can no longer be restored. Null while it
            can.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    BackupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Backup"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    BackupIntervalHours:
      type: integer
      description: |
        Hours between backups: a divisor of 24 (1, 2, 3, 4, 6, 8, or 12) or a
        whole number of days up to a week (24, 48, ..., 168), so backups
        start at the same times every day.
      minimum: 1
      maximum: 168
      default: 24
      examples: [24]

    BackupHour:
      description: |
        The UTC hour, 0 to 23, that the site's backups start in, at a
        minute that is the same every day. With an interval shorter than a
        day, one of the day's backups starts in this hour. Null means a time
        within the platform's backup window.
      oneOf:
        - type: integer
          minimum: 0
          maximum: 23
          examples: [3]
        - type: "null"

    BackupSchedule:
      type: object
      required: [enabled, interval_hours, hour, next_run_at]
      properties:
        enabled:
          type: boolean
          description: Whether the site is backed up on a schedule.
        interval_hours:
          $ref: "#/components/schemas/BackupIntervalHours"
        hour:
          $ref: "#/components/schemas/BackupHour"
        next_run_at:
          description: |
            When the next scheduled backup is due; null if the schedule is
            off or the site can't be backed up (it is being deleted, or its
            provisioning failed). The backup starts then, or after any other
            job working on the site.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    BackupScheduleUpdate:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether the site is backed up on a schedule.
        interval_hours:
          $ref: "#/components/schemas/BackupIntervalHours"
        hour:
          $ref: "#/components/schemas/BackupHour"

    SiteDeployment:
      type: object
      required: [upload_id, kind, name]
      additionalProperties: false
      properties:
        upload_id:
          description: |
            A complete upload of the package, a zip or tar.gz, started by
            the caller for this site (`purpose: site_deploy`).
          allOf:
            - $ref: "#/components/schemas/ID"
        kind:
          type: string
          description: |
            Where the package goes: `theme` (`wp-content/themes`), `plugin`
            (`wp-content/plugins`), or `mu-plugin` (`wp-content/mu-plugins`).
          enum: [theme, plugin, mu-plugin]
        name:
          type: string
          description: |
            The target's directory name, which is also the theme's or
            plugin's slug for WP-CLI. An existing directory of that name is
            replaced.
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          examples: ["acme-theme"]
        activate:
          type: boolean
          default: false
          description: |
            Activate the theme or plugin once it is in place (not for
            `mu-plugin`, which is always active). A rolled-back deployment
            switches back to what was active before.

    SiteRestore:
      type: object
      required: [snapshot_id]
      additionalProperties: false
      properties:
        snapshot_id:
          type: string
          description: |
            The snapshot to restore: a backup's `snapshot_id`, or a prefix
            of it of at least 8 characters.
          minLength: 1
          maxLength: 64
          examples: ["3be90c95b9962949a5d839b7fd7adbef112b4a3d667f214a32989f615ce4f20b"]
        source_site_id:
          description: |
            The site the snapshot is of, in the same client group; omit it
            to restore one of the site's own snapshots. The source may have
            been deleted, as long as its backups are in the repository.
          allOf:
            - $ref: "#/components/schemas/ID"

    BackupRepository:
      type: object
      required: [location]
      properties:
        location:
          type: string
          description: Where the Restic repository lives (a local path or S3 URL), without credentials.
          examples: ["s3:https://s3.example.com/pressfleet-backups/01J9ZQ3V6T8K4M2N5P7R9S1X3Y"]

    ClientGroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 10000

    ClientGroupUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 10000

    ClientGroupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientGroup"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SiteStatus:
      type: string
      description: |
        Recorded lifecycle status of a site. `provisioning`, `updating`, and
        `deleting` mean a job is working on the site; `failed` means the last
        job failed (see `status_message`). What the containers are doing
        right now is the site's `runtime`.
      enum: [provisioning, running, stopped, updating, deleting, failed]

    SiteRuntime:
      type: object
      description: |
        The live state of the site's containers, observed when the site was
        read. Only `GET /api/v1/sites/{site_id}` includes it; listings report
        the recorded `status` alone.
      required: [phase]
      properties:
        phase:
          type: string
          description: |
            * `pending`: containers are starting or not healthy yet.
            * `running`: every container is running and healthy.
            * `stopped`: the containers are stopped.
            * `failed`: a container exited or is unhealthy (see `message`).
            * `absent`: the site has no containers, e.g. before provisioning
              starts them or after failed provisioning removed them.
            * `unknown`: the container runtime couldn't be reached in time;
              `status` is the last recorded status.
          enum: [pending, running, stopped, failed, absent, unknown]
        message:
          type: string
          description: Details about the phase, such as which container is unhealthy.

    PHPVersion:
      type: string
      description: A PHP version the platform publishes site images for.
      pattern: "^[0-9]+\\.[0-9]+$"
      examples: ["8.4"]

    ResourceLimits:
      type: object
      description: Limits for the site as a whole; the platform splits them between the site's containers.
      required: [cpu, memory_reservation_mb, memory_limit_mb]
      properties:
        cpu:
          type: string
          description: CPU limit in cores.
          pattern: "^[0-9]+(\\.[0-9]+)?$"
          examples: ["1.0"]
        memory_reservation_mb:
          type: integer
          minimum: 32
          description: Guaranteed memory baseline in MiB.
          examples: [128]
        memory_limit_mb:
          type: integer
          minimum: 64
          description: Hard memory limit in MiB, allowing bursts above the reservation. Must be at least `memory_reservation_mb`.
          examples: [512]

    ResourceLimitsUpdate:
      type: object
      description: Partial resource limits. Omitted fields keep their current value, or the platform default when creating a site.
      additionalProperties: false
      minProperties: 1
      properties:
        cpu:
          type: string
          pattern: "^[0-9]+(\\.[0-9]+)?$"
        memory_reservation_mb:
          type: integer
          minimum: 32
        memory_limit_mb:
          type: integer
          minimum: 64

    Site:
      type: object
      required:
        - id
        - client_group_id
        - name
        - slug
        - preview_domain
        - primary_domain
        - aliases
        - php_version
        - wp_core_version
        - resources
        - preview_protection
        - maintenance
        - status
        - parent_site_id
        - admin_credentials_available
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ID"
        client_group_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          examples: ["Acme marketing site"]
        slug:
          type: string
          description: Unique, URL-safe name assigned at creation. Forms the preview domain.
          examples: ["acme-marketing"]
        preview_domain:
          type: string
          description: "`<slug>.<preview-base-domain>`; always reachable over HTTPS."
          examples: ["acme-marketing.preview.agency.example"]
        primary_domain:
          description: The domain the site is served on once live (`POST /api/v1/sites/{site_id}/go-live`); null until then.
          oneOf:
            - type: string
              examples: ["www.acme.example"]
            - type: "null"
        aliases:
          type: array
          description: Additional domains that redirect to the primary domain, sorted. Empty until the site goes live; `PUT /api/v1/sites/{site_id}/aliases` changes them.
          items:
            type: string
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        wp_core_version:
          type: string
          description: WordPress core version of the site's images. Managed by the platform; `GET /api/v1/sites/{site_id}/core` shows its updates.
          examples: ["6.9.1"]
        resources:
          $ref: "#/components/schemas/ResourceLimits"
        preview_protection:
          $ref: "#/components/schemas/PreviewProtection"
        maintenance:
          type: boolean
          description: |
            Whether the site is in maintenance mode: its domains answer with
            the platform's maintenance page (design doc §5.4).
        status:
          $ref: "#/components/schemas/SiteStatus"
        status_message:
          type: string
          description: Details about the status, such as why the site failed.
        runtime:
          $ref: "#/components/schemas/SiteRuntime"
        url:
          type: string
          format: uri
          description: The site's current public URL (primary domain if live, else preview domain).
          examples: ["https://acme-marketing.preview.agency.example"]
        parent_site_id:
          description: Reserved for staging clones; always null in the MVP.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        admin_credentials_available:
          type: boolean
          description: Whether the initial WordPress admin credentials can still be retrieved.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    WordPressBranch:
      type: string
      description: A WordPress major branch (x.y).
      pattern: "^[0-9]+\\.[0-9]+$"
      examples: ["7.2"]

    CorePolicy:
      type: object
      required: [hold]
      properties:
        hold:
          type: boolean
          description: Keeps the site on its current major branch, which still gets its minor and security releases.
        hold_since:
          $ref: "#/components/schemas/Timestamp"
        approved_branch:
          $ref: "#/components/schemas/WordPressBranch"

    CorePolicyUpdate:
      type: object
      additionalProperties: false
      description: At most one of `hold` and `approved_branch`; neither clears the policy.
      properties:
        hold:
          type: boolean
        approved_branch:
          $ref: "#/components/schemas/WordPressBranch"

    CoreWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            `held_long`: held on an older branch for longer than
            `updates.core.hold_warning_days`. `branch_not_built`: the
            site's branch has no site images any more, so it gets no core
            updates. `branch_insecure`: wordpress.org reports the branch's
            newest release as insecure; it no longer gets security fixes.
          enum: [held_long, branch_not_built, branch_insecure]
        message:
          type: string

    SiteCore:
      type: object
      required: [version, branch, policy, client_group_policy, held, decided_by, warnings]
      properties:
        version:
          type: string
          examples: ["7.1.2"]
        branch:
          $ref: "#/components/schemas/WordPressBranch"
        policy:
          $ref: "#/components/schemas/CorePolicy"
        client_group_policy:
          $ref: "#/components/schemas/CorePolicy"
        held:
          type: boolean
          description: Whether a hold, the site's or its group's, keeps the site on its branch.
        approved_branch:
          $ref: "#/components/schemas/WordPressBranch"
        decided_by:
          type: string
          description: Whose hold or approval applies; `auto` is `updates.core.major_auto_approve_days`.
          enum: [default, site, client_group, auto]
        target:
          $ref: "#/components/schemas/CoreTarget"
        pending:
          $ref: "#/components/schemas/CorePending"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CoreWarning"
        last_failure:
          $ref: "#/components/schemas/CoreUpdateFailure"

    CoreTarget:
      type: object
      description: The release the site moves to at the rollout's next chance; absent if it is up to date as far as its policy allows.
      required: [version, kind]
      properties:
        version:
          type: string
        kind:
          type: string
          enum: [minor, major]

    CorePending:
      type: object
      description: The newest major release the site may not move to yet.
      required: [version, branch, reason]
      properties:
        version:
          type: string
        branch:
          $ref: "#/components/schemas/WordPressBranch"
        reason:
          type: string
          enum: [held, awaiting_approval]
        auto_approve_at:
          $ref: "#/components/schemas/Timestamp"

    CoreRelease:
      type: object
      required: [version, branch, insecure]
      properties:
        version:
          type: string
        branch:
          $ref: "#/components/schemas/WordPressBranch"
        published:
          type: string
          format: date
        insecure:
          type: boolean

    UpdateWindow:
      type: object
      description: The daily maintenance window, in UTC; absent if there is none.
      required: [start, hours]
      properties:
        start:
          type: string
          examples: ["02:00"]
        hours:
          type: integer

    CoreUpdateFailure:
      type: object
      description: A site's failed update to `version`, which the rollout doesn't retry.
      required: [site_id, version, message, failed_at]
      properties:
        site_id:
          $ref: "#/components/schemas/ID"
        version:
          type: string
        message:
          type: string
        failed_at:
          $ref: "#/components/schemas/Timestamp"

    CoreRollout:
      type: object
      required: [halted, consecutive_failures, max_failures, releases, failures]
      properties:
        halted:
          type: boolean
        halted_at:
          $ref: "#/components/schemas/Timestamp"
        halt_reason:
          type: string
        consecutive_failures:
          type: integer
        max_failures:
          type: integer
        window:
          $ref: "#/components/schemas/UpdateWindow"
        releases:
          type: array
          description: The WordPress releases with site images, newest first; one per branch.
          items:
            $ref: "#/components/schemas/CoreRelease"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/CoreUpdateFailure"

    SiteCreate:
      type: object
      required: [client_group_id, name, admin_email]
      additionalProperties: false
      properties:
        client_group_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name. The slug is derived from it.
        admin_email:
          $ref: "#/components/schemas/Email"
        admin_username:
          type: string
          minLength: 1
          maxLength: 60
          pattern: "^[A-Za-z0-9_.@-]+$"
          description: WordPress admin username. Defaults to a generated name.
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        resources:
          $ref: "#/components/schemas/ResourceLimitsUpdate"

    SiteImport:
      type: object
      required: [client_group_id, archive_upload_id, dump_upload_id]
      additionalProperties: false
      properties:
        client_group_id:
          $ref: "#/components/schemas/ID"
        archive_upload_id:
          $ref: "#/components/schemas/ID"
        dump_upload_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name. Defaults to the imported site's title.
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        resources:
          $ref: "#/components/schemas/ResourceLimitsUpdate"

    SiteImportAccepted:
      type: object
      required: [site_id, job]
      properties:
        site_id:
          $ref: "#/components/schemas/ID"
        job:
          $ref: "#/components/schemas/Job"

    SiteUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        resources:
          $ref: "#/components/schemas/ResourceLimitsUpdate"
        preview_protection:
          $ref: "#/components/schemas/PreviewProtectionUpdate"

    SiteAccepted:
      type: object
      required: [site, job]
      properties:
        site:
          $ref: "#/components/schemas/Site"
        job:
          $ref: "#/components/schemas/Job"
        preview_credentials:
          $ref: "#/components/schemas/PreviewCredentials"

    Domain:
      type: string
      description: |
        A host name, such as `www.acme.example`: letters, digits, and
        hyphens, at least two labels, no scheme, port, path, or wildcard.
        Internationalized names are given in their ASCII (`xn--`) form. It
        is stored in lower case without a trailing dot.
      minLength: 1
      maxLength: 253
      examples: ["www.acme.example"]

    SiteGoLive:
      type: object
      required: [primary_domain]
      additionalProperties: false
      properties:
        primary_domain:
          $ref: "#/components/schemas/Domain"
        aliases:
          type: array
          description: |
            Domains that redirect to the primary domain, each with a
            certificate of its own. They replace the site's aliases;
            omitted means none.
          maxItems: 20
          items:
            $ref: "#/components/schemas/Domain"
          examples: [["acme.example"]]
        skip_dns_check:
          type: boolean
          default: false
          description: |
            Skip the check that the domains resolve to this host, for hosts
            behind a CDN or load balancer. The certificates still need the
            domains to reach this host on port 80.

    SiteAliases:
      type: object
      required: [aliases]
      additionalProperties: false
      properties:
        aliases:
          type: array
          description: The site's aliases from now on; an empty list removes them all.
          maxItems: 20
          items:
            $ref: "#/components/schemas/Domain"
          examples: [["acme.example", "shop.acme.example"]]
        skip_dns_check:
          type: boolean
          default: false
          description: Skip the DNS check of new aliases, for hosts behind a CDN or load balancer.

    SiteMaintenance:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: "`true` shows the maintenance page on every domain of the site; `false` serves the site again."

    PreviewProtection:
      type: object
      description: |
        HTTP basic auth on the site's preview domain (design doc §5.1). The
        password is never part of the site; it is returned once, when it is
        generated.
      required: [enabled, username]
      properties:
        enabled:
          type: boolean
          description: Whether the preview domain asks for the credentials.
        username:
          description: Null until a preview password has been generated.
          oneOf:
            - type: string
              examples: ["acme-marketing"]
            - type: "null"

    PreviewProtectionUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
          description: |
            Turns protection on or off. Turning it on the first time
            generates the password, returned in `preview_credentials`.
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[!-9;-~]+$"
          description: Printable ASCII without spaces or colons. Defaults to the site's slug.

    PreviewCredentials:
      type: object
      description: The preview domain's basic auth login. Shown only once.
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          description: The plaintext password. Shown only once.

    PreviewPasswordAccepted:
      type: object
      required: [credentials, job]
      properties:
        credentials:
          $ref: "#/components/schemas/PreviewCredentials"
        job:
          $ref: "#/components/schemas/Job"

    SiteAdminCredentials:
      type: object
      required: [username, email, password, login_url]
      properties:
        username:
          type: string
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password
          description: The plaintext password. Shown only once.
        login_url:
          type: string
          format: uri
          examples: ["https://acme-marketing.preview.agency.example/wp-login.php"]

    SiteList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    JobState:
      type: string
      description: |
        * `queued`: waiting for a worker, for the first time or to retry after an error (`error` says which).
        * `running`: a worker is running the job's steps.
        * `rolling_back`: the job failed for good and is undoing the steps it started.
        * `succeeded`: every step completed. Terminal.
        * `failed`: the job failed and rolled back the resources it created. Terminal.
        * `rollback_failed`: the job failed and rolling back failed too, so
          resources may be left behind; the step errors say where. Terminal.
      enum: [queued, running, rolling_back, succeeded, failed, rollback_failed]

    JobTargetType:
      type: string
      description: "`platform` is for maintenance jobs such as audit log cleanup."
      enum: [site, client_group, platform]

    JobTarget:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/JobTargetType"
        id:
          $ref: "#/components/schemas/ID"

    JobStepState:
      type: string
      description: "`failed` means the step's last attempt failed; it may be retried."
      enum: [pending, running, succeeded, failed, rolled_back, rollback_failed]

    JobLogEntry:
      type: object
      required: [time, level, message]
      properties:
        time:
          $ref: "#/components/schemas/Timestamp"
        level:
          type: string
          enum: [info, warn, error]
        message:
          type: string

    JobStep:
      type: object
      required: [name, state, attempts, started_at, finished_at]
      properties:
        name:
          type: string
          examples: ["create_database"]
        state:
          $ref: "#/components/schemas/JobStepState"
        attempts:
          type: integer
          minimum: 0
        started_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        log:
          type: array
          description: Omitted from job lists.
          items:
            $ref: "#/components/schemas/JobLogEntry"

    Job:
      type: object
      required: [id, type, target, state, attempts, max_attempts, result, steps, created_at, updated_at, started_at, finished_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        type:
          type: string
          description: What the job does. New types are added over time; treat unknown values as opaque.
          examples: ["site.create", "site.update", "site.delete", "site.start", "site.stop", "site.go_live", "site.aliases"]
        target:
          $ref: "#/components/schemas/JobTarget"
        state:
          $ref: "#/components/schemas/JobState"
        error:
          type: string
          description: The most recent error. Present when the job failed, or is waiting to retry after an error.
        attempts:
          type: integer
          minimum: 0
          description: Attempts in the current phase. A job gets `max_attempts` attempts, then its rollback gets as many again.
        max_attempts:
          type: integer
          minimum: 1
        result:
          type: object
          additionalProperties: true
          description: |
            Outputs of the job, such as the IDs of what it created. Contents depend on the job type.
            Secret outputs appear as `{"secret_ref": "..."}` and are retrieved through the endpoint for that secret.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/JobStep"
        created_by:
          description: The user who started the job; null for jobs started by the platform.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    JobAccepted:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/Job"

    JobList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    AuditResult:
      type: string
      description: |
        * `success`: the request was allowed and succeeded.
        * `failure`: the request failed, e.g. validation, a conflict, or wrong login credentials.
        * `denied`: the caller's role or token scope doesn't allow the action.
      enum: [success, failure, denied]

    AuditEvent:
      type: object
      required: [id, occurred_at, actor_user_id, actor_token_id, action, target_type, target_id, result, source_ip]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        actor_user_id:
          description: The user who made the request. Null for a failed login. The user may since have been deleted.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        actor_token_id:
          description: The API token used, or null for a session.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        action:
          type: string
          description: |
            What was attempted: an authorization action such as `site.delete`,
            `user.update`, or `self.tokens.create`, or `self.login`.
          examples: ["site.delete"]
        target_type:
          description: The kind of target, e.g. `site`, `client_group`, `user`, or `api_token`. Null for actions on the platform or on collections.
          oneOf:
            - type: string
            - type: "null"
        target_id:
          description: The target's ID. Null when target_type is null.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        result:
          $ref: "#/components/schemas/AuditResult"
        source_ip:
          type: string
          description: The client address, after trusted proxies.
          examples: ["203.0.113.7"]
        details:
          type: object
          description: |
            Extra facts about some events, never secrets. SFTP sessions
            (`site.sftp.connect` when they start, `site.sftp.disconnect` when
            they end) record `session_id`, `site_slug`, `ssh_key_id`, and
            `key_fingerprint`; their end also records `bytes_received` and
            `bytes_sent` (by the gateway, from and to the client),
            `duration_seconds`, and `reason`. Absent for events without
            details.
          additionalProperties:
            type: string

    AuditEventList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    NextCursor:
      description: Pass as `cursor` to get the next page. Null on the last page.
      oneOf:
        - type: string
        - type: "null"

    UploadPurpose:
      type: string
      description: |
        What the upload is for: a site import's `wp-content` archive or SQL
        dump (`site_import`), or a theme or plugin package to deploy to a
        site (`site_deploy`). It decides the permission the upload needs,
        and only an import or deployment of that kind can take it.
      enum: [site_import, site_deploy]

    UploadStatus:
      type: string
      description: |
        `uploading` takes chunks; `complete` has all its bytes and a
        verified checksum, and waits for its import or deployment;
        `in_use` has been taken by one, and is removed when its job ends.
      enum: [uploading, complete, in_use]

    UploadCreate:
      type: object
      required: [purpose, size_bytes]
      additionalProperties: false
      properties:
        purpose:
          $ref: "#/components/schemas/UploadPurpose"
        client_group_id:
          description: The client group the imported site will join. Required for `site_import`; not allowed for `site_deploy`.
          allOf:
            - $ref: "#/components/schemas/ID"
        site_id:
          description: The site to deploy to. Required for `site_deploy`; not allowed for `site_import`.
          allOf:
            - $ref: "#/components/schemas/ID"
        filename:
          type: string
          description: The file's name, for display. No directories.
          maxLength: 255
          examples: ["wp-content.tar.gz"]
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: The file's exact size, at most `uploads.max_size_mb`.
        sha256:
          type: string
          description: The file's SHA-256 checksum in hex. Optional here; then required when completing the upload.
          pattern: "^[0-9A-Fa-f]{64}$"

    UploadComplete:
      type: object
      additionalProperties: false
      properties:
        sha256:
          type: string
          description: |
            The file's SHA-256 checksum in hex. Required unless it was given
            when the upload was started, and then it must match.
          pattern: "^[0-9A-Fa-f]{64}$"

    Upload:
      type: object
      required: [id, purpose, client_group_id, site_id, filename, size_bytes, received_bytes, sha256, status, job_id,
        max_chunk_bytes, created_at, updated_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        purpose:
          $ref: "#/components/schemas/UploadPurpose"
        client_group_id:
          description: The client group of the import or deployment.
          allOf:
            - $ref: "#/components/schemas/ID"
        site_id:
          description: The site to deploy to; null for imports.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        filename:
          type: string
        size_bytes:
          type: integer
          format: int64
          description: The file's declared size.
        received_bytes:
          type: integer
          format: int64
          description: How many bytes have arrived. The next chunk starts here.
        sha256:
          description: The declared SHA-256 checksum, lowercase hex; null until declared.
          oneOf:
            - type: string
            - type: "null"
        status:
          $ref: "#/components/schemas/UploadStatus"
        job_id:
          description: The job that took the upload; null unless `in_use`.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        max_chunk_bytes:
          type: integer
          format: int64
          description: The largest chunk one request may carry.
          examples: [33554432]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          description: |
            When the upload is removed as abandoned unless another chunk
            arrives or a job takes it; null while a job has it.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
