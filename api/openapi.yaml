openapi: 3.1.0
info:
  title: PressFleet API
  version: 0.1.0
  summary: Control plane API for the PressFleet WordPress application platform.
  description: |
    Spec-first API (design doc §4.5). This document is the source of truth;
    the Go server interfaces and the dashboard's TypeScript client are
    generated from it.

    ## Conventions

    * All API endpoints live under `/api/v1`. Breaking changes require a new
      version prefix; additive changes (new fields, endpoints, or enum values)
      do not, so clients must ignore unknown fields.
    * Request and response bodies are JSON. Field names are `snake_case`.
      Timestamps are RFC 3339 strings in UTC.
    * Long-running operations return `202 Accepted` with the queued job in the
      body and its URL in the `Location` header. Follow the job with
      `GET /api/v1/jobs/{job_id}/events`, or poll `GET /api/v1/jobs/{job_id}`,
      until it reaches a terminal state (`succeeded`, `failed`, or
      `rollback_failed`).
    * Every error response is an RFC 9457 Problem Details document
      (`application/problem+json`) that carries the request ID.
    * List endpoints use cursor pagination: pass `limit` and, for later pages,
      the `next_cursor` from the previous response as `cursor`. Cursors are
      opaque.

    ## Authentication

    Every operation requires authentication except login and the health
    endpoints. Unauthenticated requests get `401` with a `WWW-Authenticate`
    header.

    * **Session cookie (dashboard).** `POST /api/v1/auth/login` sets the
      `pressfleet_session` cookie (`HttpOnly`, `SameSite=Lax`, `Path=/`, and
      `Secure` when the request arrived over HTTPS). Sessions end after 12
      hours without use, 7 days after login, on logout, and when the user's
      password changes or the user is disabled.
    * **Bearer API token (automation).** Send `Authorization: Bearer pft_...`.
      Tokens are created with `POST /api/v1/auth/tokens` and shown only once.
      If an `Authorization` header is present, the cookie is ignored.

    ### CSRF protection

    Cookie-authenticated requests with an unsafe method (anything but `GET`,
    `HEAD`, and `OPTIONS`) must send the session's CSRF token in the
    `X-CSRF-Token` header. The token is returned as `csrf_token` by login and
    by `GET /api/v1/auth/me`. In addition, unsafe requests that don't use a
    bearer token (including login) are rejected if the browser marks them as
    cross-origin (`Sec-Fetch-Site`, or an `Origin` that doesn't match the
    host). Both failures return `403`. Bearer-token requests are exempt,
    because browsers never attach them automatically.

    ### Login throttling

    Failed logins return `401` without saying whether the email exists.
    Repeated failures for one account or from one client address are
    throttled with `429`, a `Retry-After` header, and the same delay as
    `retry_after` in the problem document.

    ## Authorization

    Each user has one platform-wide role: `admin`, `operator`, or `viewer`
    (design doc §4.6). A token's effective permissions are the intersection of
    its scope and its owner's current role. Denied requests get `403`.

    * Every role may read sites, client groups, and jobs, and manage its own
      password, API tokens, and SSH keys. Only Operators and Admins may
      connect to the SFTP gateway with their keys.
    * Operators and Admins may also create and change sites and client groups.
    * Only Admins may delete sites and client groups and manage users.
    * `read-only` tokens may only read, whatever the owner's role.

    Role changes apply to the user's existing sessions and tokens at once. The
    last enabled Admin can't be demoted, disabled, or deleted (`409`).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The control plane that serves this document.
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: health
    description: Liveness and readiness probes. Unauthenticated and outside `/api/v1`.
  - name: auth
    description: Sessions and the current user.
  - name: tokens
    description: The current user's API tokens.
  - name: users
    description: User management (Admin only).
  - name: ssh-keys
    description: |
      SSH public keys for the SFTP gateway (design doc §5.8). Developers
      connect with `sftp -P <port> <site-slug>@<dashboard domain>`: the SSH
      username names the site and the key names the user.
  - name: platform
    description: Facts about the install itself, such as connection details, capacity and preflight (doctor) results.
  - name: client-groups
    description: Client groups own sites and a backup repository.
  - name: sites
    description: WordPress sites.
  - name: backups
    description: Site backups, kept in the site's client group backup repository.
  - name: uploads
    description: Resumable uploads of large files for site imports and code deployments.
  - name: deployments
    description: Theme and plugin deployments for CI pipelines.
  - name: database
    description: Access to a site's database without its password (exports and temporary database sessions through the SFTP gateway).
  - name: exports
    description: |
      Site exports (design doc §5.7): a site's `wp-content` and database, from
      the live site or a backup, in the files a site import takes, to
      download before they expire.
  - name: jobs
    description: Long-running operations.
  - name: logs
    description: A site's runtime logs (nginx access and error, PHP-FPM slow log, PHP output) and the log lines of its jobs.
  - name: metrics
    description: |
      Curated, read-only metric queries for the dashboard's charts and
      overview (design doc §7.1, §7.2), backed by VictoriaMetrics. Clients
      name metrics from a catalog; they never send queries. Every role can
      read.
  - name: audit
    description: The audit log (Admin only).
  - name: alerts
    description: |
      Alert rules, evaluated against the metrics in VictoriaMetrics, and the
      alerts they raise (design doc §7.3), and the channels (email and
      webhook) that deliver them. Every role can read; Operators and Admins
      manage rules, and Admins manage channels.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: Returns `200` while the process is running. Performs no dependency checks.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe
      description: Runs every registered readiness check (for example, the state database). Returns `503` if any check fails.
      security: []
      responses:
        "200":
          description: Every check passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in and start a session
      description: |
        Verifies the credentials and sets the session cookie. The response body
        is the logged-in user. Failed logins return `401` without revealing
        whether the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              description: The session cookie (`HttpOnly`, `SameSite=Lax`, and `Secure` over HTTPS).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Deletes the session. With a bearer token there is no session, and the call only clears the cookie.
      responses:
        "204":
          description: Logged out; the session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user
      description: Also returns the session's CSRF token, so the dashboard can recover it after a page reload.
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update the authenticated user's profile
      description: Currently only the display name. Send an empty string to clear it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      description: |
        Requires the current password. Signs out the user's other sessions and
        revokes all of their API tokens (including the one making the request,
        if any); the current session stays signed in. A wrong current password
        returns `422` and counts toward login throttling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/tokens:
    get:
      operationId: listApiTokens
      tags: [tokens]
      summary: List the current user's API tokens
      description: Token secrets are never returned after creation.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiToken
      tags: [tokens]
      summary: Create an API token for the current user
      description: |
        The response contains the plaintext token. It is shown only once and
        cannot be retrieved again; only a hash is stored.

        When the request itself is authenticated with an API token, the new
        token can't be broader than it: a read-only token can't create tokens
        at all, and a token with an expiry can only create tokens that expire
        no later. Violations return `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: Token created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeApiToken
      tags: [tokens]
      summary: Revoke one of the current user's API tokens
      description: Revocation takes effect immediately.
      responses:
        "204":
          description: Token revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: role
          in: query
          description: Only return users with this role.
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      description: |
        Changes apply immediately to the user's existing sessions and tokens.
        Setting a password or disabling the user signs them out everywhere and
        revokes their API tokens; re-enabling a user doesn't restore them.
        Demoting or disabling the last Admin returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: Also revokes the user's sessions, tokens, and SSH keys. Deleting the last Admin returns `409`.
      responses:
        "204":
          description: User deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/me/ssh-keys:
    get:
      operationId: listOwnSshKeys
      tags: [ssh-keys]
      summary: List the current user's SSH keys
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of SSH keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addOwnSshKey
      tags: [ssh-keys]
      summary: Register an SSH public key for the current user
      description: |
        Registers a public key for the SFTP gateway. Only public keys are
        accepted, and only key login is possible: the gateway has no
        passwords. A key can belong to one user only; registering a key that
        is already registered, to anyone, returns `409`.

        Every role may register keys, but only Operators and Admins may
        connect with them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SshKeyCreate"
      responses:
        "201":
          description: Key registered.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/me/ssh-keys/{ssh_key_id}:
    parameters:
      - $ref: "#/components/parameters/SSHKeyID"
    delete:
      operationId: deleteOwnSshKey
      tags: [ssh-keys]
      summary: Remove one of the current user's SSH keys
      description: |
        Takes effect immediately: new connections with the key are refused,
        and open SFTP sessions using it are ended within seconds.
      responses:
        "204":
          description: Key removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{user_id}/ssh-keys:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: listUserSshKeys
      tags: [ssh-keys]
      summary: List a user's SSH keys (Admin only)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of SSH keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addUserSshKey
      tags: [ssh-keys]
      summary: Register an SSH public key for a user (Admin only)
      description: Like `addOwnSshKey`, for another user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SshKeyCreate"
      responses:
        "201":
          description: Key registered.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{user_id}/ssh-keys/{ssh_key_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/SSHKeyID"
    delete:
      operationId: deleteUserSshKey
      tags: [ssh-keys]
      summary: Remove one of a user's SSH keys (Admin only)
      description: Like `deleteOwnSshKey`, for another user.
      responses:
        "204":
          description: Key removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/client-groups:
    get:
      operationId: listClientGroups
      tags: [client-groups]
      summary: List client groups
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of client groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroupList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createClientGroup
      tags: [client-groups]
      summary: Create a client group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientGroupCreate"
      responses:
        "201":
          description: Client group created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/client-groups/{client_group_id}:
    parameters:
      - $ref: "#/components/parameters/ClientGroupID"
    get:
      operationId: getClientGroup
      tags: [client-groups]
      summary: Get a client group
      responses:
        "200":
          description: The client group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateClientGroup
      tags: [client-groups]
      summary: Update a client group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientGroupUpdate"
      responses:
        "200":
          description: The updated client group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteClientGroup
      tags: [client-groups]
      summary: Delete a client group
      description: |
        A client group that still has sites can't be deleted (`409`). Nor
        can one that still has a backup repository, unless
        `delete_backup_repository` is true: offboarding exports the backups
        it should keep first (`POST
        /api/v1/client-groups/{client_group_id}/backups/{backup_id}/export`,
        or `pressfleet repository export` for the whole repository).

        With `delete_backup_repository`, a group that has a repository is
        deleted by a job, as `DELETE
        /api/v1/client-groups/{client_group_id}/backup-repository` would,
        except that the group is deleted too once the repository is gone
        (`202`). This takes the `client_group.offboard` permission. A group
        without a repository is deleted at once either way (`204`).
      parameters:
        - name: delete_backup_repository
          in: query
          description: Also permanently delete the group's backup repository, every backup in it, and its password.
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: The group has a backup repository; a job deleting it and then the group was queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "204":
          description: Client group deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List sites
      description: |
        Newest first. Listings come from the recorded state alone, so they
        omit `runtime`; get a site for its live state.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: client_group_id
          in: query
          description: Only return sites in this client group.
          schema:
            $ref: "#/components/schemas/ID"
        - name: status
          in: query
          description: Only return sites with this status.
          schema:
            $ref: "#/components/schemas/SiteStatus"
      responses:
        "200":
          description: A page of sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site
      description: |
        Starts the one-click provisioning workflow (design doc §5.1). The site
        record is created immediately with status `provisioning`; the job
        creates the database and containers and installs WordPress.

        The generated WordPress admin password is stored encrypted and can be
        retrieved exactly once with
        `POST /api/v1/sites/{site_id}/admin-credentials`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
      responses:
        "202":
          description: Provisioning job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/import:
    post:
      operationId: importSite
      tags: [sites]
      summary: Import a site
      description: |
        Imports an existing WordPress site from a `wp-content` archive and a
        SQL dump (design doc §5.7) into a new site in a client group. Send
        both files through the upload API first (`POST /api/v1/uploads` with
        purpose `site_import` and the same `client_group_id`), then name the
        complete uploads here. The job takes the uploads, which no other job
        can then use; they are removed when the job ends.

        * The archive is a `.tar.gz`, `.tar.bz2`, `.tar`, or `.zip` file of
          the site's `wp-content` directory: its contents at the top, a
          `wp-content` directory, or a whole WordPress install with one.
          Symbolic links and other special entries are skipped; absolute
          paths and `..` are refused.
        * The dump is a `.sql` or `.sql.gz` file of the site's database, as
          `wp db export`, mysqldump, mariadb-dump, or phpMyAdmin write
          them. `DEFINER` clauses, `CREATE DATABASE` and `USE` statements,
          and MySQL GTID statements are removed before it is imported.

        The archive and dump are large, so they are checked by the job's
        first step (`validate`), **before the site is created**: an archive
        without a `wp-content` directory, a dump that isn't a readable dump
        of one WordPress site's database, a multisite network, or a
        database from a WordPress core newer than the newest site image
        fails the job, and no site is created. The site's table prefix,
        source URL, and core version are read from the dump.

        The site is then created like `POST /api/v1/sites` (status
        `provisioning`, on the newest core, named after the imported site's
        title unless `name` is given) with the dump's table prefix; its
        `wp-content` is replaced with the archive's, the dump is imported,
        `wp core update-db` runs, the source's `siteurl` and `home` URLs are
        rewritten to the preview URL (`http` and `https` alike), and the
        default plugin stack is applied. The previous host's drop-ins
        (`object-cache.php`, `advanced-cache.php`, `db.php`) are replaced by
        the platform's; its must-use plugins are kept and reported as
        warnings in the job's log. The site keeps its own WordPress users,
        so no admin credentials are generated. The source's `wp-config.php`
        is never imported.

        The response holds the new site's ID, which `GET
        /api/v1/sites/{site_id}` finds once the job has created it, and the
        job, whose result holds `site_id`, `source_url`, and
        `table_prefix`. A job that fails after the site was created deletes
        the site again, with its containers, database, and data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteImport"
      responses:
        "202":
          description: Import job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteImportAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a site
      description: |
        Returns the site with its live runtime state in `runtime`, read from
        the container runtime with a short timeout. If the container runtime
        can't be reached, `runtime.phase` is `unknown` and `status` is the
        last recorded status; the request still succeeds.
      responses:
        "200":
          description: The site, including its live runtime status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a site's settings
      description: |
        Changes the PHP version, resource limits, or preview password
        protection. The settings are validated, saved as the site's desired
        state, and applied by a job that recreates the affected containers
        (design doc §5.5); changing the PHP version recreates the `php`
        container on the new image. The response contains the site with the
        requested settings and status `updating`, and the job. A stopped
        site stays stopped and runs with the new settings when started.

        `preview_protection.enabled` turns HTTP basic auth on the preview
        domain on or off (design doc §5.1); production domains are never
        protected. The platform generates the password the first time
        protection is turned on and returns it in `preview_credentials` of
        this response only; it is never shown again, but can be replaced
        with `POST /api/v1/sites/{site_id}/preview-password`. Turning
        protection off keeps the credentials, so turning it on again
        restores them. The username defaults to the site's slug.

        If the job fails, it reverts: the previous settings are applied and
        saved again, the status returns to what the containers are doing,
        and `status_message` says why the update failed. Only if reverting
        fails too is the site marked `failed`.

        A site that is `provisioning`, `updating`, or `deleting`, or whose
        provisioning failed, can't be changed (`409`). The PHP version is
        only validated when it changes, so a site on a PHP version past end
        of life can still get new resource limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
      responses:
        "202":
          description: Update job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site
      description: |
        Queues a job that removes the site's containers, network, volumes,
        database, secrets, and rendered files. The site's status becomes
        `deleting`; the site disappears when the job succeeds.

        The site's backups stay unless `delete_backups` is `true`: they can
        still be listed (`deleted=true`), exported, and restored into another
        site of the client group. With `delete_backups=true` the job also
        removes all of the site's snapshots from the client group's
        repository (other sites' snapshots stay), prunes the data only they
        used, and deletes the site's backup records; its result has
        `forgotten_snapshots` and `deleted_backup_records`. That can't be
        undone, and needs the `site.delete_with_backups` permission, which
        the audit log records instead of `site.delete`. The backups go after
        the site's other resources, so a deletion that fails earlier leaves
        them all in place. If a deletion job is already queued or running, it
        is returned with the choice it was queued with.
      parameters:
        - name: delete_backups
          in: query
          description: Also delete the site's backups. Defaults to `false`.
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Deletion job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/start:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: startSite
      tags: [sites]
      summary: Start a stopped site
      description: |
        Queues a job that starts the site's containers and waits for them to
        be healthy, then sets the status to `running`. The status doesn't
        change until then. Starting a running site succeeds without changing
        it. If the job fails, the site is marked `failed` with the reason in
        `status_message`. A site that is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed, returns `409`.
      responses:
        "202":
          description: Start job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/stop:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: stopSite
      tags: [sites]
      summary: Stop a running site
      description: |
        Queues a job that stops the site's containers, keeping its data,
        then sets the status to `stopped`. A stopped site stays stopped when
        Docker restarts, and WP-Cron doesn't run for it. Stopping a stopped
        site succeeds without changing it. If the job fails, the site is
        marked `failed` with the reason in `status_message`. A site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409`.
      responses:
        "202":
          description: Stop job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/cache/purge:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: purgeSiteCache
      tags: [sites]
      summary: Purge a site's caches
      description: |
        Queues a job that empties the site's object cache (its database on
        the shared object cache server), then its page cache (the FastCGI
        cache nginx keeps), so the next requests are rendered afresh. The
        site keeps serving throughout and its status doesn't change; stopped
        sites are purged too. WordPress already purges the pages a change
        affects when content is published or edited (Nginx Helper); this is
        for everything else, such as a theme change or an edit made directly
        in the database. A site that is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed, returns `409`.
      responses:
        "202":
          description: Cache purge job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/admin-credentials:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: retrieveSiteAdminCredentials
      tags: [sites]
      summary: Retrieve the initial WordPress admin credentials (once)
      description: |
        Returns the WordPress admin credentials generated when the site was
        created, then discards the stored password. Later calls return `410`,
        as do calls for a site whose provisioning failed. While the site is
        still being provisioned the credentials aren't usable yet, and the
        call returns `409`. This is a `POST` because it changes state.
      responses:
        "200":
          description: The initial admin credentials. They can't be retrieved again.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAdminCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/admin-login:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: createSiteAdminLogin
      tags: [sites]
      summary: Get a one-click WordPress admin login
      description: |
        Signs a short-lived (60 seconds), single-use token that logs the
        calling platform user in to the site's wp-admin as a WordPress
        administrator, without a WordPress password (design doc §5.9).
        Needs an Operator or Admin; Viewers and `read-only` tokens get
        `403`. The caller submits `token` to `url` as a form field named
        `token` in a `POST`, so it never appears in a URL or a log.

        Without `user`, the administrator the platform created with the
        site is used. If that user was deleted or is no longer an
        administrator, or the site was imported and has none, the call
        returns `409` with the problem type
        `https://github.com/rchouinard/pressfleet/blob/main/docs/pressfleet_architecture_and_implementation_document.md#59-dashboard-login-to-wordpress`
        ("choose a user"): list the candidates with `GET
        /sites/{site_id}/administrators` and send the call again with
        `user`. With `user`, the user must be an administrator of the
        site, or the call returns `422`. Other `409` responses mean the site
        isn't running or is in maintenance mode.

        Every issued token is an audit event (`site.admin_login`) with the
        WordPress user and the token's `jti` in `details`, never the token.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginCreate"
      responses:
        "200":
          description: A login token.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/administrators:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: listSiteAdministrators
      tags: [sites]
      summary: List the site's WordPress administrators
      description: |
        Lists the WordPress users with the administrator role, read with
        WP-CLI, so a caller can choose whom `POST
        /sites/{site_id}/admin-login` logs in. It needs the same permission
        as that call, because it lists WordPress users. Returns `409` if
        the site isn't running.
      responses:
        "200":
          description: The site's administrators.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAdministratorList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/maintenance:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    put:
      operationId: setSiteMaintenance
      tags: [sites]
      summary: Turn maintenance mode on or off
      description: |
        Records whether the site is in maintenance mode and queues a job
        that applies it (design doc §5.4). In maintenance mode, every domain
        of the site answers `503 Service Unavailable` with `Retry-After` and
        the platform's maintenance page, served by the edge router without
        the site's containers; WP-CLI and other platform tasks keep working.
        The change takes effect a few seconds after the job has finished,
        and stays across updates and restarts until it is turned off. The
        site's `status` doesn't change. If the job fails, the previous
        setting is restored. A site that is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed, returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteMaintenance"
      responses:
        "202":
          description: The site with the recorded setting, and the job that applies it.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/go-live:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: goLiveSite
      tags: [sites]
      summary: Switch a site to its primary domain
      description: |
        Sets the site's primary domain and aliases and queues a job that
        switches the site to them (design doc §5.2):

        1. The edge router routes the primary domain and each alias, and
           gets a certificate for each with the ACME HTTP-01 challenge. The
           site's containers aren't recreated.
        2. WordPress's URLs are rewritten from the preview domain (and any
           earlier primary domain) to `https://<primary_domain>` with
           `wp search-replace`, serialized data included and GUIDs left
           alone, and `home` and `siteurl` are set to it.
        3. The site's object cache and page cache are purged.

        From then on, the preview domain and the aliases answer with a
        permanent redirect (`301`) to the primary domain that keeps the path
        and query. A protected preview domain asks for its password before
        redirecting. The primary domain and aliases never ask for the
        preview password, never send `X-Robots-Tag: noindex`, and, when the
        platform's security headers are on, send
        `Strict-Transport-Security: max-age=31536000` (without
        `includeSubDomains`).

        **DNS check.** Before anything changes, the control plane checks
        that each domain the site doesn't have yet resolves (A and AAAA) to
        this host only: to `public_ip` or the dashboard domain's addresses.
        If one doesn't, the request fails with `422` and the problem type
        `https://github.com/rchouinard/pressfleet/blob/main/docs/configuration.md#dns-check`,
        with one entry in `errors` per domain saying what it resolves to and
        where it should point. Nothing is recorded; send the request again
        once the records have propagated. Hosts behind a CDN or load
        balancer, whose domains resolve elsewhere, set `skip_dns_check`.

        The response contains the site with the new domains and status
        `updating`, and the job. If the job fails before WordPress's URLs
        are rewritten, it reverts: the previous domains and routes are back
        and `status_message` says why. If it fails later, the site keeps its
        new domains and `status_message` says the go-live didn't finish;
        going live again with the same domains finishes it.

        Going live again with another primary domain moves the site: the
        old primary domain's URLs are rewritten too, and it stops being
        served unless it is listed as an alias. Going back to the preview
        domain alone isn't supported.

        The site must be `running` (`409` otherwise). A site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409` too. A domain under the preview base domain,
        the dashboard's domain, or one another site uses is refused with
        `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteGoLive"
      responses:
        "202":
          description: The site with its new domains, and the job that applies them.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableDomains"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/aliases:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    put:
      operationId: setSiteAliases
      tags: [sites]
      summary: Replace a live site's aliases
      description: |
        Replaces the aliases of a site that has gone live and queues a job
        that routes them (design doc §5.2). Each alias gets a certificate
        of its own with the ACME HTTP-01 challenge and answers with a
        permanent redirect (`301`) to the primary domain, keeping the path
        and query (with HSTS when the platform's security headers are on).
        Aliases no longer listed stop being served. The change takes effect
        within seconds of the job finishing, without recreating the site's
        containers, so the site keeps serving throughout. WordPress's
        content and caches aren't touched: aliases only redirect.

        New aliases get the same DNS check as go-live, and fail it the same
        way (`422` with the DNS problem type, nothing changed);
        `skip_dns_check` skips it. Aliases the site has already aren't
        checked again. The site's status is `updating` until the job has
        finished; if the job fails, the previous aliases are restored.

        A site that hasn't gone live returns `409`; so does one that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed. A stopped site can change its aliases.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteAliases"
      responses:
        "202":
          description: The site with its new aliases, and the job that applies them.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableDomains"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/preview-password:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: regenerateSitePreviewPassword
      tags: [sites]
      summary: Generate a new preview password (shown once)
      description: |
        Replaces the password of the site's preview domain protection
        (design doc §5.1) with a newly generated one, returns it, and queues
        a job that applies it; the old password stops working when the job
        has finished. The password is returned by this response only. It
        can be generated whether or not protection is on; with protection
        off, it is kept for when it is turned on. The site's status is
        `updating` until the job has finished. A site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409`.
      responses:
        "202":
          description: The new credentials, and the job that applies them.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPasswordAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/logs:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: listSiteLogs
      tags: [logs]
      summary: Read a site's runtime logs
      description: |
        The site's nginx access and error logs, PHP-FPM slow log, and PHP
        output (design doc §7.4), read from the site's containers through
        the orchestrator driver. A stopped site's logs can be read. Logs
        are kept only as long as the container log rotation allows (a few
        tens of megabytes per container), so old entries disappear.

        Every entry has a `source`: `access` (one request, as the JSON
        object nginx writes), `error` (nginx), `slow` (PHP-FPM slow log;
        one entry per line of a stack trace, which starts at the line that
        names the pool and pid), and `php` (PHP errors and warnings,
        PHP-FPM messages, and anything a plugin prints). Sources are told
        apart by their content, so they work the same on every
        orchestrator. `level` is derived the same way: access entries are
        `info`, `warn` for 4xx, `error` for 5xx; the other sources use the
        level the line names, and slow log entries are `warn`.

        **Pagination.** This endpoint pages backwards through time, the way
        a log viewer scrolls. Without a `cursor` it returns the newest
        `limit` entries that match the filters. Each page lists its
        entries oldest first, and `next_cursor` is set when there are
        older matches: pass it as `cursor` for the next, older page.
        Entries with the same timestamp are never split across pages, so a
        page can hold a few more than `limit`. `since` and `until` bound
        the window the pages cover (`until` is exclusive); a cursor
        continues below its page, but never past `since`. To load only
        what is new, call again with `since` set to the time of the newest
        entry you have plus a nanosecond, or use
        `GET /api/v1/sites/{site_id}/logs/stream`.

        All filters combine. A site that has no runtime yet (still being
        created) has no logs and returns an empty page.
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogQuery"
        - name: since
          in: query
          description: Only return entries at or after this time.
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: until
          in: query
          description: Only return entries before this time.
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: limit
          in: query
          description: Maximum number of entries to return in a page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of log entries, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteLogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/logs/stream:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: streamSiteLogs
      tags: [logs]
      summary: Follow a site's runtime logs
      description: |
        Streams the site's logs as server-sent events (`text/event-stream`)
        until the client disconnects: first the newest `tail` entries that
        match the filters, then new entries as the site writes them. The
        entries are the ones `GET /api/v1/sites/{site_id}/logs` returns;
        the filters mean the same, and the stream follows the same sources.

        Server-sent events fit because the stream only flows one way, they
        run over the same HTTP connection and cookie session as the rest of
        the API (a browser's `EventSource` reconnects by itself and needs
        no extra client library), and they work through reverse proxies
        that buffer nothing. Clients that authenticate with a bearer token
        read the response as a stream with `fetch`. The generated client
        doesn't wrap this operation; use `EventSource` or `fetch`.

        Event types:

        * `log`: `data` is one `SiteLogEntry` as JSON, and `id` is the
          entry's timestamp in nanoseconds since the Unix epoch. A client
          that reconnects sends it back as `Last-Event-ID` (a browser does
          so on its own), and the stream continues after that entry
          instead of repeating the tail.
        * `error`: `data` is a Problem Details document, sent once before
          the stream ends because of a failure on the server (for
          example, the site was deleted). Clients should not reconnect
          immediately.
        * Comment lines (`: keepalive`) are sent every 15 seconds so
          proxies don't close an idle stream. Ignore them.

        Problems that exist before the stream starts (an invalid filter,
        a missing site) are ordinary Problem Details responses with the
        usual status. A site that has no runtime yet returns `409`.
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogQuery"
        - name: tail
          in: query
          description: |
            How many of the newest matching entries to send before
            following. `0` sends only new entries.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 100
        - name: Last-Event-ID
          in: header
          description: |
            The `id` of the last `log` event the client received. Sent by
            `EventSource` when it reconnects. When present, the stream
            sends the entries after it instead of the tail.
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: An open event stream.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent events as described above. The `data` of a
                  `log` event is a `SiteLogEntry`.
                examples:
                  - |
                    id: 1790856000123456789
                    event: log
                    data: {"time":"2026-10-01T12:00:00.123456789Z","component":"php","source":"php","level":"warn","stream":"stderr","message":"PHP Warning:  Undefined variable $x"}

                    : keepalive
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/job-logs:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: listSiteJobLogs
      tags: [logs]
      summary: Read the log lines of a site's jobs
      description: |
        The log lines that jobs for this site wrote (creating, updating,
        backing up, restoring, deploying, and so on; design doc §7.4),
        across all of the site's jobs, newest first, so the dashboard can
        show what the platform did to a site without opening each job. Each
        line names its job and step. Use `GET /api/v1/jobs/{job_id}` for
        one job's steps and complete log, and `GET /api/v1/jobs` with
        `target_type=site&target_id=<site_id>` to list the jobs.

        Pass `next_cursor` as `cursor` for the next, older page. A site
        that has no jobs, or whose jobs wrote no log, returns an empty page.
      parameters:
        - name: limit
          in: query
          description: Maximum number of lines to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of job log lines, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteJobLogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/platform/doctor:
    get:
      operationId: getPlatformDoctor
      tags: [platform]
      summary: Run the platform's preflight checks
      description: |
        Runs the checks of `pressfleet doctor` (design doc §4.1) and returns
        their results in the shape of `pressfleet doctor --json`. The control
        plane runs in a container and never calls `docker`, so checks that
        need the host (Docker Engine and Compose, cgroups, address pools,
        ports, log rotation) are reported with status `unavailable`, not
        `fail`; run `pressfleet doctor` on the host for those. `unavailable`
        results do not affect `outcome`. Every role can read.
      responses:
        "200":
          description: The check results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/metrics/catalog:
    get:
      operationId: getMetricCatalog
      tags: [metrics]
      summary: List the metrics that can be queried
      description: |
        Every metric of design doc §7.1 (per site) and §7.2 (platform) that
        the metrics endpoints serve, with its title, unit, and scope, and the
        limits that apply to a query. The catalog is the same whether or not
        a collector feeds a metric yet: a metric without data returns no
        series.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/metrics/platform:
    get:
      operationId: queryPlatformMetrics
      tags: [metrics]
      summary: Query platform metrics over time
      description: |
        Time series of platform metrics (host, MariaDB, Redis, jobs) and
        per-client-group metrics (backup repository size), for charts.
        Select metrics with `metric` and `group` (see the catalog); the
        request needs at least one. Without `start`, `end`, and `step` the
        last hour is returned with a step chosen to keep the chart light.
        `start` and `end` are aligned down to `step`, and `end` is capped at
        the current time; the response says what was queried.

        A metric that has no data (no collector feeds it yet, or the
        client group has none) is returned with an empty `series` list. If
        the metrics store is unavailable the response is `503`.
      parameters:
        - $ref: "#/components/parameters/MetricIDs"
        - $ref: "#/components/parameters/MetricGroups"
        - name: client_group_id
          in: query
          description: Only return per-client-group metrics of this client group.
          schema:
            $ref: "#/components/schemas/ID"
        - $ref: "#/components/parameters/MetricStart"
        - $ref: "#/components/parameters/MetricEnd"
        - $ref: "#/components/parameters/MetricStep"
      responses:
        "200":
          description: The time series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsRange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/MetricsUnavailable"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/metrics/platform/summary:
    get:
      operationId: getPlatformMetricsSummary
      tags: [metrics]
      summary: Current values of platform metrics
      description: |
        The latest value of platform metrics, from instant queries, for the
        overview. Without `metric` and `group`, a small default set is
        returned. Rates and ratios cover the last five minutes.
      parameters:
        - $ref: "#/components/parameters/MetricIDs"
        - $ref: "#/components/parameters/MetricGroups"
        - name: client_group_id
          in: query
          description: Only return per-client-group metrics of this client group.
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: The current values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/MetricsUnavailable"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/platform/capacity:
    get:
      operationId: getPlatformCapacity
      tags: [metrics]
      summary: Host memory capacity and site memory reservations
      description: |
        The memory the sites reserve, counted from every site that is not
        stopped or deleting (a failed site may be half-built, so it counts),
        against the host's memory (design doc §4.1). `level` applies the
        platform's thresholds: `caution` from 90% of host memory, `exceeded`
        above 100%. `unknown` means the host's memory is not known yet (the
        metrics store has no data), so the reservations can't be compared;
        the request still succeeds.
      responses:
        "200":
          description: The capacity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCapacity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/metrics:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: querySiteMetrics
      tags: [metrics]
      summary: Query a site's metrics over time
      description: |
        Time series of the site's metrics (design doc §7.1) for charts.
        Every query is scoped to the site in the path. Select metrics with
        `metric` and `group` (see the catalog); the request needs at least
        one. Time handling and the empty and unavailable cases are those of
        `GET /api/v1/metrics/platform`.
      parameters:
        - $ref: "#/components/parameters/MetricIDs"
        - $ref: "#/components/parameters/MetricGroups"
        - $ref: "#/components/parameters/MetricStart"
        - $ref: "#/components/parameters/MetricEnd"
        - $ref: "#/components/parameters/MetricStep"
      responses:
        "200":
          description: The time series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsRange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/MetricsUnavailable"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/metrics/summary:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: getSiteMetricsSummary
      tags: [metrics]
      summary: Current values of a site's metrics
      description: |
        The latest value of the site's metrics, from instant queries, cheap
        enough for a site list. Without `metric` and `group`, a small
        default set is returned (uptime, HTTP check status, response time,
        request rate, storage, certificate expiry, last backup). Rates and
        ratios cover the last five minutes.
      parameters:
        - $ref: "#/components/parameters/MetricIDs"
        - $ref: "#/components/parameters/MetricGroups"
      responses:
        "200":
          description: The current values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/MetricsUnavailable"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/backups:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: listSiteBackups
      tags: [backups]
      summary: List a site's backups
      description: |
        The platform's record of every backup of the site, newest first,
        including backups that are running or failed. Listing reads the
        records alone; it doesn't open the backup repository. A backup
        whose snapshot has since been removed from the repository (by the
        retention policy) is still listed.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Only return backups with this status.
          schema:
            $ref: "#/components/schemas/BackupStatus"
      responses:
        "200":
          description: A page of backups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSiteBackup
      tags: [backups]
      summary: Back up a site
      description: |
        Queues a job that backs up the site (design doc §5.3): it dumps the
        site's database and snapshots the dump together with the site's
        `wp-content` into the client group's backup repository, which it
        creates on the group's first backup. WordPress core and
        `wp-config.php` are not backed up; both are reproducible from the
        site's WordPress version and settings. The site keeps serving
        throughout, and stopped sites can be backed up too. The job's result
        holds `backup_id` and `snapshot_id`; the backup is listed at once
        with status `running`. The job runs after any other job working on
        the site. A site that is `provisioning` or `deleting`, or whose
        provisioning failed, returns `409`.
      responses:
        "202":
          description: Backup job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/backup-schedule:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: getSiteBackupSchedule
      tags: [backups]
      summary: Get a site's backup schedule
      description: |
        When the site is backed up automatically (design doc §5.3), and when
        its next scheduled backup is due. Every site is backed up daily by
        default, at a time within the platform's backup window
        (`backup.schedule` in the config file) that stays the same from day
        to day and differs between sites, so backups are spread out.
      responses:
        "200":
          description: The site's backup schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setSiteBackupSchedule
      tags: [backups]
      summary: Change a site's backup schedule
      description: |
        Replaces the site's backup schedule; omitted fields take their
        defaults, so `{"enabled": true}` restores the daily backup in the
        platform's window. The change applies at once, without a job: the
        response says when the next backup is due. Scheduled backups are
        recorded like manual ones, with kind `scheduled`. A backup that is
        due while the control plane is down runs when it starts again, once
        however many were missed. Turning the schedule off doesn't affect
        existing backups or manual ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupScheduleUpdate"
      responses:
        "200":
          description: The site's new backup schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/restore:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: restoreSite
      tags: [backups]
      summary: Restore a site from a snapshot
      description: |
        Queues a job that restores a snapshot into the site (design doc
        §5.4). The snapshot is one of the site's own (`snapshot_id` of a
        backup from `GET /api/v1/sites/{site_id}/backups`), or of another
        site in the same client group, named by `source_site_id`, whose
        content then replaces this site's. The job:

        1. takes a pre-restore backup of the site (kind `pre_restore`), so
           the restore can be undone;
        2. puts the site in maintenance mode;
        3. if the snapshot was taken on a newer WordPress core than the
           site runs, moves the site to the oldest site image with at least
           that version;
        4. replaces the site's `wp-content` with the snapshot's (files added
           since are removed) and its database with the snapshot's,
           restarts the site's containers, and runs `wp core update-db`;
        5. if the restored database names another host than the site's
           URL (a snapshot of another site, or from before go-live),
           rewrites its URLs to the site's with `wp search-replace`, as
           go-live does, and sets `home` and `siteurl`;
        6. purges the object cache and the page cache, and takes the site
           out of maintenance mode (unless it was in maintenance mode
           before).

        The response contains the site with status `updating`, and the
        job, whose result holds `pre_restore_backup_id`. If the job fails
        once the site's data was touched, it restores the pre-restore
        backup (and the previous WordPress core), and the site **stays in
        maintenance mode** with `status_message` saying what happened; turn
        maintenance mode off once the site has been checked. If rolling
        back fails too, the site is `failed` and `status_message` names the
        pre-restore backup, which can be restored like any other.

        A snapshot that isn't the source site's, a source site in another
        client group (restores stay within a client group, whose sites
        share one backup repository), or a snapshot from a WordPress core
        newer than any site image returns `422`, and nothing changes. The
        site must be `running` (`409` otherwise); a site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409` too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteRestore"
      responses:
        "202":
          description: The site, now updating, and the restore job.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/uploads:
    post:
      operationId: createUpload
      tags: [uploads]
      summary: Start an upload
      description: |
        Starts a resumable upload of a large file for a site import
        (`purpose: site_import`, with the `client_group_id` the new site will
        join) or a code deployment (`purpose: site_deploy`, with the
        `site_id` to deploy to). It needs the same permission as the import
        or deployment itself, and only its creator can send it, see it, or
        use it.

        Declare the file's exact size, at most `uploads.max_size_mb`
        (`422` if larger), and its SHA-256 checksum here or when completing
        the upload. Then send the content with `PATCH
        /api/v1/uploads/{upload_id}` in chunks of at most `max_chunk_bytes`,
        in order, and complete the upload with `POST
        /api/v1/uploads/{upload_id}/complete`. The import or deployment then
        takes the upload by its `id`.

        If a chunk fails, for example because the connection dropped, none
        of it counts: `GET /api/v1/uploads/{upload_id}` says how many bytes
        arrived (`received_bytes`), and the upload resumes with a chunk from
        there.

        An upload that no job has taken is removed once it goes
        `uploads.expiry_hours` (default 24) without a chunk (`expires_at`).
        One that a job has taken is removed when the job ends. Uploads are
        stored in the data directory, never in backups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreate"
      responses:
        "201":
          description: Upload started; send its first chunk.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/uploads/{upload_id}:
    parameters:
      - $ref: "#/components/parameters/UploadID"
    get:
      operationId: getUpload
      tags: [uploads]
      summary: Get an upload
      description: |
        Where the upload stands: after an interrupted chunk, resume from
        `received_bytes`. Only the upload's creator can see it; for anyone
        else it doesn't exist (`404`).
      responses:
        "200":
          description: The upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: appendUploadChunk
      tags: [uploads]
      summary: Send a chunk of an upload
      description: |
        Appends the request body, the file's bytes from `offset` on, to the
        upload. `offset` must equal the upload's `received_bytes` (`409`
        otherwise, with the expected offset in `detail`), and the chunk
        must hold at least one byte, at most `max_chunk_bytes` (`413`), and
        not go past the declared size (`413`). The chunk counts only once
        all of it has arrived and is on disk: if the request fails, send
        the same bytes again. One request at a time may send chunks of an
        upload (`409` meanwhile). A completed upload takes no more chunks
        (`409`).
      parameters:
        - name: offset
          in: query
          required: true
          description: Where in the file the chunk starts; the upload's current `received_bytes`.
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The chunk was stored; the upload after it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUpload
      tags: [uploads]
      summary: Cancel an upload
      description: |
        Removes an upload and its content. An upload a job has taken can't
        be removed (`409`); it goes when the job ends.
      responses:
        "204":
          description: Upload removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadID"
    post:
      operationId: completeUpload
      tags: [uploads]
      summary: Complete an upload
      description: |
        Finishes an upload that has received all its bytes (`409`
        otherwise): it checks the content against the SHA-256 checksum,
        given here or when the upload was started (`422` if neither, or if
        they differ), and makes the upload available to the import or
        deployment it is for (`status: complete`). If the content doesn't
        match the checksum, the upload is removed and the response is
        `422`: start a new one. Completing a complete upload again returns
        it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadComplete"
      responses:
        "200":
          description: The complete upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/deploy:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: deploySiteCode
      tags: [deployments]
      summary: Deploy a theme or plugin package
      description: |
        Queues a job that deploys a theme or plugin package into the site's
        `wp-content` (design doc §5.8), for CI pipelines and scripts using
        API tokens. Upload the package first, a zip or tar.gz, with
        `POST /api/v1/uploads` (`purpose: site_deploy`, this `site_id`), and
        pass its `upload_id`. The package goes to
        `wp-content/themes/<name>`, `wp-content/plugins/<name>`, or
        `wp-content/mu-plugins/<name>`; if all its files are in one
        top-level directory, as in theme and plugin zips, that directory is
        left out. WordPress only loads the top-level files of
        `mu-plugins`, so a must-use plugin deployed as a directory needs a
        loader file there.

        The job:

        1. checks the package before anything touches the site: plain
           files and directories only (no links or device files), no paths
           outside the package, at most 100,000 entries and 2 GiB unpacked;
        2. unpacks it as the site's user into a hidden directory next to
           the target;
        3. swaps it in with one atomic rename, keeping the previous version,
           and reloads PHP so no cached copy of the previous files keeps
           running: requests see either the old version or the new one,
           never a half-written copy;
        4. with `activate`, activates the theme or plugin with WP-CLI;
        5. purges the object cache and the page cache;
        6. checks the site's health: WordPress must load (WP-CLI), and the
           home page must answer without a server error (`5xx`);
        7. removes the previous version.

        If the health check or another step fails for good, the job rolls
        back: the previous version is swapped back (a first deployment is
        removed), a theme or plugin it activated is switched back, and the
        caches are purged again. The job then ends `failed` with the reason
        in its `error`. Its `result` holds `kind`, `name`, `path`, `files`,
        `bytes`, `replaced` (whether a previous version was replaced), and
        `activated`. The upload is removed when the job ends.

        The site must be `running` (`409` otherwise, as when another job
        works on it). An upload that doesn't exist, isn't the caller's, or
        was made for another site returns `422`; one that isn't complete,
        or that another job uses, `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteDeployment"
      responses:
        "202":
          description: Deployment job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/database/export:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: exportSiteDatabase
      tags: [database]
      summary: Export a site's database
      description: |
        Queues a job that dumps the site's database and compresses it with
        gzip (design doc §5.8). The dump is plain SQL without `CREATE
        DATABASE` or `USE` statements, so it imports into whichever database
        the importer selects, e.g. `gunzip < dump.sql.gz | mariadb mydb`.
        The site's own database password is never revealed. The site keeps
        serving throughout, and stopped sites can be exported too. The job
        runs after any other job working on the site.

        When the job has succeeded, its result holds `export_id`,
        `download_url` (the `GET` below), `size_bytes`, and `expires_at`.
        Download the dump with the same session or API token before it
        expires, one hour after it is ready by default
        (`database_export.ttl_seconds`); the file is then deleted. Every
        export and every download is recorded in the audit log.

        A site that is `provisioning` or `deleting`, or whose provisioning
        failed, returns `409`.
      responses:
        "202":
          description: Export job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/database/exports/{export_id}/download:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - name: export_id
        in: path
        required: true
        description: The `export_id` from the export job's result.
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: downloadSiteDatabaseExport
      tags: [database]
      summary: Download a database export
      description: |
        Returns the compressed dump of a finished export
        (`POST /api/v1/sites/{site_id}/database/export`) as
        `application/gzip`. It needs the same permission as starting an
        export (Operators and Admins; not `read-only` tokens), and each
        download is recorded in the audit log. An export that doesn't
        exist, isn't finished, belongs to another site, or has expired
        returns `404`; an expired export's file has been deleted.
      responses:
        "200":
          description: The compressed dump.
          headers:
            Content-Disposition:
              description: '`attachment` with the file name, `<site slug>-<export ID>.sql.gz`.'
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/export:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: exportSite
      tags: [exports]
      summary: Export a site
      description: |
        Queues a job that exports the whole site in the two files a site
        import takes (design doc §5.7), so it can be imported again here or
        moved to another host:

        * `wp-content.tar.gz`: the site's `wp-content` (every path starts
          with `wp-content/`), without the platform's drop-ins
          (`object-cache.php`, `advanced-cache.php`, `db.php`), which point
          at its object cache and page cache and would break the site
          elsewhere, and without symbolic links and other special files,
          which import skips too. Owners are left out; permissions and
          modification times are kept.
        * `database.sql.gz`: the database, dumped as for a database export.

        WordPress core and `wp-config.php` aren't exported: the platform
        generates both, and so does any other host. The site keeps serving
        throughout, and stopped sites can be exported too; a file that
        changes while it is read is exported as it was then, with a warning
        on the job. The job runs after any other job working on the site.

        Before writing anything, the job estimates the export's size (the
        database plus `wp-content`, uncompressed) and fails if the data
        directory has less free space; the estimate is in its result as
        `estimated_size_bytes`. When it has succeeded, its result also holds
        `export_id`, `export_url` (`GET /api/v1/exports/{export_id}`),
        `files` (each with `name`, `size_bytes`, and `download_url`),
        `size_bytes`, and `expires_at`. Download the files with the same
        session or API token before they expire, a day after they are ready
        by default (`site_export.ttl_seconds`). Every export and every
        download is recorded in the audit log.

        A site that is `provisioning` or `deleting`, or whose provisioning
        failed, returns `409`.
      responses:
        "202":
          description: Export job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/backups/{backup_id}/export:
    parameters:
      - $ref: "#/components/parameters/SiteID"
      - $ref: "#/components/parameters/BackupID"
    post:
      operationId: exportSiteBackup
      tags: [exports]
      summary: Export a site from a backup
      description: |
        Queues a job that exports the site as it was in one of its backups,
        in the same two files as `POST /api/v1/sites/{site_id}/export`,
        ready for a site import. It recovers an earlier version of a site
        without restoring over the live one, and works whatever the site's
        state: it reads the snapshot from the client group's backup
        repository and never touches the site. The job takes no lock on the
        site; it waits for a repository prune or check that is running.

        The job's result is as for a live export, with `backup_id`; the
        export (`GET /api/v1/exports/{export_id}`) has `source.taken_at`,
        when the snapshot was taken, and the site's URL and table prefix as
        its database had them. A backup that isn't the site's returns `404`;
        one that is running or failed, or whose snapshot was removed by the
        retention policy (`expired_at`), returns `409`.
      responses:
        "202":
          description: Export job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/client-groups/{client_group_id}/backups:
    parameters:
      - $ref: "#/components/parameters/ClientGroupID"
    get:
      operationId: listClientGroupBackups
      tags: [backups]
      summary: List a client group's backups
      description: |
        The platform's record of every backup of the group's sites, newest
        first, like `GET /api/v1/sites/{site_id}/backups`. With
        `deleted=true`, only the backups of sites that have been deleted:
        their snapshots stay in the group's backup repository until the
        group is deleted, and can still be exported
        (`POST /api/v1/client-groups/{client_group_id}/backups/{backup_id}/export`).
        Each backup keeps the name and slug its site had when it was taken.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Only return backups with this status.
          schema:
            $ref: "#/components/schemas/BackupStatus"
        - name: deleted
          in: query
          description: Only return the backups of sites that have been deleted.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of backups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/client-groups/{client_group_id}/backup-repository:
    parameters:
      - $ref: "#/components/parameters/ClientGroupID"
    delete:
      operationId: deleteClientGroupBackupRepository
      tags: [backups]
      summary: Delete a client group's backup repository
      description: |
        Queues a job that permanently deletes the group's backup repository
        (its files or S3 objects), the records of the backups it held, its
        password, and its maintenance schedules, so the group can then be
        deleted. This is how a client is offboarded from the dashboard; it
        takes the `client_group.offboard` permission. Export the backups
        the client should keep first.

        It is refused (`409`) while the group still has sites, has no
        backup repository, or has an export from its backups queued or
        running. The job waits for any prune or check of the repository to
        finish.
      responses:
        "202":
          description: Deletion job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/client-groups/{client_group_id}/backups/{backup_id}/export:
    parameters:
      - $ref: "#/components/parameters/ClientGroupID"
      - $ref: "#/components/parameters/BackupID"
    post:
      operationId: exportClientGroupBackup
      tags: [exports]
      summary: Export a site from a client group's backup
      description: |
        `POST /api/v1/sites/{site_id}/backups/{backup_id}/export` for any
        backup in the group, including those of sites that have been
        deleted, so a deleted site can still be recovered or handed over
        while its group's backup repository exists. A backup that isn't the
        group's returns `404`.
      responses:
        "202":
          description: Export job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/exports:
    get:
      operationId: listExports
      tags: [exports]
      summary: List exports
      description: |
        Exports of a site (`site_id`) or of a client group's sites
        (`client_group_id`), newest first: database exports, site exports,
        and exports from backups, including those that failed or have
        expired. One of the two filters is required (`400` otherwise).
      parameters:
        - name: site_id
          in: query
          schema:
            $ref: "#/components/schemas/ID"
        - name: client_group_id
          in: query
          schema:
            $ref: "#/components/schemas/ID"
        - name: kind
          in: query
          description: |
            Only return exports of these kinds; repeat the parameter to
            select several (`kind=site&kind=snapshot`).
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ExportKind"
        - name: status
          in: query
          description: |
            Only return exports with these statuses; repeat the parameter to
            select several (`status=ready&status=failed`).
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ExportStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of exports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/exports/{export_id}:
    parameters:
      - $ref: "#/components/parameters/ExportID"
    get:
      operationId: getExport
      tags: [exports]
      summary: Get an export
      description: |
        An export, its files once it is ready, and what they hold. An
        export whose expiry has passed is `expired`, and its files are
        gone.
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/exports/{export_id}/files/{file_name}:
    parameters:
      - $ref: "#/components/parameters/ExportID"
      - name: file_name
        in: path
        required: true
        description: One of the export's files.
        schema:
          $ref: "#/components/schemas/ExportFileName"
    get:
      operationId: downloadExportFile
      tags: [exports]
      summary: Download an export's file
      description: |
        Returns one file of a ready export as `application/gzip`, named for
        the site in `Content-Disposition` (`<site slug>-wp-content.tar.gz`,
        `<site slug>-database.sql.gz`, or for a database export
        `<site slug>-<export ID>.sql.gz`). It supports `Range` requests
        (`Accept-Ranges: bytes`), so a large download that was interrupted
        can be resumed: send `Range: bytes=<bytes received>-`, with
        `If-Range` set to the `ETag` of the first response so a different
        file is never spliced in. It needs the same permission as starting
        an export (Operators and Admins; not `read-only` tokens), and each
        download, partial or not, is recorded in the audit log. An export
        that doesn't exist, isn't ready, has no such file, or has expired
        returns `404`.
      parameters:
        - name: Range
          in: header
          required: false
          description: A byte range, e.g. `bytes=1048576-`.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          description: The `ETag` the range must have been taken from.
          schema:
            type: string
      responses:
        "200":
          description: The whole file.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ExportContentDisposition"
            Accept-Ranges:
              schema:
                type: string
                enum: [bytes]
            ETag:
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range of the file (`Content-Range`).
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ExportContentDisposition"
            Content-Range:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: The range lies outside the file.
          headers:
            Content-Range:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/core:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: getSiteCore
      tags: [sites]
      summary: Get a site's WordPress core updates
      description: |
        The site's WordPress core version and what the core rollout will do
        with it (design doc §5.5): the release it moves to next (`target`),
        the newest major release it may not move to yet (`pending`), its
        own and its client group's policy, and warnings about its branch.
        Minor and security releases (x.y.Z) roll out automatically, one
        site at a time and within the maintenance window if one is set
        (`updates` in the config file). Major releases (x.Y) wait for
        approval of the site or its client group, or for
        `updates.core.major_auto_approve_days`. A held site stays on its
        major branch and keeps getting the branch's minor and security
        releases.
      responses:
        "200":
          description: The site's core update status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteCore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/core/policy:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    put:
      operationId: setSiteCorePolicy
      tags: [sites]
      summary: Hold a site's core, or approve a major release
      description: |
        Replaces the site's own core update policy. `{"hold": true}` keeps
        the site on its current major branch, which still gets its minor
        and security releases. `{"approved_branch": "7.2"}` lets it move
        to the newest release of any branch up to 7.2; the branch must
        have site images. `{}` makes the site follow its client group
        again. A site's own policy wins over its group's. The change takes
        effect at the core rollout's next pass, which is queued at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorePolicyUpdate"
      responses:
        "200":
          description: The site's core update status with the new policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteCore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/core/update:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: updateSiteCore
      tags: [sites]
      summary: Update a site's WordPress core now
      description: |
        Queues the update to the site's `target` release (`GET
        /api/v1/sites/{site_id}/core`) now, outside the maintenance window
        and even if the rollout's update to it failed before. The job takes
        a pre-update backup (kind `pre_update`), recreates the site's
        `php` and `nginx` containers on the new release's images (both
        always carry the same WordPress core), runs `wp core update-db`,
        and checks the site's health (an HTTP request to the site and
        WP-CLI loading WordPress on the new core). If anything fails, it
        restores the pre-update backup if the database schema changed, and
        moves the site back to its previous images; `status_message` says
        what happened. A site without a `target` returns `409`, as does a
        site that isn't `running`, is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed.
      responses:
        "202":
          description: The site, now updating, and the core update job.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/updates:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: getSiteUpdates
      tags: [sites]
      summary: List a site's pending plugin and theme updates
      description: |
        The plugins and themes of the site with an update available, as of
        the site's latest update check (design doc §5.6, §9 Q2). The
        control plane checks every site twice a day with WP-CLI (`wp plugin
        list --update=available`, and the same for themes); `POST
        /api/v1/sites/{site_id}/updates/check` checks now. The platform only
        reports these: WordPress applies plugin and theme updates itself,
        with auto-updates or from wp-admin. Pending updates count towards
        the site's health as a warning: the default alert rule `Plugin or
        theme updates pending` fires when they have been pending for 3 days.
        A site that hasn't been checked yet has a null `checked_at` and
        empty lists.
      responses:
        "200":
          description: The site's pending updates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteUpdates"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/updates/check:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: checkSiteUpdates
      tags: [sites]
      summary: Check a site for plugin and theme updates now
      description: |
        Queues a check of the site's plugins and themes for updates, outside
        its regular schedule, for instance after updating them in wp-admin.
        If a check is already queued, returns that one. The check only
        lists updates, and never applies one. It replaces the site's report
        when it succeeds, and skips a site that isn't serving.
      responses:
        "202":
          description: The update check job.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

