openapi: 3.1.0
info:
  title: PressFleet API
  version: 0.1.0
  summary: Control plane API for the PressFleet WordPress application platform.
  description: |
    Spec-first API (design doc §4.5). This document is the source of truth;
    the Go server interfaces and the dashboard's TypeScript client are
    generated from it.

    ## Conventions

    * All API endpoints live under `/api/v1`. Breaking changes require a new
      version prefix; additive changes (new fields, endpoints, or enum values)
      do not, so clients must ignore unknown fields.
    * Request and response bodies are JSON. Field names are `snake_case`.
      Timestamps are RFC 3339 strings in UTC.
    * Long-running operations return `202 Accepted` with the queued job in the
      body and its URL in the `Location` header. Poll `GET /api/v1/jobs/{job_id}`
      until the job reaches a terminal state (`succeeded`, `failed`, or
      `rollback_failed`).
    * Every error response is an RFC 9457 Problem Details document
      (`application/problem+json`) that carries the request ID.
    * List endpoints use cursor pagination: pass `limit` and, for later pages,
      the `next_cursor` from the previous response as `cursor`. Cursors are
      opaque.

    ## Authentication

    Every operation requires authentication except login and the health
    endpoints. Unauthenticated requests get `401` with a `WWW-Authenticate`
    header.

    * **Session cookie (dashboard).** `POST /api/v1/auth/login` sets the
      `pressfleet_session` cookie (`HttpOnly`, `SameSite=Lax`, `Path=/`, and
      `Secure` when the request arrived over HTTPS). Sessions end after 12
      hours without use, 7 days after login, on logout, and when the user's
      password changes or the user is disabled.
    * **Bearer API token (automation).** Send `Authorization: Bearer pft_...`.
      Tokens are created with `POST /api/v1/auth/tokens` and shown only once.
      If an `Authorization` header is present, the cookie is ignored.

    ### CSRF protection

    Cookie-authenticated requests with an unsafe method (anything but `GET`,
    `HEAD`, and `OPTIONS`) must send the session's CSRF token in the
    `X-CSRF-Token` header. The token is returned as `csrf_token` by login and
    by `GET /api/v1/auth/me`. In addition, unsafe requests that don't use a
    bearer token (including login) are rejected if the browser marks them as
    cross-origin (`Sec-Fetch-Site`, or an `Origin` that doesn't match the
    host). Both failures return `403`. Bearer-token requests are exempt,
    because browsers never attach them automatically.

    ### Login throttling

    Failed logins return `401` without saying whether the email exists.
    Repeated failures for one account or from one client address are
    throttled with `429` and a `Retry-After` header.

    ## Authorization

    Each user has one platform-wide role: `admin`, `operator`, or `viewer`
    (design doc §4.6). A token's effective permissions are the intersection of
    its scope and its owner's current role. Denied requests get `403`.

    * Every role may read sites, client groups, and jobs, and manage its own
      password and API tokens.
    * Operators and Admins may also create and change sites and client groups.
    * Only Admins may delete sites and client groups and manage users.
    * `read-only` tokens may only read, whatever the owner's role.

    Role changes apply to the user's existing sessions and tokens at once. The
    last enabled Admin can't be demoted, disabled, or deleted (`409`).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The control plane that serves this document.
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: health
    description: Liveness and readiness probes. Unauthenticated and outside `/api/v1`.
  - name: auth
    description: Sessions and the current user.
  - name: tokens
    description: The current user's API tokens.
  - name: users
    description: User management (Admin only).
  - name: client-groups
    description: Client groups own sites and a backup repository.
  - name: sites
    description: WordPress sites.
  - name: jobs
    description: Long-running operations.
  - name: audit
    description: The audit log (Admin only).

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: Returns `200` while the process is running. Performs no dependency checks.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe
      description: Runs every registered readiness check (for example, the state database). Returns `503` if any check fails.
      security: []
      responses:
        "200":
          description: Every check passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in and start a session
      description: |
        Verifies the credentials and sets the session cookie. The response body
        is the logged-in user. Failed logins return `401` without revealing
        whether the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              description: The session cookie (`HttpOnly`, `SameSite=Lax`, and `Secure` over HTTPS).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Deletes the session. With a bearer token there is no session, and the call only clears the cookie.
      responses:
        "204":
          description: Logged out; the session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user
      description: Also returns the session's CSRF token, so the dashboard can recover it after a page reload.
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      description: |
        Requires the current password. Signs out the user's other sessions and
        revokes all of their API tokens (including the one making the request,
        if any); the current session stays signed in. A wrong current password
        returns `422` and counts toward login throttling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/tokens:
    get:
      operationId: listApiTokens
      tags: [tokens]
      summary: List the current user's API tokens
      description: Token secrets are never returned after creation.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiToken
      tags: [tokens]
      summary: Create an API token for the current user
      description: |
        The response contains the plaintext token. It is shown only once and
        cannot be retrieved again; only a hash is stored.

        When the request itself is authenticated with an API token, the new
        token can't be broader than it: a read-only token can't create tokens
        at all, and a token with an expiry can only create tokens that expire
        no later. Violations return `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: Token created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeApiToken
      tags: [tokens]
      summary: Revoke one of the current user's API tokens
      description: Revocation takes effect immediately.
      responses:
        "204":
          description: Token revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: role
          in: query
          description: Only return users with this role.
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      description: |
        Changes apply immediately to the user's existing sessions and tokens.
        Setting a password or disabling the user signs them out everywhere and
        revokes their API tokens; re-enabling a user doesn't restore them.
        Demoting or disabling the last Admin returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: Also revokes the user's sessions and tokens. Deleting the last Admin returns `409`.
      responses:
        "204":
          description: User deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/client-groups:
    get:
      operationId: listClientGroups
      tags: [client-groups]
      summary: List client groups
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of client groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroupList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createClientGroup
      tags: [client-groups]
      summary: Create a client group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientGroupCreate"
      responses:
        "201":
          description: Client group created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/client-groups/{client_group_id}:
    parameters:
      - $ref: "#/components/parameters/ClientGroupID"
    get:
      operationId: getClientGroup
      tags: [client-groups]
      summary: Get a client group
      responses:
        "200":
          description: The client group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateClientGroup
      tags: [client-groups]
      summary: Update a client group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientGroupUpdate"
      responses:
        "200":
          description: The updated client group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteClientGroup
      tags: [client-groups]
      summary: Delete a client group
      description: A client group that still has sites can't be deleted (`409`).
      responses:
        "204":
          description: Client group deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List sites
      description: |
        Newest first. Listings come from the recorded state alone, so they
        omit `runtime`; get a site for its live state.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: client_group_id
          in: query
          description: Only return sites in this client group.
          schema:
            $ref: "#/components/schemas/ID"
        - name: status
          in: query
          description: Only return sites with this status.
          schema:
            $ref: "#/components/schemas/SiteStatus"
      responses:
        "200":
          description: A page of sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site
      description: |
        Starts the one-click provisioning workflow (design doc §5.1). The site
        record is created immediately with status `provisioning`; the job
        creates the database and containers and installs WordPress.

        The generated WordPress admin password is stored encrypted and can be
        retrieved exactly once with
        `POST /api/v1/sites/{site_id}/admin-credentials`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
      responses:
        "202":
          description: Provisioning job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a site
      description: |
        Returns the site with its live runtime state in `runtime`, read from
        the container runtime with a short timeout. If the container runtime
        can't be reached, `runtime.phase` is `unknown` and `status` is the
        last recorded status; the request still succeeds.
      responses:
        "200":
          description: The site, including its live runtime status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a site's settings
      description: |
        Changes the PHP version, resource limits, or preview password
        protection. The settings are validated, saved as the site's desired
        state, and applied by a job that recreates the affected containers
        (design doc §5.5); changing the PHP version recreates the `php`
        container on the new image. The response contains the site with the
        requested settings and status `updating`, and the job. A stopped
        site stays stopped and runs with the new settings when started.

        `preview_protection.enabled` turns HTTP basic auth on the preview
        domain on or off (design doc §5.1); production domains are never
        protected. The platform generates the password the first time
        protection is turned on and returns it in `preview_credentials` of
        this response only; it is never shown again, but can be replaced
        with `POST /api/v1/sites/{site_id}/preview-password`. Turning
        protection off keeps the credentials, so turning it on again
        restores them. The username defaults to the site's slug.

        If the job fails, it reverts: the previous settings are applied and
        saved again, the status returns to what the containers are doing,
        and `status_message` says why the update failed. Only if reverting
        fails too is the site marked `failed`.

        A site that is `provisioning`, `updating`, or `deleting`, or whose
        provisioning failed, can't be changed (`409`). The PHP version is
        only validated when it changes, so a site on a PHP version past end
        of life can still get new resource limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
      responses:
        "202":
          description: Update job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site
      description: |
        Queues a job that removes the site's containers, network, volumes,
        database, secrets, and rendered files. The site's status becomes
        `deleting`; the site disappears when the job succeeds.
      responses:
        "202":
          description: Deletion job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/start:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: startSite
      tags: [sites]
      summary: Start a stopped site
      description: |
        Queues a job that starts the site's containers and waits for them to
        be healthy, then sets the status to `running`. The status doesn't
        change until then. Starting a running site succeeds without changing
        it. If the job fails, the site is marked `failed` with the reason in
        `status_message`. A site that is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed, returns `409`.
      responses:
        "202":
          description: Start job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/stop:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: stopSite
      tags: [sites]
      summary: Stop a running site
      description: |
        Queues a job that stops the site's containers, keeping its data,
        then sets the status to `stopped`. A stopped site stays stopped when
        Docker restarts, and WP-Cron doesn't run for it. Stopping a stopped
        site succeeds without changing it. If the job fails, the site is
        marked `failed` with the reason in `status_message`. A site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409`.
      responses:
        "202":
          description: Stop job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/cache/purge:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: purgeSiteCache
      tags: [sites]
      summary: Purge a site's caches
      description: |
        Queues a job that empties the site's object cache (its database on
        the shared object cache server), then its page cache (the FastCGI
        cache nginx keeps), so the next requests are rendered afresh. The
        site keeps serving throughout and its status doesn't change; stopped
        sites are purged too. WordPress already purges the pages a change
        affects when content is published or edited (Nginx Helper); this is
        for everything else, such as a theme change or an edit made directly
        in the database. A site that is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed, returns `409`.
      responses:
        "202":
          description: Cache purge job queued.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/admin-credentials:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: retrieveSiteAdminCredentials
      tags: [sites]
      summary: Retrieve the initial WordPress admin credentials (once)
      description: |
        Returns the WordPress admin credentials generated when the site was
        created, then discards the stored password. Later calls return `410`,
        as do calls for a site whose provisioning failed. While the site is
        still being provisioned the credentials aren't usable yet, and the
        call returns `409`. This is a `POST` because it changes state.
      responses:
        "200":
          description: The initial admin credentials. They can't be retrieved again.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAdminCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/maintenance:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    put:
      operationId: setSiteMaintenance
      tags: [sites]
      summary: Turn maintenance mode on or off
      description: |
        Records whether the site is in maintenance mode and queues a job
        that applies it (design doc §5.4). In maintenance mode, every domain
        of the site answers `503 Service Unavailable` with `Retry-After` and
        the platform's maintenance page, served by the edge router without
        the site's containers; WP-CLI and other platform tasks keep working.
        The change takes effect a few seconds after the job has finished,
        and stays across updates and restarts until it is turned off. The
        site's `status` doesn't change. If the job fails, the previous
        setting is restored. A site that is `provisioning`, `updating`, or
        `deleting`, or whose provisioning failed, returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteMaintenance"
      responses:
        "202":
          description: The site with the recorded setting, and the job that applies it.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/go-live:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: goLiveSite
      tags: [sites]
      summary: Switch a site to its primary domain
      description: |
        Sets the site's primary domain and aliases and queues a job that
        switches the site to them (design doc §5.2):

        1. The edge router routes the primary domain and each alias, and
           gets a certificate for each with the ACME HTTP-01 challenge. The
           site's containers aren't recreated.
        2. WordPress's URLs are rewritten from the preview domain (and any
           earlier primary domain) to `https://<primary_domain>` with
           `wp search-replace`, serialized data included and GUIDs left
           alone, and `home` and `siteurl` are set to it.
        3. The site's object cache and page cache are purged.

        From then on, the preview domain and the aliases answer with a
        permanent redirect (`301`) to the primary domain that keeps the path
        and query. A protected preview domain asks for its password before
        redirecting. The primary domain and aliases never ask for the
        preview password, never send `X-Robots-Tag: noindex`, and, when the
        platform's security headers are on, send
        `Strict-Transport-Security: max-age=31536000` (without
        `includeSubDomains`).

        **DNS check.** Before anything changes, the control plane checks
        that each domain the site doesn't have yet resolves (A and AAAA) to
        this host only: to `public_ip` or the dashboard domain's addresses.
        If one doesn't, the request fails with `422` and the problem type
        `https://github.com/rchouinard/pressfleet/blob/main/docs/configuration.md#dns-check`,
        with one entry in `errors` per domain saying what it resolves to and
        where it should point. Nothing is recorded; send the request again
        once the records have propagated. Hosts behind a CDN or load
        balancer, whose domains resolve elsewhere, set `skip_dns_check`.

        The response contains the site with the new domains and status
        `updating`, and the job. If the job fails before WordPress's URLs
        are rewritten, it reverts: the previous domains and routes are back
        and `status_message` says why. If it fails later, the site keeps its
        new domains and `status_message` says the go-live didn't finish;
        going live again with the same domains finishes it.

        Going live again with another primary domain moves the site: the
        old primary domain's URLs are rewritten too, and it stops being
        served unless it is listed as an alias. Going back to the preview
        domain alone isn't supported.

        The site must be `running` (`409` otherwise). A site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409` too. A domain under the preview base domain,
        the dashboard's domain, or one another site uses is refused with
        `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteGoLive"
      responses:
        "202":
          description: The site with its new domains, and the job that applies them.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableDomains"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sites/{site_id}/preview-password:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    post:
      operationId: regenerateSitePreviewPassword
      tags: [sites]
      summary: Generate a new preview password (shown once)
      description: |
        Replaces the password of the site's preview domain protection
        (design doc §5.1) with a newly generated one, returns it, and queues
        a job that applies it; the old password stops working when the job
        has finished. The password is returned by this response only. It
        can be generated whether or not protection is on; with protection
        off, it is kept for when it is turned on. The site's status is
        `updating` until the job has finished. A site that is
        `provisioning`, `updating`, or `deleting`, or whose provisioning
        failed, returns `409`.
      responses:
        "202":
          description: The new credentials, and the job that applies them.
          headers:
            Location:
              $ref: "#/components/headers/JobLocation"
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPasswordAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      description: Newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          description: Only return jobs in this state.
          schema:
            $ref: "#/components/schemas/JobState"
        - name: target_type
          in: query
          description: Only return jobs whose target has this type.
          schema:
            $ref: "#/components/schemas/JobTargetType"
        - name: target_id
          in: query
          description: Only return jobs for this target.
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: A page of jobs. Step logs are omitted; get a job to see them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job, including its steps and step log
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List audit events (Admin only)
      description: |
        Newest first. Every authenticated state-changing request, every
        authorization denial, and every login and logout is recorded with its
        actor, action, target, result, and client address. Request bodies and
        secrets are never recorded. Events older than the configured retention
        (`audit.retention_days`) are deleted daily.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: actor_user_id
          in: query
          description: Only return events by this user.
          schema:
            $ref: "#/components/schemas/ID"
        - name: action
          in: query
          description: Only return events for this action, e.g. `site.delete`.
          schema:
            type: string
            maxLength: 100
        - name: target_type
          in: query
          description: Only return events whose target has this type, e.g. `site`.
          schema:
            type: string
            maxLength: 50
        - name: target_id
          in: query
          description: Only return events for this target.
          schema:
            $ref: "#/components/schemas/ID"
        - name: since
          in: query
          description: Only return events at or after this time.
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: until
          in: query
          description: Only return events before this time.
          schema:
            $ref: "#/components/schemas/Timestamp"
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pressfleet_session
      description: |
        Session cookie set by `POST /api/v1/auth/login`. Used by the dashboard.
        Unsafe requests must also send the `X-CSRF-Token` header (see CSRF
        protection above).
    bearerToken:
      type: http
      scheme: bearer
      description: "An API token created with `POST /api/v1/auth/tokens`, sent as `Authorization: Bearer <token>`."

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
        maxLength: 512
    TokenID:
      name: token_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    ClientGroupID:
      name: client_group_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    SiteID:
      name: site_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"

  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    JobLocation:
      description: URL of the queued job (`/api/v1/jobs/{job_id}`).
      schema:
        type: string
        format: uri-reference

  responses:
    BadRequest:
      description: The request is malformed (invalid JSON, unknown parameter format, or body too large).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller's role or token scope doesn't allow this action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource doesn't exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state (for example, a duplicate name or a job already running for the target).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: The resource was available once and has been consumed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: The request is well-formed but fails validation. `errors` lists each invalid field.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableDomains:
      description: |
        A domain fails validation (`about:blank`), or its DNS records don't
        point at this host (type
        `https://github.com/rchouinard/pressfleet/blob/main/docs/configuration.md#dns-check`,
        title `DNS check failed`). Either way `errors` lists each domain's
        problem, and nothing was changed. A DNS check that couldn't run at
        all, because the control plane doesn't know this host's public
        address, has the DNS type, no `errors`, and says why in `detail`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many failed attempts. Try again after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: Any other error, including `500` and `501 Not Implemented`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ID:
      type: string
      description: Opaque, server-assigned identifier.
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
      examples: ["01J9ZQ3V6T8K4M2N5P7R9S1X3Y"]

    Timestamp:
      type: string
      format: date-time
      examples: ["2026-09-26T17:25:00Z"]

    Problem:
      type: object
      description: RFC 9457 Problem Details. Additional members may be added.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type. `about:blank` means the HTTP status says it all.
          default: about:blank
          examples: ["about:blank"]
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          examples: ["Not Found"]
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code.
          examples: [404]
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: The request path that produced the problem.
        request_id:
          type: string
          description: The request ID (also in the `X-Request-ID` response header). Include it when reporting issues.
        errors:
          type: array
          description: Validation errors, one per invalid field (`422` only).
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, detail]
      properties:
        field:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid member of the request body, or the parameter name.
          examples: ["/php_version"]
        detail:
          type: string
          examples: ["must be one of 8.2, 8.3, 8.4"]

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"

    ReadinessCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          examples: ["database"]
        status:
          type: string
          enum: [ok, failed]
        error:
          type: string
          description: Why the check failed.

    Role:
      type: string
      description: Platform-wide role (design doc §4.6).
      enum: [admin, operator, viewer]

    Email:
      type: string
      format: email
      maxLength: 254

    Password:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 256

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256

    User:
      type: object
      required: [id, email, role, disabled, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
          description: Disabled users can't log in and their tokens are rejected.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        last_login_at:
          description: Null if the user has never logged in.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    CurrentUser:
      description: The authenticated user, and how they authenticated.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [auth_method, csrf_token]
          properties:
            auth_method:
              type: string
              enum: [session, token]
              x-enum-varnames: [AuthMethodSession, AuthMethodToken]
            csrf_token:
              description: |
                The session's CSRF token. Send it in the `X-CSRF-Token` header
                with every cookie-authenticated unsafe request. Null for bearer
                token authentication, which needs none.
              oneOf:
                - type: string
                - type: "null"

    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256
        new_password:
          $ref: "#/components/schemas/Password"

    UserCreate:
      type: object
      required: [email, password, role]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        role:
          $ref: "#/components/schemas/Role"

    UserUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean

    UserList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    TokenScope:
      type: string
      description: |
        What the token may do, intersected with its owner's current role
        (design doc §4.6). `full` allows everything the owner's role allows;
        `read-only` allows only read actions.
      enum: [full, read-only]

    ApiToken:
      type: object
      required: [id, name, scope, prefix, created_at, expires_at, last_used_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          description: A label to tell tokens apart.
          examples: ["CI deploys"]
        scope:
          $ref: "#/components/schemas/TokenScope"
        prefix:
          type: string
          description: The first characters of the token, so it can be recognized without revealing it.
          examples: ["pft_3kq9"]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          description: Null if the token never expires.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        last_used_at:
          description: Null if the token has never been used.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ApiTokenWithSecret:
      description: A newly created token, including its plaintext value. Returned only by `createApiToken`.
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The plaintext token. Store it now; it can't be retrieved again.

    ApiTokenCreate:
      type: object
      required: [name, scope]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scope:
          $ref: "#/components/schemas/TokenScope"
        expires_at:
          description: When the token stops working. Omit or send null for no expiry.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ApiTokenList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    ClientGroup:
      type: object
      required: [id, name, notes, site_count, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          examples: ["Acme Corp"]
        notes:
          type: string
          description: Free-form notes for the agency. Empty if unset.
        site_count:
          type: integer
          minimum: 0
          description: Number of sites in the group.
        backup_repository:
          description: |
            The group's backup repository, managed by the platform. Null until
            the repository has been initialized. Its encryption key is never
            exposed through the API.
          oneOf:
            - $ref: "#/components/schemas/BackupRepository"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    BackupRepository:
      type: object
      required: [location]
      properties:
        location:
          type: string
          description: Where the Restic repository lives (a local path or S3 URL), without credentials.
          examples: ["s3:https://s3.example.com/pressfleet-backups/01J9ZQ3V6T8K4M2N5P7R9S1X3Y"]

    ClientGroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 10000

    ClientGroupUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 10000

    ClientGroupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientGroup"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SiteStatus:
      type: string
      description: |
        Recorded lifecycle status of a site. `provisioning`, `updating`, and
        `deleting` mean a job is working on the site; `failed` means the last
        job failed (see `status_message`). What the containers are doing
        right now is the site's `runtime`.
      enum: [provisioning, running, stopped, updating, deleting, failed]

    SiteRuntime:
      type: object
      description: |
        The live state of the site's containers, observed when the site was
        read. Only `GET /api/v1/sites/{site_id}` includes it; listings report
        the recorded `status` alone.
      required: [phase]
      properties:
        phase:
          type: string
          description: |
            * `pending`: containers are starting or not healthy yet.
            * `running`: every container is running and healthy.
            * `stopped`: the containers are stopped.
            * `failed`: a container exited or is unhealthy (see `message`).
            * `absent`: the site has no containers, e.g. before provisioning
              starts them or after failed provisioning removed them.
            * `unknown`: the container runtime couldn't be reached in time;
              `status` is the last recorded status.
          enum: [pending, running, stopped, failed, absent, unknown]
        message:
          type: string
          description: Details about the phase, such as which container is unhealthy.

    PHPVersion:
      type: string
      description: A PHP version the platform publishes site images for.
      pattern: "^[0-9]+\\.[0-9]+$"
      examples: ["8.4"]

    ResourceLimits:
      type: object
      description: Limits for the site as a whole; the platform splits them between the site's containers.
      required: [cpu, memory_reservation_mb, memory_limit_mb]
      properties:
        cpu:
          type: string
          description: CPU limit in cores.
          pattern: "^[0-9]+(\\.[0-9]+)?$"
          examples: ["1.0"]
        memory_reservation_mb:
          type: integer
          minimum: 32
          description: Guaranteed memory baseline in MiB.
          examples: [128]
        memory_limit_mb:
          type: integer
          minimum: 64
          description: Hard memory limit in MiB, allowing bursts above the reservation. Must be at least `memory_reservation_mb`.
          examples: [512]

    ResourceLimitsUpdate:
      type: object
      description: Partial resource limits. Omitted fields keep their current value, or the platform default when creating a site.
      additionalProperties: false
      minProperties: 1
      properties:
        cpu:
          type: string
          pattern: "^[0-9]+(\\.[0-9]+)?$"
        memory_reservation_mb:
          type: integer
          minimum: 32
        memory_limit_mb:
          type: integer
          minimum: 64

    Site:
      type: object
      required:
        - id
        - client_group_id
        - name
        - slug
        - preview_domain
        - primary_domain
        - aliases
        - php_version
        - wp_core_version
        - wp_core_pinned
        - resources
        - preview_protection
        - maintenance
        - status
        - parent_site_id
        - admin_credentials_available
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ID"
        client_group_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          examples: ["Acme marketing site"]
        slug:
          type: string
          description: Unique, URL-safe name assigned at creation. Forms the preview domain.
          examples: ["acme-marketing"]
        preview_domain:
          type: string
          description: "`<slug>.<preview-base-domain>`; always reachable over HTTPS."
          examples: ["acme-marketing.preview.agency.example"]
        primary_domain:
          description: The domain the site is served on once live (`POST /api/v1/sites/{site_id}/go-live`); null until then.
          oneOf:
            - type: string
              examples: ["www.acme.example"]
            - type: "null"
        aliases:
          type: array
          description: Additional domains that redirect to the primary domain, sorted. Empty until the site goes live.
          items:
            type: string
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        wp_core_version:
          type: string
          description: WordPress core version of the site's images. Managed by the platform.
          examples: ["6.9.1"]
        wp_core_pinned:
          type: boolean
          description: Whether the site is pinned to its current core version and skipped by core rollouts.
        resources:
          $ref: "#/components/schemas/ResourceLimits"
        preview_protection:
          $ref: "#/components/schemas/PreviewProtection"
        maintenance:
          type: boolean
          description: |
            Whether the site is in maintenance mode: its domains answer with
            the platform's maintenance page (design doc §5.4).
        status:
          $ref: "#/components/schemas/SiteStatus"
        status_message:
          type: string
          description: Details about the status, such as why the site failed.
        runtime:
          $ref: "#/components/schemas/SiteRuntime"
        url:
          type: string
          format: uri
          description: The site's current public URL (primary domain if live, else preview domain).
          examples: ["https://acme-marketing.preview.agency.example"]
        parent_site_id:
          description: Reserved for staging clones; always null in the MVP.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        admin_credentials_available:
          type: boolean
          description: Whether the initial WordPress admin credentials can still be retrieved.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    SiteCreate:
      type: object
      required: [client_group_id, name, admin_email]
      additionalProperties: false
      properties:
        client_group_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name. The slug is derived from it.
        admin_email:
          $ref: "#/components/schemas/Email"
        admin_username:
          type: string
          minLength: 1
          maxLength: 60
          pattern: "^[A-Za-z0-9_.@-]+$"
          description: WordPress admin username. Defaults to a generated name.
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        resources:
          $ref: "#/components/schemas/ResourceLimitsUpdate"

    SiteUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        resources:
          $ref: "#/components/schemas/ResourceLimitsUpdate"
        preview_protection:
          $ref: "#/components/schemas/PreviewProtectionUpdate"

    SiteAccepted:
      type: object
      required: [site, job]
      properties:
        site:
          $ref: "#/components/schemas/Site"
        job:
          $ref: "#/components/schemas/Job"
        preview_credentials:
          $ref: "#/components/schemas/PreviewCredentials"

    Domain:
      type: string
      description: |
        A host name, such as `www.acme.example`: letters, digits, and
        hyphens, at least two labels, no scheme, port, path, or wildcard.
        Internationalized names are given in their ASCII (`xn--`) form. It
        is stored in lower case without a trailing dot.
      minLength: 1
      maxLength: 253
      examples: ["www.acme.example"]

    SiteGoLive:
      type: object
      required: [primary_domain]
      additionalProperties: false
      properties:
        primary_domain:
          $ref: "#/components/schemas/Domain"
        aliases:
          type: array
          description: |
            Domains that redirect to the primary domain, each with a
            certificate of its own. They replace the site's aliases;
            omitted means none.
          maxItems: 20
          items:
            $ref: "#/components/schemas/Domain"
          examples: [["acme.example"]]
        skip_dns_check:
          type: boolean
          default: false
          description: |
            Skip the check that the domains resolve to this host, for hosts
            behind a CDN or load balancer. The certificates still need the
            domains to reach this host on port 80.

    SiteMaintenance:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: "`true` shows the maintenance page on every domain of the site; `false` serves the site again."

    PreviewProtection:
      type: object
      description: |
        HTTP basic auth on the site's preview domain (design doc §5.1). The
        password is never part of the site; it is returned once, when it is
        generated.
      required: [enabled, username]
      properties:
        enabled:
          type: boolean
          description: Whether the preview domain asks for the credentials.
        username:
          description: Null until a preview password has been generated.
          oneOf:
            - type: string
              examples: ["acme-marketing"]
            - type: "null"

    PreviewProtectionUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
          description: |
            Turns protection on or off. Turning it on the first time
            generates the password, returned in `preview_credentials`.
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[!-9;-~]+$"
          description: Printable ASCII without spaces or colons. Defaults to the site's slug.

    PreviewCredentials:
      type: object
      description: The preview domain's basic auth login. Shown only once.
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          description: The plaintext password. Shown only once.

    PreviewPasswordAccepted:
      type: object
      required: [credentials, job]
      properties:
        credentials:
          $ref: "#/components/schemas/PreviewCredentials"
        job:
          $ref: "#/components/schemas/Job"

    SiteAdminCredentials:
      type: object
      required: [username, email, password, login_url]
      properties:
        username:
          type: string
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password
          description: The plaintext password. Shown only once.
        login_url:
          type: string
          format: uri
          examples: ["https://acme-marketing.preview.agency.example/wp-login.php"]

    SiteList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    JobState:
      type: string
      description: |
        * `queued`: waiting for a worker, for the first time or to retry after an error (`error` says which).
        * `running`: a worker is running the job's steps.
        * `rolling_back`: the job failed for good and is undoing the steps it started.
        * `succeeded`: every step completed. Terminal.
        * `failed`: the job failed and rolled back the resources it created. Terminal.
        * `rollback_failed`: the job failed and rolling back failed too, so
          resources may be left behind; the step errors say where. Terminal.
      enum: [queued, running, rolling_back, succeeded, failed, rollback_failed]

    JobTargetType:
      type: string
      description: "`platform` is for maintenance jobs such as audit log cleanup."
      enum: [site, client_group, platform]

    JobTarget:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/JobTargetType"
        id:
          $ref: "#/components/schemas/ID"

    JobStepState:
      type: string
      description: "`failed` means the step's last attempt failed; it may be retried."
      enum: [pending, running, succeeded, failed, rolled_back, rollback_failed]

    JobLogEntry:
      type: object
      required: [time, level, message]
      properties:
        time:
          $ref: "#/components/schemas/Timestamp"
        level:
          type: string
          enum: [info, warn, error]
        message:
          type: string

    JobStep:
      type: object
      required: [name, state, attempts, started_at, finished_at]
      properties:
        name:
          type: string
          examples: ["create_database"]
        state:
          $ref: "#/components/schemas/JobStepState"
        attempts:
          type: integer
          minimum: 0
        started_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        log:
          type: array
          description: Omitted from job lists.
          items:
            $ref: "#/components/schemas/JobLogEntry"

    Job:
      type: object
      required: [id, type, target, state, attempts, max_attempts, result, steps, created_at, updated_at, started_at, finished_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        type:
          type: string
          description: What the job does. New types are added over time; treat unknown values as opaque.
          examples: ["site.create", "site.update", "site.delete", "site.start", "site.stop", "site.go_live"]
        target:
          $ref: "#/components/schemas/JobTarget"
        state:
          $ref: "#/components/schemas/JobState"
        error:
          type: string
          description: The most recent error. Present when the job failed, or is waiting to retry after an error.
        attempts:
          type: integer
          minimum: 0
          description: Attempts in the current phase. A job gets `max_attempts` attempts, then its rollback gets as many again.
        max_attempts:
          type: integer
          minimum: 1
        result:
          type: object
          additionalProperties: true
          description: |
            Outputs of the job, such as the IDs of what it created. Contents depend on the job type.
            Secret outputs appear as `{"secret_ref": "..."}` and are retrieved through the endpoint for that secret.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/JobStep"
        created_by:
          description: The user who started the job; null for jobs started by the platform.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    JobAccepted:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/Job"

    JobList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    AuditResult:
      type: string
      description: |
        * `success`: the request was allowed and succeeded.
        * `failure`: the request failed, e.g. validation, a conflict, or wrong login credentials.
        * `denied`: the caller's role or token scope doesn't allow the action.
      enum: [success, failure, denied]

    AuditEvent:
      type: object
      required: [id, occurred_at, actor_user_id, actor_token_id, action, target_type, target_id, result, source_ip]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        actor_user_id:
          description: The user who made the request. Null for a failed login. The user may since have been deleted.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        actor_token_id:
          description: The API token used, or null for a session.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        action:
          type: string
          description: |
            What was attempted: an authorization action such as `site.delete`,
            `user.update`, or `self.tokens.create`, or `self.login`.
          examples: ["site.delete"]
        target_type:
          description: The kind of target, e.g. `site`, `client_group`, `user`, or `api_token`. Null for actions on the platform or on collections.
          oneOf:
            - type: string
            - type: "null"
        target_id:
          description: The target's ID. Null when target_type is null.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        result:
          $ref: "#/components/schemas/AuditResult"
        source_ip:
          type: string
          description: The client address, after trusted proxies.
          examples: ["203.0.113.7"]

    AuditEventList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    NextCursor:
      description: Pass as `cursor` to get the next page. Null on the last page.
      oneOf:
        - type: string
        - type: "null"
