  /api/v1/jobs/{job_id}/events:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: streamJobEvents
      tags: [jobs]
      summary: Follow a job's progress
      description: |
        Streams a job's progress as server-sent events (`text/event-stream`)
        instead of polling `GET /api/v1/jobs/{job_id}`: first the job as it
        is and its log so far, then each change, until the job reaches a
        terminal state (`succeeded`, `failed`, or `rollback_failed`), when
        the server ends the stream. A job that has already finished gets
        its snapshot and log, and the stream ends at once. As with the site
        log stream, the generated client doesn't wrap this operation; use
        `EventSource` or `fetch`.

        Event types:

        * `job`: `data` is the `Job` as JSON, without step logs (as in job
          lists). Sent first (after the log, for a job that has already
          finished), and again whenever the job or one of its steps
          changes. Each event replaces the previous one. The events
          are snapshots of what the server reads, so a step that starts
          and finishes between two reads shows up as one change.
        * `log`: `data` is one `JobEventLogEntry`, a line of the step log,
          and `id` is the line's ID. Lines come in the order they were
          written, and all of them come before the `job` event that shows
          the job finished.
        * `error`: `data` is a Problem Details document, sent once before
          the stream ends because of a failure on the server (for example,
          the job was deleted). Clients should not reconnect immediately.
        * Comment lines (`: keepalive`) are sent every 15 seconds so
          proxies don't close an idle stream. Ignore them.

        A client that reconnects sends the `id` of the last `log` event it
        received as `Last-Event-ID` (a browser's `EventSource` does so on
        its own). The stream then starts with a fresh `job` snapshot and
        continues the log after that line instead of repeating it.
      parameters:
        - name: Last-Event-ID
          in: header
          description: |
            The `id` of the last `log` event the client received. When
            present, the stream sends only the log lines after it.
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: An open event stream.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent events as described above. The `data` of a
                  `job` event is a `Job` and that of a `log` event is a
                  `JobEventLogEntry`.
                examples:
                  - |
                    event: job
                    data: {"id":"01J9Z3M4D8XQ6V2N7R5T0KJH1C","type":"site.create","target":{"type":"site","id":"01J9Z3M2Q7WB5E8C4A6Y1FNG0S"},"state":"running","attempts":1,"max_attempts":5,"result":{},"steps":[{"name":"create_database","state":"running","attempts":1,"started_at":"2026-10-01T12:00:00Z","finished_at":null}],"created_by":null,"created_at":"2026-10-01T11:59:59Z","updated_at":"2026-10-01T12:00:00Z","started_at":"2026-10-01T12:00:00Z","finished_at":null}

                    id: 4182
                    event: log
                    data: {"time":"2026-10-01T12:00:00Z","level":"info","message":"Creating database","step":"create_database"}

                    : keepalive
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List audit events (Admin only)
      description: |
        Newest first. Every authenticated state-changing request, every
        authorization denial, and every login and logout is recorded with its
        actor, action, target, result, and client address. Request bodies and
        secrets are never recorded. Events older than the configured retention
        (`audit.retention_days`) are deleted daily.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: actor_user_id
          in: query
          description: Only return events by this user.
          schema:
            $ref: "#/components/schemas/ID"
        - name: action
          in: query
          description: Only return events for this action, e.g. `site.delete`.
          schema:
            type: string
            maxLength: 100
        - name: target_type
          in: query
          description: Only return events whose target has this type, e.g. `site`.
          schema:
            type: string
            maxLength: 50
        - name: target_id
          in: query
          description: Only return events for this target.
          schema:
            $ref: "#/components/schemas/ID"
        - name: since
          in: query
          description: Only return events at or after this time.
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: until
          in: query
          description: Only return events before this time.
          schema:
            $ref: "#/components/schemas/Timestamp"
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  # ---- alerts (#75) -------------------------------------------------------

  /api/v1/alert-rules:
    get:
      operationId: listAlertRules
      tags: [alerts]
      summary: List alert rules
      description: Ordered by name.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: scope
          in: query
          description: Only return rules with this scope.
          schema:
            $ref: "#/components/schemas/AlertScope"
        - name: client_group_id
          in: query
          description: Only return rules limited to this client group.
          schema:
            $ref: "#/components/schemas/ID"
        - name: enabled
          in: query
          description: Only return rules that are enabled (`true`) or disabled (`false`).
          schema:
            type: boolean
      responses:
        "200":
          description: A page of alert rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAlertRule
      tags: [alerts]
      summary: Create an alert rule (Operator or Admin)
      description: |
        The expression's brackets and quotes are checked, but its PromQL is
        only checked when VictoriaMetrics evaluates it. A `threshold` rule
        needs an `operator` and a `threshold`; an `expression` rule ignores
        both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleCreate"
      responses:
        "201":
          description: Alert rule created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/alert-rules/{alert_rule_id}:
    parameters:
      - name: alert_rule_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getAlertRule
      tags: [alerts]
      summary: Get an alert rule
      responses:
        "200":
          description: The alert rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAlertRule
      tags: [alerts]
      summary: Update an alert rule (Operator or Admin)
      description: |
        Built-in rules can be edited too, for example to change a threshold.
        Alerts that are firing follow the edit at the next evaluation: they
        resolve if the new condition no longer holds. Use the `enable` and
        `disable` operations to turn a rule on or off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleUpdate"
      responses:
        "200":
          description: The updated alert rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAlertRule
      tags: [alerts]
      summary: Delete an alert rule (Operator or Admin)
      description: |
        Deletes the rule and the alerts it raised. Built-in rules can't be
        deleted (`409`); disable them instead.
      responses:
        "204":
          description: Alert rule deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/alert-rules/{alert_rule_id}/enable:
    parameters:
      - name: alert_rule_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: enableAlertRule
      tags: [alerts]
      summary: Enable an alert rule (Operator or Admin)
      description: Enabling a rule that is already enabled changes nothing.
      responses:
        "200":
          description: The enabled alert rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/alert-rules/{alert_rule_id}/disable:
    parameters:
      - name: alert_rule_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: disableAlertRule
      tags: [alerts]
      summary: Disable an alert rule (Operator or Admin)
      description: |
        A disabled rule isn't evaluated. Its firing alerts resolve at the
        next evaluation, and their resolved events are sent. Idempotent.
      responses:
        "200":
          description: The disabled alert rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts
      description: |
        Newest first. An alert is one incident of one rule for one series,
        for example one site being down; it is `firing` until its condition
        stops, then `resolved`. Resolved alerts are kept for 90 days.
        Alerts that are still `pending` are included, so a dashboard can
        show what is about to fire.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          description: Only return alerts in this state.
          schema:
            $ref: "#/components/schemas/AlertState"
        - name: rule_id
          in: query
          description: Only return alerts of this rule.
          schema:
            $ref: "#/components/schemas/ID"
        - name: site_id
          in: query
          description: Only return alerts for this site.
          schema:
            $ref: "#/components/schemas/ID"
        - name: client_group_id
          in: query
          description: Only return alerts for sites in this client group.
          schema:
            $ref: "#/components/schemas/ID"
        - name: since
          in: query
          description: Only return alerts that started at or after this time.
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: until
          in: query
          description: Only return alerts that started before this time.
          schema:
            $ref: "#/components/schemas/Timestamp"
      responses:
        "200":
          description: A page of alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/alerts/{alert_id}:
    parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getAlert
      tags: [alerts]
      summary: Get an alert
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  # ---- alert channels (#76) -----------------------------------------------

  /api/v1/alert-channels:
    get:
      operationId: listAlertChannels
      tags: [alerts]
      summary: List alert channels
      description: |
        Ordered by name. Every role can list channels; credentials are never
        returned, only whether they are set and, for a webhook, its URL
        reduced to scheme and host.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: type
          in: query
          description: Only return channels of this type.
          schema:
            $ref: "#/components/schemas/AlertChannelType"
        - name: enabled
          in: query
          description: Only return channels that are enabled (`true`) or disabled (`false`).
          schema:
            type: boolean
      responses:
        "200":
          description: A page of alert channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannelList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAlertChannel
      tags: [alerts]
      summary: Create an alert channel (Admin)
      description: |
        A channel delivers alert events, firing and resolved, by email or to
        a webhook. Creating one doesn't send anything; use the `test`
        operation to check it works.

        An `email` channel needs `email.to`. Without `email.host` it sends
        through the platform's SMTP relay (the `smtp.*` settings). A
        `webhook` channel needs `webhook.url`. Slack and Teams URLs are
        credentials: they are stored encrypted and never returned.

        By default a channel receives every alert; `min_severity`,
        `rule_id`, and `client_group_id` narrow that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertChannelCreate"
      responses:
        "201":
          description: Alert channel created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/alert-channels/{alert_channel_id}:
    parameters:
      - name: alert_channel_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getAlertChannel
      tags: [alerts]
      summary: Get an alert channel
      responses:
        "200":
          description: The alert channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAlertChannel
      tags: [alerts]
      summary: Update an alert channel (Admin)
      description: |
        Only the fields present are changed, including inside `email` and
        `webhook`. Credentials that are absent stay as they are; send an
        empty string to remove one. The type can't change. Deliveries
        already queued use the channel as it is when they are sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertChannelUpdate"
      responses:
        "200":
          description: The updated alert channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAlertChannel
      tags: [alerts]
      summary: Delete an alert channel (Admin)
      description: |
        Deletes the channel, its credentials, and its delivery history.
      responses:
        "204":
          description: Alert channel deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/alert-channels/{alert_channel_id}/enable:
    parameters:
      - name: alert_channel_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: enableAlertChannel
      tags: [alerts]
      summary: Enable an alert channel (Admin)
      description: Enabling a channel that is already enabled changes nothing.
      responses:
        "200":
          description: The enabled alert channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/alert-channels/{alert_channel_id}/disable:
    parameters:
      - name: alert_channel_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: disableAlertChannel
      tags: [alerts]
      summary: Disable an alert channel (Admin)
      description: |
        A disabled channel receives no new events. Deliveries already queued
        for it fail with an explanation.
      responses:
        "200":
          description: The disabled alert channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/alert-channels/{alert_channel_id}/test:
    parameters:
      - name: alert_channel_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: testAlertChannel
      tags: [alerts]
      summary: Send a test notification (Admin)
      description: |
        Sends a synthetic notification through the channel, enabled or not,
        and waits for the outcome. A channel that fails the test is still a
        `200`: read `success` and `error`. Nothing is recorded in the
        delivery history.
      responses:
        "200":
          description: The outcome of the test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannelTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/alert-deliveries:
    get:
      operationId: listAlertDeliveries
      tags: [alerts]
      summary: List alert deliveries
      description: |
        The delivery history: each alert event (firing, resolved) bound for
        each channel that wanted it, newest first. A delivery is `pending`
        while it is retried, `delivered` once the channel accepted it, and
        `failed` when it ran out of attempts or can't succeed (the receiver
        refused it). `last_error` says what went wrong and never contains
        credentials.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: alert_id
          in: query
          description: Only return deliveries of this alert's events.
          schema:
            $ref: "#/components/schemas/ID"
        - name: channel_id
          in: query
          description: Only return deliveries to this channel.
          schema:
            $ref: "#/components/schemas/ID"
        - name: state
          in: query
          description: Only return deliveries in this state.
          schema:
            $ref: "#/components/schemas/AlertDeliveryState"
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertDeliveryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  # ---- end of alert channels ----------------------------------------------

  # ---- end of alerts ------------------------------------------------------

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pressfleet_session
      description: |
        Session cookie set by `POST /api/v1/auth/login`. Used by the dashboard.
        Unsafe requests must also send the `X-CSRF-Token` header (see CSRF
        protection above).
    bearerToken:
      type: http
      scheme: bearer
      description: "An API token created with `POST /api/v1/auth/tokens`, sent as `Authorization: Bearer <token>`."

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
        maxLength: 512
    LogSource:
      name: source
      in: query
      description: |
        Only return entries from these log sources; repeat the parameter to
        select several (`source=access&source=error`). Without it, entries
        of every source are returned.
      schema:
        type: array
        maxItems: 4
        items:
          $ref: "#/components/schemas/SiteLogSource"
    LogLevel:
      name: level
      in: query
      description: Only return entries of at least this level.
      schema:
        $ref: "#/components/schemas/SiteLogLevel"
    LogQuery:
      name: q
      in: query
      description: Only return entries whose line contains this text, ignoring case.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    MetricIDs:
      name: metric
      in: query
      description: |
        Metric ids from the catalog; repeat the parameter to select several
        (`metric=uptime&metric=latency`). With `group`, the metrics of both
        are returned, at most 20 in all.
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 64
    MetricGroups:
      name: group
      in: query
      description: Metric groups from the catalog (such as `traffic`); repeat to select several.
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 64
    MetricStart:
      name: start
      in: query
      description: Start of the range. Default is an hour before `end`.
      schema:
        $ref: "#/components/schemas/Timestamp"
    MetricEnd:
      name: end
      in: query
      description: End of the range. Default and maximum is now.
      schema:
        $ref: "#/components/schemas/Timestamp"
    MetricStep:
      name: step
      in: query
      description: |
        Seconds between points, at least 15. Default is the smallest step
        that keeps the range at about 300 points. The range divided by the
        step may give at most 1500 points.
      schema:
        type: integer
        minimum: 1
    TokenID:
      name: token_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    SSHKeyID:
      name: ssh_key_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    ClientGroupID:
      name: client_group_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    SiteID:
      name: site_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    BackupID:
      name: backup_id
      in: path
      required: true
      description: The `id` of a backup.
      schema:
        $ref: "#/components/schemas/ID"
    ExportID:
      name: export_id
      in: path
      required: true
      description: The `export_id` from the export job's result.
      schema:
        $ref: "#/components/schemas/ID"
    UploadID:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"

  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    JobLocation:
      description: URL of the queued job (`/api/v1/jobs/{job_id}`).
      schema:
        type: string
        format: uri-reference
    ExportContentDisposition:
      description: '`attachment` with the file name for the user, e.g. `<site slug>-wp-content.tar.gz`.'
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed (invalid JSON, unknown parameter format, or body too large).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller's role or token scope doesn't allow this action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource doesn't exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state (for example, a duplicate name or a job already running for the target).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: The resource was available once and has been consumed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: The request is well-formed but fails validation. `errors` lists each invalid field.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableDomains:
      description: |
        A domain fails validation (`about:blank`), or its DNS records don't
        point at this host (type
        `https://github.com/rchouinard/pressfleet/blob/main/docs/configuration.md#dns-check`,
        title `DNS check failed`). Either way `errors` lists each domain's
        problem, and nothing was changed. A DNS check that couldn't run at
        all, because the control plane doesn't know this host's public
        address, has the DNS type, no `errors`, and says why in `detail`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ContentTooLarge:
      description: The request body is larger than the operation allows.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body has the wrong content type.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many failed attempts. Try again after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed. Also `retry_after` in the body.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MetricsUnavailable:
      description: The metrics store (VictoriaMetrics) can't be reached, or metrics are turned off.
      headers:
        Retry-After:
          description: Seconds to wait before trying again. Also `retry_after` in the body.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: Any other error, including `500` and `501 Not Implemented`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ID:
      type: string
      description: Opaque, server-assigned identifier.
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
      examples: ["01J9ZQ3V6T8K4M2N5P7R9S1X3Y"]

    Timestamp:
      type: string
      format: date-time
      examples: ["2026-09-26T17:25:00Z"]

    Problem:
      type: object
      description: RFC 9457 Problem Details. Additional members may be added.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type. `about:blank` means the HTTP status says it all.
          default: about:blank
          examples: ["about:blank"]
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          examples: ["Not Found"]
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code.
          examples: [404]
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: The request path that produced the problem.
        request_id:
          type: string
          description: The request ID (also in the `X-Request-ID` response header). Include it when reporting issues.
        errors:
          type: array
          description: Validation errors, one per invalid field (`422` only).
          items:
            $ref: "#/components/schemas/FieldError"
        retry_after:
          type: integer
          minimum: 1
          description: |
            Seconds to wait before retrying (`429` and some `503`). The same
            value is in the `Retry-After` header.

    FieldError:
      type: object
      required: [field, detail]
      properties:
        field:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid member of the request body, or the parameter name.
          examples: ["/php_version"]
        detail:
          type: string
          examples: ["must be one of 8.2, 8.3, 8.4"]

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"

    DoctorReport:
      type: object
      required: [outcome, results]
      properties:
        outcome:
          type: string
          description: |
            The worst result: `failed` if a required check failed,
            `warnings` if a recommended check failed or a check warned,
            otherwise `ok`.
          enum: [ok, warnings, failed]
        results:
          type: array
          items:
            $ref: "#/components/schemas/DoctorResult"

    DoctorResult:
      type: object
      required: [id, name, severity, status, message]
      properties:
        id:
          type: string
          examples: ["docker"]
        name:
          type: string
          examples: ["Docker Engine"]
        severity:
          type: string
          description: Whether PressFleet can run when the check doesn't pass.
          enum: [required, recommended]
        status:
          type: string
          description: |
            `warn` means a likely problem or an unverifiable requirement,
            `skip` that the check doesn't apply, and `unavailable` that it
            can't run from the control plane and needs the host.
          enum: [pass, warn, fail, skip, unavailable]
        message:
          type: string
        fix:
          type: string
          description: How to resolve a warning or failure.

    ReadinessCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          examples: ["database"]
        status:
          type: string
          enum: [ok, failed]
        error:
          type: string
          description: Why the check failed.

    Role:
      type: string
      description: Platform-wide role (design doc §4.6).
      enum: [admin, operator, viewer]

    Email:
      type: string
      format: email
      maxLength: 254

    Password:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 256

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256

    User:
      type: object
      required: [id, email, display_name, role, disabled, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        email:
          $ref: "#/components/schemas/Email"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
          description: Disabled users can't log in and their tokens are rejected.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        last_login_at:
          description: Null if the user has never logged in.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    CurrentUser:
      description: The authenticated user, and how they authenticated.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [auth_method, csrf_token]
          properties:
            auth_method:
              type: string
              enum: [session, token]
              x-enum-varnames: [AuthMethodSession, AuthMethodToken]
            csrf_token:
              description: |
                The session's CSRF token. Send it in the `X-CSRF-Token` header
                with every cookie-authenticated unsafe request. Null for bearer
                token authentication, which needs none.
              oneOf:
                - type: string
                - type: "null"

    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256
        new_password:
          $ref: "#/components/schemas/Password"

    UserCreate:
      type: object
      required: [email, password, role]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        password:
          $ref: "#/components/schemas/Password"
        role:
          $ref: "#/components/schemas/Role"

    UserUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          $ref: "#/components/schemas/Email"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        password:
          $ref: "#/components/schemas/Password"
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean

    DisplayName:
      type: string
      maxLength: 100
      description: |
        A name to show instead of the email address. Empty if the user hasn't
        set one; clients then fall back to the email.
      examples: ["Alex Rivera"]

    ProfileUpdate:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name:
          $ref: "#/components/schemas/DisplayName"

    UserList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    TokenScope:
      type: string
      description: |
        What the token may do, intersected with its owner's current role
        (design doc §4.6). `full` allows everything the owner's role allows;
        `read-only` allows only read actions.
      enum: [full, read-only]

    ApiToken:
      type: object
      required: [id, name, scope, prefix, created_at, expires_at, last_used_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          description: A label to tell tokens apart.
          examples: ["CI deploys"]
        scope:
          $ref: "#/components/schemas/TokenScope"
        prefix:
          type: string
          description: The first characters of the token, so it can be recognized without revealing it.
          examples: ["pft_3kq9"]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          description: Null if the token never expires.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        last_used_at:
          description: Null if the token has never been used.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ApiTokenWithSecret:
      description: A newly created token, including its plaintext value. Returned only by `createApiToken`.
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The plaintext token. Store it now; it can't be retrieved again.

    ApiTokenCreate:
      type: object
      required: [name, scope]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scope:
          $ref: "#/components/schemas/TokenScope"
        expires_at:
          description: When the token stops working. Omit or send null for no expiry.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ApiTokenList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SshKey:
      type: object
      required: [id, name, type, fingerprint, public_key, created_at, last_used_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          description: A label to tell keys apart; the key's comment unless one was given.
          examples: ["dev@laptop"]
        type:
          type: string
          description: The key's algorithm.
          examples: ["ssh-ed25519"]
        fingerprint:
          type: string
          description: The key's SHA-256 fingerprint, as `ssh-keygen -l` prints it.
          examples: ["SHA256:uNiVztksCsDhcc0u9e8BujQXVUpKZIDTMczCvj3tD2s"]
        public_key:
          type: string
          description: The public key in authorized_keys format, without its comment.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          description: When the key last opened an SFTP session; null if never.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    SshKeyCreate:
      type: object
      required: [public_key]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          description: A label for the key. Defaults to the key's comment, or its type.
        public_key:
          type: string
          minLength: 1
          maxLength: 16384
          description: |
            One public key in authorized_keys format, as in a `.pub` file:
            `ssh-ed25519 AAAA... name@host`. Ed25519 (recommended), ECDSA,
            security key (`sk-`), and RSA keys of at least 2048 bits are
            accepted; DSA keys, certificates, and authorized_keys options
            are not.
          examples: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB7Wz8dE9FkE5o0B1QZq9kX0a8Qm3Yt0mC0hEo8dT0c7 dev@laptop"]

    SshKeyList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SshKey"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    ClientGroup:
      type: object
      required: [id, name, notes, site_count, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          examples: ["Acme Corp"]
        notes:
          type: string
          description: Free-form notes for the agency. Empty if unset.
        site_count:
          type: integer
          minimum: 0
          description: Number of sites in the group.
        backup_repository:
          description: |
            The group's backup repository, managed by the platform. Null until
            the repository has been initialized. Its encryption key is never
            exposed through the API.
          oneOf:
            - $ref: "#/components/schemas/BackupRepository"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    BackupKind:
      type: string
      description: |
        What asked for the backup: a user (`manual`), the site's backup
        schedule (`scheduled`), or a restore, which backs up its target site
        first so the restore can be undone (`pre_restore`), or a WordPress
        core update, which backs up its site first so a failed update can
        be reverted (`pre_update`).
      enum: [manual, scheduled, pre_restore, pre_update]

    BackupStatus:
      type: string
      enum: [running, succeeded, failed]

    Backup:
      type: object
      required: [id, site_id, site_name, site_slug, client_group_id, kind, status, snapshot_id, wp_core_version, size_bytes,
        added_bytes, file_count, message, job_id, created_at, started_at, finished_at, expired_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        site_id:
          $ref: "#/components/schemas/ID"
        site_name:
          type: string
          description: |
            The site's name when the backup was taken, so the backups of a
            deleted site can be told apart. Empty for backups taken before
            backups kept it, of sites deleted since.
        site_slug:
          type: string
          description: The site's slug when the backup was taken; empty like `site_name`.
        client_group_id:
          description: The client group whose backup repository holds the snapshot.
          allOf:
            - $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/BackupKind"
        status:
          $ref: "#/components/schemas/BackupStatus"
        snapshot_id:
          description: The Restic snapshot's ID; null until the backup has succeeded.
          oneOf:
            - type: string
              examples: ["3be90c95b9962949a5d839b7fd7adbef112b4a3d667f214a32989f615ce4f20b"]
            - type: "null"
        wp_core_version:
          type: string
          description: The site's WordPress core version when it was backed up. A restore needs at least this version.
          examples: ["6.9.1"]
        size_bytes:
          description: The size of the files backed up (the database dump and `wp-content`); null until the backup has succeeded.
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        added_bytes:
          description: |
            What the backup added to the repository after deduplication and
            compression; null until the backup has succeeded.
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        file_count:
          description: The number of files backed up; null until the backup has succeeded.
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        message:
          type: string
          description: |
            Why the backup failed, or a warning about a backup that succeeded
            without some files it couldn't read. Empty otherwise.
        job_id:
          description: The job that took the backup; null once the job is gone.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          description: When the latest attempt at the backup began.
          allOf:
            - $ref: "#/components/schemas/Timestamp"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        expired_at:
          description: |
            When the backup's snapshot was found to be gone from the
            repository, normally removed by the retention policy
            (`backup.retention`); it can no longer be restored. Null while it
            can.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    SiteLogSource:
      type: string
      enum: [access, error, slow, php]
      description: |
        The kind of log an entry belongs to: `access` (nginx, one JSON object
        per request), `error` (nginx), `slow` (PHP-FPM slow log), or `php`
        (PHP errors and warnings, PHP-FPM messages, and other output of the
        PHP container).

    SiteLogLevel:
      type: string
      enum: [debug, info, warn, error]

    SiteLogEntry:
      type: object
      required: [time, component, source, level, message]
      properties:
        time:
          $ref: "#/components/schemas/Timestamp"
        component:
          type: string
          enum: [nginx, php]
          description: The site container that wrote the line.
        source:
          $ref: "#/components/schemas/SiteLogSource"
        level:
          $ref: "#/components/schemas/SiteLogLevel"
        stream:
          type: string
          enum: [stdout, stderr]
          description: The output stream of the line. Absent if the orchestrator doesn't keep them apart.
        message:
          type: string
          description: |
            The log line without its line terminator. For `access` entries
            it is a JSON object with `time`, `remote_addr`, `host`,
            `method`, `uri`, `protocol`, `status`, `body_bytes_sent`,
            `request_time`, `upstream_response_time`,
            `upstream_cache_status`, `referer`, and `user_agent`, which
            clients can parse for display. It may hold personal data, such
            as visitor IP addresses.

    SiteLogList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page's entries, oldest first.
          items:
            $ref: "#/components/schemas/SiteLogEntry"
        next_cursor:
          description: Pass as `cursor` to get the next, older page. Null when there are no older entries.
          $ref: "#/components/schemas/NextCursor"

    MetricUnit:
      type: string
      description: |
        What a value counts, in base units. `timestamp` is Unix seconds and
        `code` an HTTP status code.
      enum: [seconds, bytes, ratio, count, per_second, bytes_per_second, cores, timestamp, code]

    MetricKind:
      type: string
      description: |
        How a value is derived: `gauge` is sampled as is, `rate` comes from a
        counter (per second, or an increase over the step), `ratio` is a
        fraction from 0 to 1, and `percentile` is a latency quantile (its
        series have a `percentile` label).
      enum: [gauge, rate, ratio, percentile]

    MetricDescriptor:
      type: object
      required: [id, title, description, unit, kind, group, scope, labels, default_summary]
      properties:
        id:
          type: string
          description: Stable; pass as `metric`.
          examples: ["status_codes"]
        title:
          type: string
        description:
          type: string
        unit:
          $ref: "#/components/schemas/MetricUnit"
        kind:
          $ref: "#/components/schemas/MetricKind"
        group:
          type: string
          description: Pass as `group` to select every metric of the group.
          examples: ["traffic"]
        scope:
          type: string
          description: |
            `site` metrics are served by the site endpoints; `platform` and
            `client_group` ones by the platform endpoints.
          enum: [site, platform, client_group]
        labels:
          type: array
          description: Labels that tell the metric's series apart, such as `status_class`. Empty if it has one series.
          items:
            type: string
        default_summary:
          type: boolean
          description: Whether a summary request that names no metrics includes it.

    MetricLimits:
      type: object
      required: [default_range_seconds, max_range_seconds, min_step_seconds, max_points, max_metrics]
      properties:
        default_range_seconds:
          type: integer
        max_range_seconds:
          type: integer
        min_step_seconds:
          type: integer
        max_points:
          type: integer
          description: Most points per series.
        max_metrics:
          type: integer
          description: Most metrics in one request, after groups are expanded.

    MetricCatalog:
      type: object
      required: [items, limits]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MetricDescriptor"
        limits:
          $ref: "#/components/schemas/MetricLimits"

    MetricPoint:
      type: object
      required: [time, value]
      properties:
        time:
          $ref: "#/components/schemas/Timestamp"
        value:
          type: number
          format: double

    MetricSeries:
      type: object
      required: [labels, points, latest]
      properties:
        labels:
          type: object
          description: Labels of the series, such as `status_class` or `domain`. Empty for a metric with one series.
          additionalProperties:
            type: string
        points:
          type: array
          description: Oldest first. A step without a value has no point.
          items:
            $ref: "#/components/schemas/MetricPoint"
        latest:
          $ref: "#/components/schemas/MetricPoint"

    MetricResult:
      type: object
      required: [id, unit, kind, series]
      properties:
        id:
          type: string
        unit:
          $ref: "#/components/schemas/MetricUnit"
        kind:
          $ref: "#/components/schemas/MetricKind"
        series:
          type: array
          description: Empty while the metric has no data.
          items:
            $ref: "#/components/schemas/MetricSeries"

    MetricsRange:
      type: object
      required: [start, end, step_seconds, metrics]
      properties:
        start:
          $ref: "#/components/schemas/Timestamp"
        end:
          $ref: "#/components/schemas/Timestamp"
        step_seconds:
          type: integer
        metrics:
          type: array
          description: One result per selected metric, in catalog order.
          items:
            $ref: "#/components/schemas/MetricResult"

    MetricValue:
      type: object
      required: [labels, time, value]
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
        time:
          $ref: "#/components/schemas/Timestamp"
        value:
          type: number
          format: double

    MetricSummaryResult:
      type: object
      required: [id, unit, kind, values]
      properties:
        id:
          type: string
        unit:
          $ref: "#/components/schemas/MetricUnit"
        kind:
          $ref: "#/components/schemas/MetricKind"
        values:
          type: array
          description: Empty while the metric has no data.
          items:
            $ref: "#/components/schemas/MetricValue"

    PlatformCapacity:
      type: object
      required: [reserved_memory_mb, counted_sites, host_memory_mb, ratio, level]
      properties:
        reserved_memory_mb:
          type: integer
          format: int64
          description: Memory reserved by the counted sites, in MiB.
        counted_sites:
          type: integer
          description: Number of sites counted, those not stopped or deleting.
        host_memory_mb:
          type: [number, "null"]
          format: double
          description: The host's memory in MiB; null when not known yet.
        ratio:
          type: [number, "null"]
          format: double
          description: Reserved share of host memory (1 = all of it); null when the host's memory is not known.
        level:
          type: string
          enum: [ok, caution, exceeded, unknown]
          description: |
            `caution` from 90% of host memory, `exceeded` above 100%,
            `unknown` when the host's memory is not known.

    MetricsSummary:
      type: object
      required: [time, metrics]
      properties:
        time:
          $ref: "#/components/schemas/Timestamp"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricSummaryResult"

    SiteJobLogEntry:
      type: object
      required: [id, time, level, message, job_id, job_type, step]
      properties:
        id:
          type: string
          description: Identifies the line; unique across the site's jobs.
        time:
          $ref: "#/components/schemas/Timestamp"
        level:
          type: string
          enum: [info, warn, error]
        message:
          type: string
        job_id:
          $ref: "#/components/schemas/ID"
        job_type:
          type: string
          description: The type of the job that wrote the line.
          examples: ["site.create"]
        step:
          description: The name of the job step the line belongs to, or null for lines outside a step.
          oneOf:
            - type: string
            - type: "null"

    SiteJobLogList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page's lines, newest first.
          items:
            $ref: "#/components/schemas/SiteJobLogEntry"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    ExportKind:
      type: string
      description: |
        What an export holds: `database`, a site's database
        (`database.sql.gz`); `site`, a live site's `wp-content` and database
        (`wp-content.tar.gz` and `database.sql.gz`, the files a site import
        takes); `snapshot`, the same two files from a backup.
      enum: [database, site, snapshot]

    ExportStatus:
      type: string
      description: |
        `running` while the job writes the files; `ready` while they can be
        downloaded; `failed` if the job failed (`message` says why);
        `expired` once the files were deleted.
      enum: [running, ready, failed, expired]

    ExportFileName:
      type: string
      enum: [wp-content.tar.gz, database.sql.gz]

    ExportFile:
      type: object
      required: [name, size_bytes, download_url]
      properties:
        name:
          $ref: "#/components/schemas/ExportFileName"
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        download_url:
          type: string
          description: "`GET /api/v1/exports/{export_id}/files/{file_name}`."
          examples: ["/api/v1/exports/01j9z3k4m5n6p7q8r9s0t1v2w3/files/wp-content.tar.gz"]

    ExportSource:
      type: object
      description: What the export holds, for whoever imports it. Empty strings are unknown.
      required: [site_url, table_prefix, wp_core_version, php_version, taken_at]
      properties:
        site_url:
          type: string
          description: The site's URL; for an export from a backup, its `home` option then.
          examples: ["https://www.acme.example"]
        table_prefix:
          type: string
          description: The WordPress table prefix of the database.
          examples: ["wp_"]
        wp_core_version:
          type: string
          examples: ["6.9.1"]
        php_version:
          type: string
          description: The site's PHP version; empty for an export from a backup.
          examples: ["8.4"]
        taken_at:
          description: When the site's content was read, or when the backup's snapshot was taken.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    Export:
      type: object
      required: [id, kind, site_id, site_slug, client_group_id, status, backup_id, snapshot_id, source, files,
        size_bytes, message, job_id, created_at, ready_at, expires_at, expired_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/ExportKind"
        site_id:
          description: The exported site, which may have been deleted since.
          allOf:
            - $ref: "#/components/schemas/ID"
        site_slug:
          type: string
          description: The site's slug when the export began (or the backup was taken), which names the files.
        client_group_id:
          $ref: "#/components/schemas/ID"
        status:
          $ref: "#/components/schemas/ExportStatus"
        backup_id:
          description: The backup a `snapshot` export reads; null for other kinds.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        snapshot_id:
          description: The backup's Restic snapshot; null for other kinds.
          oneOf:
            - type: string
            - type: "null"
        source:
          $ref: "#/components/schemas/ExportSource"
        files:
          description: The export's files while it is ready; empty otherwise.
          type: array
          items:
            $ref: "#/components/schemas/ExportFile"
        size_bytes:
          description: The size of all files; null until the export is ready.
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
        message:
          type: string
          description: Why the export failed; empty otherwise.
        job_id:
          description: The export job; null once the job is gone.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        ready_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        expires_at:
          description: When the files stop being downloadable and are deleted.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        expired_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ExportList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Export"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    BackupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Backup"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    BackupIntervalHours:
      type: integer
      description: |
        Hours between backups: a divisor of 24 (1, 2, 3, 4, 6, 8, or 12) or a
        whole number of days up to a week (24, 48, ..., 168), so backups
        start at the same times every day.
      minimum: 1
      maximum: 168
      default: 24
      examples: [24]

    BackupHour:
      description: |
        The UTC hour, 0 to 23, that the site's backups start in, at a
        minute that is the same every day. With an interval shorter than a
        day, one of the day's backups starts in this hour. Null means a time
        within the platform's backup window.
      oneOf:
        - type: integer
          minimum: 0
          maximum: 23
          examples: [3]
        - type: "null"

    BackupSchedule:
      type: object
      required: [enabled, interval_hours, hour, next_run_at]
      properties:
        enabled:
          type: boolean
          description: Whether the site is backed up on a schedule.
        interval_hours:
          $ref: "#/components/schemas/BackupIntervalHours"
        hour:
          $ref: "#/components/schemas/BackupHour"
        next_run_at:
          description: |
            When the next scheduled backup is due; null if the schedule is
            off or the site can't be backed up (it is being deleted, or its
            provisioning failed). The backup starts then, or after any other
            job working on the site.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    BackupScheduleUpdate:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether the site is backed up on a schedule.
        interval_hours:
          $ref: "#/components/schemas/BackupIntervalHours"
        hour:
          $ref: "#/components/schemas/BackupHour"

    SiteDeployment:
      type: object
      required: [upload_id, kind, name]
      additionalProperties: false
      properties:
        upload_id:
          description: |
            A complete upload of the package, a zip or tar.gz, started by
            the caller for this site (`purpose: site_deploy`).
          allOf:
            - $ref: "#/components/schemas/ID"
        kind:
          type: string
          description: |
            Where the package goes: `theme` (`wp-content/themes`), `plugin`
            (`wp-content/plugins`), or `mu-plugin` (`wp-content/mu-plugins`).
          enum: [theme, plugin, mu-plugin]
        name:
          type: string
          description: |
            The target's directory name, which is also the theme's or
            plugin's slug for WP-CLI. An existing directory of that name is
            replaced.
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          examples: ["acme-theme"]
        activate:
          type: boolean
          default: false
          description: |
            Activate the theme or plugin once it is in place (not for
            `mu-plugin`, which is always active). A rolled-back deployment
            switches back to what was active before.

    SiteRestore:
      type: object
      required: [snapshot_id]
      additionalProperties: false
      properties:
        snapshot_id:
          type: string
          description: |
            The snapshot to restore: a backup's `snapshot_id`, or a prefix
            of it of at least 8 characters.
          minLength: 1
          maxLength: 64
          examples: ["3be90c95b9962949a5d839b7fd7adbef112b4a3d667f214a32989f615ce4f20b"]
        source_site_id:
          description: |
            The site the snapshot is of, in the same client group; omit it
            to restore one of the site's own snapshots. The source may have
            been deleted, as long as its backups are in the repository.
          allOf:
            - $ref: "#/components/schemas/ID"

    BackupRepository:
      type: object
      required: [location]
      properties:
        location:
          type: string
          description: Where the Restic repository lives (a local path or S3 URL), without credentials.
          examples: ["s3:https://s3.example.com/pressfleet-backups/01J9ZQ3V6T8K4M2N5P7R9S1X3Y"]

    ClientGroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 10000

    ClientGroupUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 10000

    ClientGroupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientGroup"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SiteStatus:
      type: string
      description: |
        Recorded lifecycle status of a site. `provisioning`, `updating`, and
        `deleting` mean a job is working on the site; `failed` means the last
        job failed (see `status_message`). What the containers are doing
        right now is the site's `runtime`.
      enum: [provisioning, running, stopped, updating, deleting, failed]

    SiteRuntime:
      type: object
      description: |
        The live state of the site's containers, observed when the site was
        read. Only `GET /api/v1/sites/{site_id}` includes it; listings report
        the recorded `status` alone.
      required: [phase]
      properties:
        phase:
          type: string
          description: |
            * `pending`: containers are starting or not healthy yet.
            * `running`: every container is running and healthy.
            * `stopped`: the containers are stopped.
            * `failed`: a container exited or is unhealthy (see `message`).
            * `absent`: the site has no containers, e.g. before provisioning
              starts them or after failed provisioning removed them.
            * `unknown`: the container runtime couldn't be reached in time;
              `status` is the last recorded status.
          enum: [pending, running, stopped, failed, absent, unknown]
        message:
          type: string
          description: Details about the phase, such as which container is unhealthy.

    PHPVersion:
      type: string
      description: A PHP version the platform publishes site images for.
      pattern: "^[0-9]+\\.[0-9]+$"
      examples: ["8.4"]

    ResourceLimits:
      type: object
      description: Limits for the site as a whole; the platform splits them between the site's containers.
      required: [cpu, memory_reservation_mb, memory_limit_mb]
      properties:
        cpu:
          type: string
          description: CPU limit in cores.
          pattern: "^[0-9]+(\\.[0-9]+)?$"
          examples: ["1.0"]
        memory_reservation_mb:
          type: integer
          minimum: 32
          description: Guaranteed memory baseline in MiB.
          examples: [128]
        memory_limit_mb:
          type: integer
          minimum: 64
          description: Hard memory limit in MiB, allowing bursts above the reservation. Must be at least `memory_reservation_mb`.
          examples: [512]

    ResourceLimitsUpdate:
      type: object
      description: Partial resource limits. Omitted fields keep their current value, or the platform default when creating a site.
      additionalProperties: false
      minProperties: 1
      properties:
        cpu:
          type: string
          pattern: "^[0-9]+(\\.[0-9]+)?$"
        memory_reservation_mb:
          type: integer
          minimum: 32
        memory_limit_mb:
          type: integer
          minimum: 64

    Site:
      type: object
      required:
        - id
        - client_group_id
        - name
        - slug
        - preview_domain
        - primary_domain
        - aliases
        - php_version
        - wp_core_version
        - resources
        - preview_protection
        - maintenance
        - status
        - parent_site_id
        - admin_credentials_available
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ID"
        client_group_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          examples: ["Acme marketing site"]
        slug:
          type: string
          description: Unique, URL-safe name assigned at creation. Forms the preview domain.
          examples: ["acme-marketing"]
        preview_domain:
          type: string
          description: "`<slug>.<preview-base-domain>`; always reachable over HTTPS."
          examples: ["acme-marketing.preview.agency.example"]
        primary_domain:
          description: The domain the site is served on once live (`POST /api/v1/sites/{site_id}/go-live`); null until then.
          oneOf:
            - type: string
              examples: ["www.acme.example"]
            - type: "null"
        aliases:
          type: array
          description: Additional domains that redirect to the primary domain, sorted. Empty until the site goes live; `PUT /api/v1/sites/{site_id}/aliases` changes them.
          items:
            type: string
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        wp_core_version:
          type: string
          description: WordPress core version of the site's images. Managed by the platform; `GET /api/v1/sites/{site_id}/core` shows its updates.
          examples: ["6.9.1"]
        resources:
          $ref: "#/components/schemas/ResourceLimits"
        preview_protection:
          $ref: "#/components/schemas/PreviewProtection"
        maintenance:
          type: boolean
          description: |
            Whether the site is in maintenance mode: its domains answer with
            the platform's maintenance page (design doc §5.4).
        status:
          $ref: "#/components/schemas/SiteStatus"
        status_message:
          type: string
          description: Details about the status, such as why the site failed.
        runtime:
          $ref: "#/components/schemas/SiteRuntime"
        url:
          type: string
          format: uri
          description: The site's current public URL (primary domain if live, else preview domain).
          examples: ["https://acme-marketing.preview.agency.example"]
        parent_site_id:
          description: Reserved for staging clones; always null in the MVP.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        admin_credentials_available:
          type: boolean
          description: Whether the initial WordPress admin credentials can still be retrieved.
        pending_updates:
          $ref: "#/components/schemas/PendingUpdateCounts"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    PendingUpdateCounts:
      type: object
      description: |
        How many plugins and themes of the site had an update available at
        its latest update check (`GET /api/v1/sites/{site_id}/updates` lists
        them). Returned when listing and getting sites; absent until the
        site has been checked.
      required: [plugins, themes, checked_at]
      properties:
        plugins:
          type: integer
          minimum: 0
        themes:
          type: integer
          minimum: 0
        checked_at:
          $ref: "#/components/schemas/Timestamp"

    PendingUpdate:
      type: object
      description: A plugin or theme with an update available.
      required: [name, title, version, update_version]
      properties:
        name:
          type: string
          description: The plugin's or theme's slug.
          examples: ["woocommerce"]
        title:
          type: string
          description: Its display name; empty if it has none.
          examples: ["WooCommerce"]
        version:
          type: string
          description: The installed version.
          examples: ["9.1.0"]
        update_version:
          type: string
          description: The version available.
          examples: ["9.2.1"]

    SiteUpdates:
      type: object
      required: [checked_at, plugins, themes]
      properties:
        checked_at:
          description: When the latest successful check ran; null if the site hasn't been checked yet.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        plugins:
          type: array
          description: Plugins with an update available, sorted by name.
          items:
            $ref: "#/components/schemas/PendingUpdate"
        themes:
          type: array
          description: Themes with an update available, sorted by name.
          items:
            $ref: "#/components/schemas/PendingUpdate"

    WordPressBranch:
      type: string
      description: A WordPress major branch (x.y).
      pattern: "^[0-9]+\\.[0-9]+$"
      examples: ["7.2"]

    CorePolicy:
      type: object
      required: [hold]
      properties:
        hold:
          type: boolean
          description: Keeps the site on its current major branch, which still gets its minor and security releases.
        hold_since:
          $ref: "#/components/schemas/Timestamp"
        approved_branch:
          $ref: "#/components/schemas/WordPressBranch"

    CorePolicyUpdate:
      type: object
      additionalProperties: false
      description: At most one of `hold` and `approved_branch`; neither clears the policy.
      properties:
        hold:
          type: boolean
        approved_branch:
          $ref: "#/components/schemas/WordPressBranch"

    CoreWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            `held_long`: held on an older branch for longer than
            `updates.core.hold_warning_days`. `branch_not_built`: the
            site's branch has no site images any more, so it gets no core
            updates. `branch_insecure`: wordpress.org reports the branch's
            newest release as insecure; it no longer gets security fixes.
          enum: [held_long, branch_not_built, branch_insecure]
        message:
          type: string

    SiteCore:
      type: object
      required: [version, branch, policy, client_group_policy, held, decided_by, warnings]
      properties:
        version:
          type: string
          examples: ["7.1.2"]
        branch:
          $ref: "#/components/schemas/WordPressBranch"
        policy:
          $ref: "#/components/schemas/CorePolicy"
        client_group_policy:
          $ref: "#/components/schemas/CorePolicy"
        held:
          type: boolean
          description: Whether a hold, the site's or its group's, keeps the site on its branch.
        approved_branch:
          $ref: "#/components/schemas/WordPressBranch"
        decided_by:
          type: string
          description: Whose hold or approval applies; `auto` is `updates.core.major_auto_approve_days`.
          enum: [default, site, client_group, auto]
        target:
          $ref: "#/components/schemas/CoreTarget"
        pending:
          $ref: "#/components/schemas/CorePending"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CoreWarning"
        last_failure:
          $ref: "#/components/schemas/CoreUpdateFailure"

    CoreTarget:
      type: object
      description: The release the site moves to at the rollout's next chance; absent if it is up to date as far as its policy allows.
      required: [version, kind]
      properties:
        version:
          type: string
        kind:
          type: string
          enum: [minor, major]

    CorePending:
      type: object
      description: The newest major release the site may not move to yet.
      required: [version, branch, reason]
      properties:
        version:
          type: string
        branch:
          $ref: "#/components/schemas/WordPressBranch"
        reason:
          type: string
          enum: [held, awaiting_approval]
        auto_approve_at:
          $ref: "#/components/schemas/Timestamp"

    CoreRelease:
      type: object
      required: [version, branch, insecure]
      properties:
        version:
          type: string
        branch:
          $ref: "#/components/schemas/WordPressBranch"
        published:
          type: string
          format: date
        insecure:
          type: boolean

    UpdateWindow:
      type: object
      description: The daily maintenance window, in UTC; absent if there is none.
      required: [start, hours]
      properties:
        start:
          type: string
          examples: ["02:00"]
        hours:
          type: integer

    CoreUpdateFailure:
      type: object
      description: A site's failed update to `version`, which the rollout doesn't retry.
      required: [site_id, version, message, failed_at]
      properties:
        site_id:
          $ref: "#/components/schemas/ID"
        version:
          type: string
        message:
          type: string
        failed_at:
          $ref: "#/components/schemas/Timestamp"

    CoreRollout:
      type: object
      required: [halted, consecutive_failures, max_failures, releases, failures]
      properties:
        halted:
          type: boolean
        halted_at:
          $ref: "#/components/schemas/Timestamp"
        halt_reason:
          type: string
        consecutive_failures:
          type: integer
        max_failures:
          type: integer
        window:
          $ref: "#/components/schemas/UpdateWindow"
        releases:
          type: array
          description: The WordPress releases with site images, newest first; one per branch.
          items:
            $ref: "#/components/schemas/CoreRelease"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/CoreUpdateFailure"

    ImageBuild:
      type: object
      description: The newest build of a site image tag that the image rollout has seen.
      required: [image, build, checked_at]
      properties:
        image:
          type: string
          description: The image tag, e.g. `ghcr.io/rchouinard/pressfleet/site-php:php8.4-wp6.9.1`.
        build:
          type: string
          description: The build, as `repository@sha256:<digest>`, or a local image ID for a locally built image.
        checked_at:
          $ref: "#/components/schemas/Timestamp"
        pulled_at:
          $ref: "#/components/schemas/Timestamp"

    ImageUpdateFailure:
      type: object
      description: A site's failed update to `target`, which the rollout doesn't retry.
      required: [site_id, target, message, failed_at]
      properties:
        site_id:
          $ref: "#/components/schemas/ID"
        target:
          type: string
          description: The builds the update moved the site to, as `php=<build> nginx=<build>`.
        message:
          type: string
        failed_at:
          $ref: "#/components/schemas/Timestamp"

    Platform:
      type: object
      required: [sftp, build]
      properties:
        sftp:
          $ref: "#/components/schemas/PlatformSftp"
        build:
          $ref: "#/components/schemas/PlatformBuild"
    PlatformBuild:
      type: object
      description: The build of the running control plane.
      required: [version, go_version, os, arch]
      properties:
        version:
          type: string
          description: The release version, or `dev` for an unversioned build.
          example: v0.4.0
        commit:
          type: string
          description: The full commit hash the binary was built from; absent when unknown.
          example: adbf70e45beb349cc44022eebc2afaa2d55790e8
        modified:
          type: boolean
          description: Whether the working tree had uncommitted changes at build time; absent when unknown.
        go_version:
          type: string
          description: The Go toolchain that built the binary.
          example: go1.27.1
        os:
          type: string
          example: linux
        arch:
          type: string
          example: amd64
    PlatformSftp:
      type: object
      description: Where developers reach the SFTP gateway (design doc §5.8).
      required: [enabled, host, port]
      properties:
        enabled:
          type: boolean
          description: Whether the gateway runs. When false, `host` and `port` are still reported but nothing listens.
        host:
          type: string
          description: The gateway's host name, the dashboard domain.
          example: fleet.example.com
        port:
          type: integer
          description: The port the platform publishes the gateway on (`sftp.port`).
          example: 2222

    PHPVersionCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/PHPVersionInfo"
        default:
          $ref: "#/components/schemas/PHPVersion"

    PHPVersionInfo:
      type: object
      required: [version, status, active_support_ends, security_support_ends]
      properties:
        version:
          $ref: "#/components/schemas/PHPVersion"
        status:
          type: string
          description: |
            Support status today. `active`: bug and security fixes.
            `security-only`: security fixes only. `eol-soon`: security fixes
            only, ending within 180 days. `eol`: no upstream support; no
            images are built, and sites can't be set to it.
          enum: [active, security-only, eol-soon, eol]
        active_support_ends:
          type: string
          format: date
          description: Last day of active support (bug fixes).
        security_support_ends:
          type: string
          format: date
          description: Last day of security support, the version's end of life.

    ImageRollout:
      type: object
      required: [halted, consecutive_failures, max_failures, images, failures]
      properties:
        halted:
          type: boolean
        halted_at:
          $ref: "#/components/schemas/Timestamp"
        halt_reason:
          type: string
        consecutive_failures:
          type: integer
        max_failures:
          type: integer
        window:
          $ref: "#/components/schemas/UpdateWindow"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageBuild"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/ImageUpdateFailure"

    TemplateRollout:
      type: object
      required: [halted, consecutive_failures, max_failures, templates, pending_sites, failures]
      properties:
        halted:
          type: boolean
        halted_at:
          $ref: "#/components/schemas/Timestamp"
        halt_reason:
          type: string
        consecutive_failures:
          type: integer
        max_failures:
          type: integer
        window:
          $ref: "#/components/schemas/UpdateWindow"
        templates:
          type: string
          description: The fingerprint of this release's site templates and rendering code.
          example: r1-3f9a0c2e7b5d1844
        pending_sites:
          type: integer
          description: The running sites rendered with other templates, which the rollout still has to update, including those whose update failed.
        failures:
          type: array
          items:
            $ref: "#/components/schemas/TemplateUpdateFailure"

    TemplateUpdateFailure:
      type: object
      description: A site's failed update to the templates `target`, which the rollout doesn't retry.
      required: [site_id, target, message, failed_at]
      properties:
        site_id:
          $ref: "#/components/schemas/ID"
        target:
          type: string
          description: The fingerprint of the templates the update moved the site to.
        message:
          type: string
        failed_at:
          $ref: "#/components/schemas/Timestamp"

    SiteCreate:
      type: object
      required: [client_group_id, name, admin_email]
      additionalProperties: false
      properties:
        client_group_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name. The slug is derived from it.
        admin_email:
          $ref: "#/components/schemas/Email"
        admin_username:
          type: string
          minLength: 1
          maxLength: 60
          pattern: "^[A-Za-z0-9_.@-]+$"
          description: WordPress admin username. Defaults to a generated name.
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        resources:
          $ref: "#/components/schemas/ResourceLimitsUpdate"

    SiteImport:
      type: object
      required: [client_group_id, archive_upload_id, dump_upload_id]
      additionalProperties: false
      properties:
        client_group_id:
          $ref: "#/components/schemas/ID"
        archive_upload_id:
          $ref: "#/components/schemas/ID"
        dump_upload_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name. Defaults to the imported site's title.
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        resources:
          $ref: "#/components/schemas/ResourceLimitsUpdate"

    SiteImportAccepted:
      type: object
      required: [site_id, job]
      properties:
        site_id:
          $ref: "#/components/schemas/ID"
        job:
          $ref: "#/components/schemas/Job"

    SiteUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        php_version:
          $ref: "#/components/schemas/PHPVersion"
        resources:
          $ref: "#/components/schemas/ResourceLimitsUpdate"
        preview_protection:
          $ref: "#/components/schemas/PreviewProtectionUpdate"

    SiteAccepted:
      type: object
      required: [site, job]
      properties:
        site:
          $ref: "#/components/schemas/Site"
        job:
          $ref: "#/components/schemas/Job"
        preview_credentials:
          $ref: "#/components/schemas/PreviewCredentials"

    Domain:
      type: string
      description: |
        A host name, such as `www.acme.example`: letters, digits, and
        hyphens, at least two labels, no scheme, port, path, or wildcard.
        Internationalized names are given in their ASCII (`xn--`) form. It
        is stored in lower case without a trailing dot.
      minLength: 1
      maxLength: 253
      examples: ["www.acme.example"]

    SiteGoLive:
      type: object
      required: [primary_domain]
      additionalProperties: false
      properties:
        primary_domain:
          $ref: "#/components/schemas/Domain"
        aliases:
          type: array
          description: |
            Domains that redirect to the primary domain, each with a
            certificate of its own. They replace the site's aliases;
            omitted means none.
          maxItems: 20
          items:
            $ref: "#/components/schemas/Domain"
          examples: [["acme.example"]]
        skip_dns_check:
          type: boolean
          default: false
          description: |
            Skip the check that the domains resolve to this host, for hosts
            behind a CDN or load balancer. The certificates still need the
            domains to reach this host on port 80.

    SiteAliases:
      type: object
      required: [aliases]
      additionalProperties: false
      properties:
        aliases:
          type: array
          description: The site's aliases from now on; an empty list removes them all.
          maxItems: 20
          items:
            $ref: "#/components/schemas/Domain"
          examples: [["acme.example", "shop.acme.example"]]
        skip_dns_check:
          type: boolean
          default: false
          description: Skip the DNS check of new aliases, for hosts behind a CDN or load balancer.

    SiteMaintenance:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: "`true` shows the maintenance page on every domain of the site; `false` serves the site again."

    PreviewProtection:
      type: object
      description: |
        HTTP basic auth on the site's preview domain (design doc §5.1). The
        password is never part of the site; it is returned once, when it is
        generated.
      required: [enabled, username]
      properties:
        enabled:
          type: boolean
          description: Whether the preview domain asks for the credentials.
        username:
          description: Null until a preview password has been generated.
          oneOf:
            - type: string
              examples: ["acme-marketing"]
            - type: "null"

    PreviewProtectionUpdate:
      type: object
      description: Only the fields present are changed.
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
          description: |
            Turns protection on or off. Turning it on the first time
            generates the password, returned in `preview_credentials`.
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[!-9;-~]+$"
          description: Printable ASCII without spaces or colons. Defaults to the site's slug.

    PreviewCredentials:
      type: object
      description: The preview domain's basic auth login. Shown only once.
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          description: The plaintext password. Shown only once.

    PreviewPasswordAccepted:
      type: object
      required: [credentials, job]
      properties:
        credentials:
          $ref: "#/components/schemas/PreviewCredentials"
        job:
          $ref: "#/components/schemas/Job"

    SiteAdminCredentials:
      type: object
      required: [username, email, password, login_url]
      properties:
        username:
          type: string
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password
          description: The plaintext password. Shown only once.
        login_url:
          type: string
          format: uri
          examples: ["https://acme-marketing.preview.agency.example/wp-login.php"]

    AdminLoginCreate:
      type: object
      additionalProperties: false
      properties:
        user:
          type: string
          minLength: 1
          maxLength: 60
          description: The WordPress login to use. Defaults to the administrator the platform created with the site.
    AdminLogin:
      type: object
      required: [url, token, user, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: The site's login URL to submit the token to, on the primary domain once the site is live, else on the preview domain.
          examples: ["https://acme-marketing.preview.agency.example/wp-login.php?action=pressfleet-login"]
        token:
          type: string
          format: password
          description: The login token. Single-use, and shown only here; never log it.
        user:
          type: string
          description: The WordPress login the token logs in.
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    SiteAdministrator:
      type: object
      required: [login, display_name, email, default]
      properties:
        login:
          type: string
        display_name:
          type: string
        email:
          type: string
        default:
          type: boolean
          description: Whether this is the administrator the platform created with the site.
    SiteAdministratorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteAdministrator"

    SiteList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    JobState:
      type: string
      description: |
        * `queued`: waiting for a worker, for the first time or to retry after an error (`error` says which).
        * `running`: a worker is running the job's steps.
        * `rolling_back`: the job failed for good and is undoing the steps it started.
        * `succeeded`: every step completed. Terminal.
        * `failed`: the job failed and rolled back the resources it created. Terminal.
        * `rollback_failed`: the job failed and rolling back failed too, so
          resources may be left behind; the step errors say where. Terminal.
      enum: [queued, running, rolling_back, succeeded, failed, rollback_failed]

    JobTargetType:
      type: string
      description: "`platform` is for maintenance jobs such as audit log cleanup."
      enum: [site, client_group, platform]

    JobTarget:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/JobTargetType"
        id:
          $ref: "#/components/schemas/ID"

    JobStepState:
      type: string
      description: "`failed` means the step's last attempt failed; it may be retried."
      enum: [pending, running, succeeded, failed, rolled_back, rollback_failed]

    JobLogEntry:
      type: object
      required: [time, level, message]
      properties:
        time:
          $ref: "#/components/schemas/Timestamp"
        level:
          type: string
          enum: [info, warn, error]
        message:
          type: string

    JobEventLogEntry:
      type: object
      description: A line of a job's step log, as `GET /api/v1/jobs/{job_id}/events` sends it.
      required: [time, level, message, step]
      properties:
        time:
          $ref: "#/components/schemas/Timestamp"
        level:
          type: string
          enum: [info, warn, error]
        message:
          type: string
        step:
          type: string
          description: The name of the step that wrote the line, as in the job's `steps`.
          examples: ["create_database"]

    JobStep:
      type: object
      required: [name, state, attempts, started_at, finished_at]
      properties:
        name:
          type: string
          examples: ["create_database"]
        state:
          $ref: "#/components/schemas/JobStepState"
        attempts:
          type: integer
          minimum: 0
        started_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        log:
          type: array
          description: Omitted from job lists.
          items:
            $ref: "#/components/schemas/JobLogEntry"

    Job:
      type: object
      required: [id, type, target, state, attempts, max_attempts, result, steps, created_at, updated_at, started_at, finished_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        type:
          type: string
          description: What the job does. New types are added over time; treat unknown values as opaque.
          examples: ["site.create", "site.update", "site.delete", "site.start", "site.stop", "site.go_live", "site.aliases"]
        target:
          $ref: "#/components/schemas/JobTarget"
        state:
          $ref: "#/components/schemas/JobState"
        error:
          type: string
          description: The most recent error. Present when the job failed, or is waiting to retry after an error.
        attempts:
          type: integer
          minimum: 0
          description: Attempts in the current phase. A job gets `max_attempts` attempts, then its rollback gets as many again.
        max_attempts:
          type: integer
          minimum: 1
        result:
          type: object
          additionalProperties: true
          description: |
            Outputs of the job, such as the IDs of what it created. Contents depend on the job type.
            Secret outputs appear as `{"secret_ref": "..."}` and are retrieved through the endpoint for that secret.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/JobStep"
        created_by:
          description: The user who started the job; null for jobs started by the platform.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    JobAccepted:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/Job"

    JobList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    AuditResult:
      type: string
      description: |
        * `success`: the request was allowed and succeeded.
        * `failure`: the request failed, e.g. validation, a conflict, or wrong login credentials.
        * `denied`: the caller's role or token scope doesn't allow the action.
      enum: [success, failure, denied]

    AuditEvent:
      type: object
      required: [id, occurred_at, actor_user_id, actor_token_id, action, target_type, target_id, result, source_ip]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        actor_user_id:
          description: The user who made the request. Null for a failed login. The user may since have been deleted.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        actor_token_id:
          description: The API token used, or null for a session.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        action:
          type: string
          description: |
            What was attempted: an authorization action such as `site.delete`,
            `user.update`, or `self.tokens.create`, or `self.login`.
          examples: ["site.delete"]
        target_type:
          description: The kind of target, e.g. `site`, `client_group`, `user`, or `api_token`. Null for actions on the platform or on collections.
          oneOf:
            - type: string
            - type: "null"
        target_id:
          description: The target's ID. Null when target_type is null.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        result:
          $ref: "#/components/schemas/AuditResult"
        source_ip:
          type: string
          description: The client address, after trusted proxies.
          examples: ["203.0.113.7"]
        details:
          type: object
          description: |
            Extra facts about some events, never secrets. SFTP sessions
            (`site.sftp.connect` when they start, `site.sftp.disconnect` when
            they end) record `session_id`, `site_slug`, `ssh_key_id`, and
            `key_fingerprint`; their end also records `bytes_received` and
            `bytes_sent` (by the gateway, from and to the client),
            `duration_seconds`, and `reason`. Absent for events without
            details.
          additionalProperties:
            type: string

    AuditEventList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    NextCursor:
      description: Pass as `cursor` to get the next page. Null on the last page.
      oneOf:
        - type: string
        - type: "null"

    UploadPurpose:
      type: string
      description: |
        What the upload is for: a site import's `wp-content` archive or SQL
        dump (`site_import`), or a theme or plugin package to deploy to a
        site (`site_deploy`). It decides the permission the upload needs,
        and only an import or deployment of that kind can take it.
      enum: [site_import, site_deploy]

    UploadStatus:
      type: string
      description: |
        `uploading` takes chunks; `complete` has all its bytes and a
        verified checksum, and waits for its import or deployment;
        `in_use` has been taken by one, and is removed when its job ends.
      enum: [uploading, complete, in_use]

    UploadCreate:
      type: object
      required: [purpose, size_bytes]
      additionalProperties: false
      properties:
        purpose:
          $ref: "#/components/schemas/UploadPurpose"
        client_group_id:
          description: The client group the imported site will join. Required for `site_import`; not allowed for `site_deploy`.
          allOf:
            - $ref: "#/components/schemas/ID"
        site_id:
          description: The site to deploy to. Required for `site_deploy`; not allowed for `site_import`.
          allOf:
            - $ref: "#/components/schemas/ID"
        filename:
          type: string
          description: The file's name, for display. No directories.
          maxLength: 255
          examples: ["wp-content.tar.gz"]
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: The file's exact size, at most `uploads.max_size_mb`.
        sha256:
          type: string
          description: The file's SHA-256 checksum in hex. Optional here; then required when completing the upload.
          pattern: "^[0-9A-Fa-f]{64}$"

    UploadComplete:
      type: object
      additionalProperties: false
      properties:
        sha256:
          type: string
          description: |
            The file's SHA-256 checksum in hex. Required unless it was given
            when the upload was started, and then it must match.
          pattern: "^[0-9A-Fa-f]{64}$"

    Upload:
      type: object
      required: [id, purpose, client_group_id, site_id, filename, size_bytes, received_bytes, sha256, status, job_id,
        max_chunk_bytes, created_at, updated_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        purpose:
          $ref: "#/components/schemas/UploadPurpose"
        client_group_id:
          description: The client group of the import or deployment.
          allOf:
            - $ref: "#/components/schemas/ID"
        site_id:
          description: The site to deploy to; null for imports.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        filename:
          type: string
        size_bytes:
          type: integer
          format: int64
          description: The file's declared size.
        received_bytes:
          type: integer
          format: int64
          description: How many bytes have arrived. The next chunk starts here.
        sha256:
          description: The declared SHA-256 checksum, lowercase hex; null until declared.
          oneOf:
            - type: string
            - type: "null"
        status:
          $ref: "#/components/schemas/UploadStatus"
        job_id:
          description: The job that took the upload; null unless `in_use`.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        max_chunk_bytes:
          type: integer
          format: int64
          description: The largest chunk one request may carry.
          examples: [33554432]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          description: |
            When the upload is removed as abandoned unless another chunk
            arrives or a job takes it; null while a job has it.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    DatabaseSessionAccess:
      type: string
      enum: [read_only, read_write]
      description: |
        `read_only` may read tables and views (`SELECT`, `SHOW VIEW`);
        `read_write` has the site's own privileges on its database and
        needs an Admin.

    DatabaseSessionCreate:
      type: object
      additionalProperties: false
      properties:
        access:
          $ref: "#/components/schemas/DatabaseSessionAccess"
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 28800
          default: 3600
          description: How long the session lasts, from a minute to eight hours.

    DatabaseSession:
      type: object
      required: [id, site_id, user_id, username, database, access, status, created_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        site_id:
          $ref: "#/components/schemas/ID"
        user_id:
          description: The user who opened it; only they can tunnel to the database with it.
          allOf:
            - $ref: "#/components/schemas/ID"
        username:
          type: string
          description: The temporary MariaDB user.
          examples: ["pft_01j9z8y7x6w5v4t3s2r1q0p9s5"]
        database:
          type: string
          description: The site's database, the only one the user can reach.
          examples: ["pf_01j9z8y7x6w5v4t3s2r1q0p9n8"]
        access:
          $ref: "#/components/schemas/DatabaseSessionAccess"
        status:
          type: string
          enum: [active, ended, expired, failed]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    DatabaseSessionOpened:
      type: object
      required: [session, credentials, tunnel]
      properties:
        session:
          $ref: "#/components/schemas/DatabaseSession"
        credentials:
          type: object
          description: The temporary user's login. Shown only once.
          required: [username, password, database]
          properties:
            username:
              type: string
            password:
              type: string
              format: password
              description: The plaintext password. Shown only once.
            database:
              type: string
        tunnel:
          type: object
          required: [ssh_command, local_host, local_port]
          properties:
            ssh_command:
              type: string
              description: |
                Opens the tunnel through the SFTP gateway; run it with a key
                registered on your account, then connect your database tool
                to `local_host`:`local_port`.
              examples: ["ssh -N -L 3307:mariadb:3306 -p 2222 acme-marketing@fleet.agency.example"]
            local_host:
              type: string
              examples: ["127.0.0.1"]
            local_port:
              type: integer
              examples: [3307]

    DatabaseSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseSession"

    # ---- alerts (#75) -----------------------------------------------------

    AlertScope:
      type: string
      description: |
        What a rule watches. `site` rules raise one alert per site: every
        series the expression returns must carry a `site_id` label (series
        without one are ignored), and the rule can be limited to the sites of
        one client group. `platform` rules watch the host and the shared
        services; their series may or may not name a site.
      enum: [platform, site]

    AlertRuleKind:
      type: string
      description: |
        How the expression's result becomes a condition. `threshold`
        compares the value of every series with `operator` and `threshold`.
        `expression` treats every series the expression returns as true; the
        expression itself filters, as in `pressfleet_site_up == 0`.
      enum: [threshold, expression]

    AlertOperator:
      type: string
      description: |
        Compares a series' value with the rule's threshold, as `value <operator> threshold`:
        greater than (`gt`), greater than or equal (`gte`), less than
        (`lt`), less than or equal (`lte`), equal (`eq`), or not equal
        (`ne`).
      enum: [gt, gte, lt, lte, eq, ne]

    AlertSeverity:
      type: string
      enum: [info, warning, critical]

    AlertState:
      type: string
      description: |
        `pending`: the condition holds but hasn't for the rule's duration
        yet; nothing has been sent. `firing`: it has held for the duration
        and still does; one firing event was emitted. `resolved`: it stopped
        holding; one resolved event was emitted.
      enum: [pending, firing, resolved]

    AlertRule:
      type: object
      required:
        - id
        - name
        - description
        - scope
        - client_group_id
        - kind
        - expr
        - operator
        - threshold
        - for_seconds
        - severity
        - enabled
        - labels
        - annotations
        - builtin
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          examples: ["Disk nearly full"]
        description:
          type: string
        scope:
          $ref: "#/components/schemas/AlertScope"
        client_group_id:
          description: The client group a site rule is limited to, or null for every site.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        kind:
          $ref: "#/components/schemas/AlertRuleKind"
        expr:
          type: string
          description: |
            The PromQL expression VictoriaMetrics evaluates. Metrics follow
            the `pressfleet_` naming convention; series of a site carry the
            labels `site_id` and `client_group_id`.
          examples: ["1 - (pressfleet_host_filesystem_avail_bytes / pressfleet_host_filesystem_size_bytes)"]
        operator:
          description: Null for `expression` rules.
          oneOf:
            - $ref: "#/components/schemas/AlertOperator"
            - type: "null"
        threshold:
          description: Null for `expression` rules.
          oneOf:
            - type: number
              format: double
            - type: "null"
          examples: [0.9]
        for_seconds:
          type: integer
          description: How long the condition must hold before the alert fires. 0 fires at once.
          examples: [600]
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        enabled:
          type: boolean
        labels:
          type: object
          description: Labels added to every alert the rule raises.
          additionalProperties:
            type: string
        annotations:
          $ref: "#/components/schemas/AlertAnnotations"
        builtin:
          type: boolean
          description: |
            True for the default rules, which are created when the control
            plane starts. They can be edited and disabled, but not deleted,
            and a restart never reverts an edit.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    AlertAnnotations:
      type: object
      description: |
        Text for the alerts a rule raises. `summary` is one line and
        `description` the details. Both are Go templates (`text/template`)
        rendered for each alert with `.Labels` (the series' labels plus the
        rule's), `.Value` (the series' value), `.Threshold`, and `.Rule` (the
        rule's name), and the functions `humanizePercentage` (a ratio as a
        percentage) and `humanizeDuration` (seconds as days, hours, and
        minutes).
      additionalProperties:
        type: string
        maxLength: 1000
      examples:
        - summary: "{{ .Labels.mountpoint }} is {{ humanizePercentage .Value }} full"

    AlertRuleCreate:
      type: object
      required: [name, scope, kind, expr, severity]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        scope:
          $ref: "#/components/schemas/AlertScope"
        client_group_id:
          description: Limits a `site` rule to the sites of one client group.
          $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/AlertRuleKind"
        expr:
          type: string
          minLength: 1
          maxLength: 4096
        operator:
          $ref: "#/components/schemas/AlertOperator"
        threshold:
          type: number
          format: double
        for_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 0
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        enabled:
          type: boolean
          default: true
        labels:
          type: object
          description: |
            Labels to add to every alert. `site_id`, `client_group_id`,
            `alertname`, and `severity` are set by the platform and can't be
            used.
          additionalProperties:
            type: string
            maxLength: 200
        annotations:
          $ref: "#/components/schemas/AlertAnnotations"

    AlertRuleUpdate:
      type: object
      description: |
        Only the fields present are changed; `labels` and `annotations`
        replace the whole object. The rule's scope, kind, and expression
        must still make sense together.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        scope:
          $ref: "#/components/schemas/AlertScope"
        client_group_id:
          type: string
          maxLength: 64
          description: The client group to limit a `site` rule to. An empty string removes the limit.
        kind:
          $ref: "#/components/schemas/AlertRuleKind"
        expr:
          type: string
          minLength: 1
          maxLength: 4096
        operator:
          $ref: "#/components/schemas/AlertOperator"
        threshold:
          type: number
          format: double
        for_seconds:
          type: integer
          minimum: 0
          maximum: 604800
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        labels:
          type: object
          additionalProperties:
            type: string
            maxLength: 200
        annotations:
          $ref: "#/components/schemas/AlertAnnotations"

    AlertRuleList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertRule"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    Alert:
      type: object
      description: |
        One incident of one rule for one series. A condition that keeps
        holding updates its alert rather than creating another, and each
        alert emits one firing event and, once it stops, one resolved event.
      required:
        - id
        - rule_id
        - rule_name
        - state
        - severity
        - labels
        - site_id
        - client_group_id
        - summary
        - description
        - value
        - started_at
        - fired_at
        - resolved_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ID"
        rule_id:
          $ref: "#/components/schemas/ID"
        rule_name:
          type: string
        state:
          $ref: "#/components/schemas/AlertState"
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        labels:
          type: object
          description: The series' labels plus the rule's.
          additionalProperties:
            type: string
          examples: [{site_id: "01J9ZQ3V6T8K4M2N5P7R9S1X3Y", client_group_id: "01J9ZQ3V6T8K4M2N5P7R9S1X4Z"}]
        site_id:
          description: The site the alert is about, or null.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        client_group_id:
          description: The client group of that site, or null.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        summary:
          type: string
        description:
          type: string
        value:
          type: number
          format: double
          description: The series' latest value.
        started_at:
          description: When the condition first held.
          $ref: "#/components/schemas/Timestamp"
        fired_at:
          description: When the alert started firing. Null while pending.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        resolved_at:
          description: When the alert resolved. Null until then.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        updated_at:
          description: When the alert last changed, whether its value, text, or state.
          $ref: "#/components/schemas/Timestamp"

    AlertList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    # ---- alert channels (#76) ---------------------------------------------

    AlertChannelType:
      type: string
      enum: [email, webhook]

    WebhookFormat:
      type: string
      description: |
        The shape of the request body. `generic` is PressFleet's own payload
        (documented in docs/configuration.md): it has a top-level `text`, so
        a Slack incoming webhook accepts it too. `slack` adds an attachment
        with colored fields. `teams` is a message with an Adaptive Card, as
        Microsoft Teams Workflows webhooks expect.
      enum: [generic, slack, teams]
      default: generic

    AlertChannelEmail:
      type: object
      description: The settings of an email channel.
      required: [to, uses_platform_relay, host, port, encryption, username, from_email, from_name, has_password]
      properties:
        to:
          type: array
          items:
            type: string
          description: The recipients.
        uses_platform_relay:
          type: boolean
          description: True when the channel has no `host` and sends through the platform's SMTP relay.
        host:
          type: string
          description: The channel's own SMTP server, or an empty string.
        port:
          type: integer
          description: The server's port; 0 means the standard port for `encryption`.
        encryption:
          type: string
          description: |
            `starttls`, `tls` (implicit TLS), or `none`. Empty with the
            platform relay.
        username:
          type: string
        has_password:
          type: boolean
          description: Whether an SMTP password is stored. It is never returned.
        from_email:
          type: string
          description: The sender; empty means the platform relay's.
        from_name:
          type: string

    AlertChannelWebhook:
      type: object
      description: The settings of a webhook channel.
      required: [format, url, has_signing_secret]
      properties:
        format:
          $ref: "#/components/schemas/WebhookFormat"
        url:
          type: string
          description: |
            The webhook URL reduced to its scheme and host, such as
            `https://hooks.slack.com/…`. The rest is a credential and is
            never returned.
          examples: ["https://hooks.slack.com/…"]
        has_signing_secret:
          type: boolean
          description: Whether requests are signed (HMAC-SHA256, generic format).

    AlertChannel:
      type: object
      required:
        - id
        - name
        - type
        - enabled
        - min_severity
        - rule_id
        - client_group_id
        - email
        - webhook
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          examples: ["Ops on-call email"]
        type:
          $ref: "#/components/schemas/AlertChannelType"
        enabled:
          type: boolean
        min_severity:
          description: The lowest severity the channel receives.
          $ref: "#/components/schemas/AlertSeverity"
        rule_id:
          description: If set, the channel only receives events of this rule.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        client_group_id:
          description: If set, the channel only receives events of alerts of this client group.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        email:
          description: Present for `email` channels.
          oneOf:
            - $ref: "#/components/schemas/AlertChannelEmail"
            - type: "null"
        webhook:
          description: Present for `webhook` channels.
          oneOf:
            - $ref: "#/components/schemas/AlertChannelWebhook"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    AlertChannelEmailCreate:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 254
          description: Recipients, as plain addresses (`ops@example.com`).
        host:
          type: string
          maxLength: 253
          description: |
            An SMTP server of the channel's own. Leave it out to send
            through the platform's SMTP relay (the `smtp.*` settings), which
            is the usual choice.
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: 0 or absent means the standard port for `encryption`.
        encryption:
          type: string
          enum: [starttls, tls, none]
          description: Default `starttls`. `tls` is implicit TLS ("SMTPS").
        username:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 512
          description: Stored encrypted and never returned. Needs `username`.
        from_email:
          type: string
          maxLength: 254
          description: The sender. Required with `host`; otherwise defaults to the platform relay's.
        from_name:
          type: string
          maxLength: 100

    AlertChannelEmailUpdate:
      type: object
      additionalProperties: false
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 254
        host:
          type: string
          maxLength: 253
          description: An empty string switches to the platform's SMTP relay.
        port:
          type: integer
          minimum: 0
          maximum: 65535
        encryption:
          type: string
          enum: [starttls, tls, none, ""]
        username:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 512
          description: Replaces the stored password. An empty string removes it.
        from_email:
          type: string
          maxLength: 254
        from_name:
          type: string
          maxLength: 100

    AlertChannelWebhookCreate:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: password
          writeOnly: true
          maxLength: 2048
          description: |
            An `https` (or `http`) URL. It is a credential: it is stored
            encrypted and never returned. Loopback, link-local, and cloud
            metadata addresses are refused unless the control plane allows
            them (`alerts.webhook_allow_local_targets`). Redirects aren't
            followed.
        format:
          $ref: "#/components/schemas/WebhookFormat"
        signing_secret:
          type: string
          format: password
          writeOnly: true
          maxLength: 512
          description: |
            If set, requests carry `X-PressFleet-Signature`, an HMAC-SHA256
            of the timestamp, a dot, and the body, so the receiver can tell
            the request is ours.

    AlertChannelWebhookUpdate:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: password
          writeOnly: true
          maxLength: 2048
          description: Replaces the stored URL.
        format:
          $ref: "#/components/schemas/WebhookFormat"
        signing_secret:
          type: string
          format: password
          writeOnly: true
          maxLength: 512
          description: Replaces the stored signing secret. An empty string removes it.

    AlertChannelCreate:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: "#/components/schemas/AlertChannelType"
        enabled:
          type: boolean
          default: true
        min_severity:
          description: The lowest severity the channel receives. Default `info`, which is everything.
          $ref: "#/components/schemas/AlertSeverity"
        rule_id:
          description: Only deliver events of this rule.
          $ref: "#/components/schemas/ID"
        client_group_id:
          description: Only deliver events of alerts of this client group (platform alerts have none, so they aren't delivered).
          $ref: "#/components/schemas/ID"
        email:
          description: Required for `email` channels.
          $ref: "#/components/schemas/AlertChannelEmailCreate"
        webhook:
          description: Required for `webhook` channels.
          $ref: "#/components/schemas/AlertChannelWebhookCreate"

    AlertChannelUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        min_severity:
          $ref: "#/components/schemas/AlertSeverity"
        rule_id:
          type: string
          maxLength: 64
          description: Only deliver events of this rule. An empty string removes the limit.
        client_group_id:
          type: string
          maxLength: 64
          description: Only deliver events of this client group. An empty string removes the limit.
        email:
          $ref: "#/components/schemas/AlertChannelEmailUpdate"
        webhook:
          $ref: "#/components/schemas/AlertChannelWebhookUpdate"

    AlertChannelList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertChannel"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    AlertChannelTestResult:
      type: object
      required: [success, error, duration_ms]
      properties:
        success:
          type: boolean
          description: Whether the channel accepted the test notification.
        error:
          description: Why it didn't. Never contains credentials.
          oneOf:
            - type: string
            - type: "null"
        duration_ms:
          type: integer
          format: int64

    AlertEventType:
      type: string
      description: What an alert event is. Each alert emits one `firing` event and, once it stops, one `resolved` event.
      enum: [firing, resolved]

    AlertDeliveryState:
      type: string
      description: |
        `pending`: not delivered yet, tried again at `next_attempt_at`.
        `delivered`: the channel accepted it. `failed`: out of attempts, or
        it can't succeed.
      enum: [pending, delivered, failed]

    AlertDelivery:
      type: object
      description: One alert event bound for one channel.
      required:
        - id
        - alert_id
        - event
        - channel_id
        - channel_name
        - state
        - attempts
        - last_error
        - next_attempt_at
        - delivered_at
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ID"
        alert_id:
          $ref: "#/components/schemas/ID"
        event:
          $ref: "#/components/schemas/AlertEventType"
        channel_id:
          $ref: "#/components/schemas/ID"
        channel_name:
          type: string
        state:
          $ref: "#/components/schemas/AlertDeliveryState"
        attempts:
          type: integer
          description: How many times delivery was tried.
        last_error:
          description: What went wrong with the latest attempt, or null.
          oneOf:
            - type: string
            - type: "null"
        next_attempt_at:
          description: When a `pending` delivery is tried next; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        delivered_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at:
          description: When the event was accepted for this channel.
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    AlertDeliveryList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertDelivery"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
