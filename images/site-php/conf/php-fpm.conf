; PHP-FPM global configuration for PressFleet site-php.
; Values of the form ${VAR} are read from the environment at startup.

[global]
; FPM runs in the foreground as PID 1's child and logs to the container's stderr.
error_log = /proc/self/fd/2
log_level = notice
log_limit = 8192
daemonize = no
; How long workers get to finish their requests when FPM reloads (SIGUSR2,
; which code deployments send to empty the opcode cache) or stops. Without
; it, a reload cuts off requests in flight, which nginx answers with 502.
process_control_timeout = 10s

include = /usr/local/etc/php-fpm.d/*.conf
