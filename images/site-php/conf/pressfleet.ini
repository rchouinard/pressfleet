; PressFleet overrides on top of php.ini-production. Applies to FPM and CLI
; (WP-CLI). Values of the form ${VAR} are read from the environment.

expose_php = Off
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On

memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_time = ${PHP_MAX_EXECUTION_TIME}
max_input_vars = ${PHP_MAX_INPUT_VARS}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}

; The root filesystem may be read-only; /tmp is expected to be a tmpfs.
upload_tmp_dir = /tmp
sys_temp_dir = /tmp
session.save_path = /tmp

; Not needed by WordPress and a common SSRF/LFI vector.
allow_url_include = Off

; OPcache. Core and mu-plugins are read-only for the life of the container and
; WordPress calls opcache_invalidate() for files it writes during plugin/theme
; updates, so timestamps are only rechecked every PHP_OPCACHE_REVALIDATE_FREQ
; seconds. JIT is off: it does not help WordPress and costs memory.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY_CONSUMPTION}
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = ${PHP_OPCACHE_REVALIDATE_FREQ}
opcache.save_comments = 1
opcache.jit = disable
opcache.jit_buffer_size = 0
