; The single PHP-FPM pool of a PressFleet site. The runtime contract is in
; images/README.md; the tunables are environment variables (${VAR}).
;
; There are deliberately no user/group directives: the container is started as
; the site's UID (Compose `user:`), and FPM's master and workers run as it.

[site]
; nginx runs in a separate container, so FPM listens on TCP rather than a socket.
listen = 9000

; Idle sites hold no workers (design doc §4.1 Capacity Target). The control
; plane derives max_children from the site's memory limit.
pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = ${PHP_FPM_PROCESS_IDLE_TIMEOUT}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}

; Status and ping for metrics (M4) and health checks. They are FastCGI paths,
; reachable only through nginx's internal status port or cgi-fcgi in-container.
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

request_terminate_timeout = ${PHP_FPM_REQUEST_TERMINATE_TIMEOUT}
request_slowlog_timeout = ${PHP_FPM_SLOWLOG_TIMEOUT}
slowlog = /proc/self/fd/2

; nginx logs every request, so the FPM access log is off. Worker output
; (PHP errors) is forwarded undecorated to the container's stderr.
catch_workers_output = yes
decorate_workers_output = no

; Workers see no container environment variables; wp-config.php carries all
; site configuration.
clear_env = yes

security.limit_extensions = .php

; Tenant isolation (design doc §6): PHP served over FPM can only touch core,
; the platform mu-plugins, the FastCGI cache (for Nginx Helper purges), and
; /tmp (uploads are staged there). wp-content is inside the core path.
php_admin_value[open_basedir] = /var/www/wordpress:/opt/pressfleet/mu-plugins:/var/cache/pressfleet/fastcgi:/tmp
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
