# FastCGI page cache status (issue #40): HIT, MISS, BYPASS, EXPIRED, STALE,
# UPDATING, or REVALIDATED on PHP responses. nginx omits a header whose value
# is empty, so static files and sites with caching off get none.
#
# This is at server level on purpose: a location with any add_header of its
# own stops inheriting the server's (X-Content-Type-Options and the like).
add_header X-Cache $upstream_cache_status always;
