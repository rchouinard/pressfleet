# WordPress hardening rules, included at the top of the site server block.
# Regex locations match in order, so these must come before `location ~ \.php$`.

# Hidden files and directories (.git, .env, .htaccess, ...), except ACME and
# other well-known URIs.
location ~ /\.(?!well-known/) {
    return 403;
}

# Never execute PHP from uploads or other user-writable asset directories.
location ~* ^/wp-content/(?:uploads|files|cache|upgrade)/.*\.(?:php[0-9]?|phtml|phar|pht|phps)(?:$|/) {
    return 403;
}

# Core internals that are only ever included, never requested directly.
location ~* ^/wp-admin/includes/ {
    return 403;
}
location ~* ^/wp-includes/[^/]+\.php$ {
    return 403;
}
location ~* ^/wp-includes/js/tinymce/langs/.+\.php$ {
    return 403;
}
location ~* ^/wp-includes/theme-compat/ {
    return 403;
}

# Config, version disclosure, logs, dumps, and editor/backup leftovers.
location ~* ^/(?:wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt)$ {
    return 404;
}
location ~* \.(?:log|sql|sql\.gz|bak|old|orig|save|swp|dist|ini|sh)$ {
    return 404;
}
