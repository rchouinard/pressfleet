# FastCGI page cache directives for the PHP location (issue #40), included
# through /tmp/nginx/fastcgi-cache-php.conf when NGINX_FASTCGI_CACHE is on.
# The zone and the bypass maps are in ../http.d/fastcgi-cache.conf.

fastcgi_cache pressfleet;

# Nginx Helper (#41) purges a page by deleting
# <cache path>/<last hex digit>/<two digits before it>/md5(key), computing
# the key as scheme . "GET" . host . path from the page's URL. That fixes
# levels=1:2 (see the zone) and this key. The scheme must be the one the
# visitor used, as in WordPress's own URLs: TLS ends at Traefik, so $scheme is
# always "http" here, and the key uses the scheme from a trusted proxy's
# X-Forwarded-Proto instead. Query strings are never cached, so $request_uri
# is just the path.
fastcgi_cache_key "$pressfleet_scheme$pressfleet_cache_method$host$request_uri";

fastcgi_cache_bypass $pressfleet_cache_skip_method $pressfleet_cache_skip_args $pressfleet_cache_skip_cookie
                     $pressfleet_cache_skip_auth $pressfleet_cache_skip_uri;
fastcgi_no_cache     $pressfleet_cache_skip_method $pressfleet_cache_skip_args $pressfleet_cache_skip_cookie
                     $pressfleet_cache_skip_auth $pressfleet_cache_skip_uri;

# Responses with Set-Cookie, or with Cache-Control no-cache/no-store/private
# or a past Expires, are never cached: nginx honors those headers by default,
# and they are deliberately not in fastcgi_ignore_headers. WordPress sends
# no-cache headers on 404s, logged-in pages, and previews, and WooCommerce on
# its cart, checkout, and account pages, whatever their slugs.

# One request refills a missing or expired page while the others wait (lock)
# or get the stale copy (updating). The stale copy also covers PHP errors and
# timeouts, so a short php outage doesn't take cached pages down.
fastcgi_cache_lock on;
fastcgi_cache_lock_timeout 5s;
fastcgi_cache_use_stale error timeout updating http_500 http_503;
fastcgi_cache_background_update on;
