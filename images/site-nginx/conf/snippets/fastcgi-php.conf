# FastCGI parameters for WordPress PHP requests. The php container has core at
# the same path as this image, so $document_root is valid on both sides.

fastcgi_split_path_info ^(.+?\.php)(/.*)$;
# The script must exist here too (core from this image, wp-content from the
# shared volume); this also blocks requests for wp-config.php, which only the
# php container has.
try_files $fastcgi_script_name =404;

set $pressfleet_path_info $fastcgi_path_info;
include /etc/nginx/fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param PATH_INFO       $pressfleet_path_info;

# Scheme as seen by the client, from X-Forwarded-Proto of a trusted proxy.
# Setting HTTPS makes WordPress's is_ssl() work without wp-config.php code.
# Naming HTTP_X_FORWARDED_PROTO here also stops nginx from passing the raw
# (possibly spoofed) client header through.
fastcgi_param HTTPS                  $pressfleet_https if_not_empty;
fastcgi_param REQUEST_SCHEME         $pressfleet_scheme;
fastcgi_param SERVER_PORT            $pressfleet_port;
fastcgi_param HTTP_X_FORWARDED_PROTO $pressfleet_scheme;

# httpoxy (CVE-2016-5385).
fastcgi_param HTTP_PROXY "";

fastcgi_index index.php;
fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;
