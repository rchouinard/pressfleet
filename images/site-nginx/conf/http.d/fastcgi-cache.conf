# FastCGI page cache: http context (issue #40, design doc §5.6).
#
# The cache zone itself is in /tmp/nginx/fastcgi-cache-http.conf, which the
# entrypoint generates from NGINX_FASTCGI_CACHE (empty when caching is off).
# The maps below are only evaluated when a request uses them, so they cost
# nothing when caching is off.
include /tmp/nginx/fastcgi-cache-http.conf;

# Every $pressfleet_cache_skip_* variable is "0" to allow caching and "1" to
# skip it. They are passed to both fastcgi_cache_bypass (don't answer from the
# cache) and fastcgi_no_cache (don't store the response).

# Only GET and HEAD are cacheable; POST and everything else goes to PHP.
map $request_method $pressfleet_cache_skip_method {
    GET     0;
    HEAD    0;
    default 1;
}

# Any query string, as in Nginx Helper's reference configuration: search,
# previews (?preview=true), ?add-to-cart=, ?wc-ajax=, ?rest_route=, nonces.
# It also keeps every cache key equal to a plain path, which is what Nginx
# Helper purges.
map $args $pressfleet_cache_skip_args {
    ""      0;
    default 1;
}

# Visitors who get per-user pages: logged in (the auth and logged_in cookies,
# named after the 32-hex-digit COOKIEHASH; wordpress_test_cookie, which
# wp-login.php sets for everyone, does not match), recent commenters,
# visitors who unlocked a password-protected post, anything that sets
# wordpress_no_cache, and WooCommerce shoppers with a session or a cart.
map $http_cookie $pressfleet_cache_skip_cookie {
    default 0;
    "~*(?:^|;\s*)(?:wordpress_logged_in_|wordpress_sec_|wordpress_[0-9a-f]{32}=|wp-postpass_|comment_author_|wordpress_no_cache|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_)" 1;
}

# Requests with credentials (application passwords, HTTP basic auth).
map $http_authorization $pressfleet_cache_skip_auth {
    ""      0;
    default 1;
}

# Dynamic and private URIs, matched on the original request URI:
# - wp-admin, top-level wp-*.php (wp-login, wp-signup, wp-activate,
#   wp-comments-post, wp-trackback, wp-cron), xmlrpc.php, and index.php
#   requested by name;
# - the REST API: Nginx Helper doesn't purge it, so cached responses would go
#   stale after edits;
# - feeds and sitemaps, which Nginx Helper purges only partly (its reference
#   configuration skips them too);
# - WooCommerce's cart, checkout, and account pages (default slugs; WooCommerce
#   also sends no-cache headers on them, which nginx honors) and its legacy API.
map $request_uri $pressfleet_cache_skip_uri {
    default 0;
    "~*^/wp-admin(?:/|$)"                        1;
    "~*^/(?:wp-[^/]*|xmlrpc|index)\.php"         1;
    "~*^/wp-json(?:/|$)"                         1;
    "~*/feed(?:/|$)"                             1;
    "~*sitemap[^/]*\.xml"                        1;
    "~*^/(?:cart|checkout|my-account)(?:/|$)"    1;
    "~*^/wc-api/"                                1;
}

# The request method in the cache key. nginx sends a cacheable HEAD request to
# PHP as GET (fastcgi_cache_convert_head, on by default) and stores the GET
# response, so HEAD and GET share one key: the one Nginx Helper computes.
map $request_method $pressfleet_cache_method {
    HEAD    GET;
    default $request_method;
}
