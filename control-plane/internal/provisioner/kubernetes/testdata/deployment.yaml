# PressFleet site 01hzy3k5q7m9c2v4b6n8r0t1wx (design doc §4.8).
#
# Generated by the control plane from the site's record. Do not edit: changes
# are overwritten the next time the site is rendered.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: "pf-01hzy3k5q7m9c2v4b6n8r0t1wx"
  labels:
    app.kubernetes.io/managed-by: pressfleet
    pressfleet.io/rendered: "true"
    pressfleet.io/site-id: "01hzy3k5q7m9c2v4b6n8r0t1wx"
    pressfleet.io/client-group-id: "01hzy3k0000000000000000000"
spec:
  # One pod at a time: wp-content is ReadWriteOnce, and two PHP versions
  # must never write it together.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      pressfleet.io/component: site
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: pressfleet
        pressfleet.io/site-id: "01hzy3k5q7m9c2v4b6n8r0t1wx"
        pressfleet.io/client-group-id: "01hzy3k0000000000000000000"
        pressfleet.io/component: site
      annotations:
        # wp-config.php is mounted as a single file (subPath), which a
        # running container never sees change: a new checksum rolls the pod.
        pressfleet.io/wp-config-checksum: "714f8aa22ce79cd6b0e8e9cb22c80aa7dabe99be45fa691498ae0aab26b4bd63"
    spec:
      # Both containers run as the site's UID and GID (§6), which must be
      # the same in both: nginx reads what PHP writes to wp-content, and PHP
      # deletes nginx's FastCGI cache files (§5.6). fsGroup gives the group
      # the volumes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 20000
        runAsGroup: 20000
        fsGroup: 20000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: "ghcr"
      containers:
        - name: php
          image: "ghcr.io/rchouinard/pressfleet/site-php:php8.4-wp6.9.1"
          imagePullPolicy: IfNotPresent
          env:
            # Derived from php's memory limit (provisioner.SplitResources).
            - name: PHP_MEMORY_LIMIT
              value: "256M"
            - name: PHP_FPM_MAX_CHILDREN
              value: "6"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "75m"
              memory: "112Mi"
            limits:
              cpu: "750m"
              memory: "448Mi"
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/wordpress/wp-content
            - name: cache
              mountPath: /var/cache/pressfleet/fastcgi
            - name: tmp-php
              mountPath: /tmp
            - name: wp-config
              mountPath: /var/www/wordpress/wp-config.php
              subPath: wp-config.php
              readOnly: true
          # The first start seeds an empty wp-content, which may take a
          # while on slow storage.
          startupProbe:
            # The images' own health check: nginx's /healthz or PHP-FPM's
            # ping, from inside the container (images/README.md).
            exec:
              command:
                - /usr/local/bin/pressfleet-healthcheck
            timeoutSeconds: 5
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            # The images' own health check: nginx's /healthz or PHP-FPM's
            # ping, from inside the container (images/README.md).
            exec:
              command:
                - /usr/local/bin/pressfleet-healthcheck
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
        - name: nginx
          image: "ghcr.io/rchouinard/pressfleet/site-nginx:wp6.9.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # php is in the same pod, so the same network namespace.
            - name: PHP_FPM_HOST
              value: "127.0.0.1"
            # The pod network's ranges, which the site's NetworkPolicy
            # narrows to Traefik's pods (images/README.md).
            - name: NGINX_TRUSTED_PROXIES
              value: "127.0.0.0/8 10.244.0.0/16 fd00:10:244::/56"
            # FastCGI page cache (SiteConfig.EnableCache).
            - name: NGINX_FASTCGI_CACHE
              value: "on"
            # WordPress security set (§6.1), install-wide.
            - name: NGINX_LOGIN_RATE_LIMIT
              value: "on"
            - name: NGINX_LOGIN_RATE
              value: "10r/m"
            - name: NGINX_LOGIN_BURST
              value: "10"
            - name: NGINX_SECURITY_HEADERS
              value: "on"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "250m"
              memory: "64Mi"
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/wordpress/wp-content
              readOnly: true
            - name: cache
              mountPath: /var/cache/pressfleet/fastcgi
            - name: tmp-nginx
              mountPath: /tmp
          startupProbe:
            # The images' own health check: nginx's /healthz or PHP-FPM's
            # ping, from inside the container (images/README.md).
            exec:
              command:
                - /usr/local/bin/pressfleet-healthcheck
            timeoutSeconds: 5
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            # The images' own health check: nginx's /healthz or PHP-FPM's
            # ping, from inside the container (images/README.md).
            exec:
              command:
                - /usr/local/bin/pressfleet-healthcheck
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            # The images' own health check: nginx's /healthz or PHP-FPM's
            # ping, from inside the container (images/README.md).
            exec:
              command:
                - /usr/local/bin/pressfleet-healthcheck
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content
        # FastCGI page cache, shared so Nginx Helper in php can purge it
        # (§5.6). Rebuilt after a restart, like a recreated Compose site.
        - name: cache
          emptyDir: {}
        - name: tmp-php
          emptyDir: {}
        - name: tmp-nginx
          emptyDir: {}
        - name: wp-config
          secret:
            secretName: wp-config
            # 0440 in decimal: readable by the site's group (fsGroup) and
            # nobody else.
            defaultMode: 288
