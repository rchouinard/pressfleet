# PressFleet site 01hzy3k5q7m9c2v4b6n8r0t1wx (design doc §4.8).
#
# Generated by the control plane from the site's record. Do not edit: changes
# are overwritten the next time the site is rendered.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: "pf-01hzy3k5q7m9c2v4b6n8r0t1wx"
  labels:
    app.kubernetes.io/managed-by: pressfleet
    pressfleet.io/rendered: "true"
    pressfleet.io/site-id: "01hzy3k5q7m9c2v4b6n8r0t1wx"
    pressfleet.io/client-group-id: "01hzy3k0000000000000000000"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-ingress
  namespace: "pf-01hzy3k5q7m9c2v4b6n8r0t1wx"
  labels:
    app.kubernetes.io/managed-by: pressfleet
    pressfleet.io/rendered: "true"
    pressfleet.io/site-id: "01hzy3k5q7m9c2v4b6n8r0t1wx"
    pressfleet.io/client-group-id: "01hzy3k0000000000000000000"
spec:
  podSelector:
    matchLabels:
      pressfleet.io/component: site
  policyTypes:
    - Ingress
  ingress:
    # Traefik's pods in the platform namespace, to nginx's site port. nginx
    # trusts forwarded headers from the whole pod network
    # (NGINX_TRUSTED_PROXIES); this is what narrows that to Traefik.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "pressfleet"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pressfleet
              app.kubernetes.io/component: traefik
      ports:
        - protocol: TCP
          port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-egress
  namespace: "pf-01hzy3k5q7m9c2v4b6n8r0t1wx"
  labels:
    app.kubernetes.io/managed-by: pressfleet
    pressfleet.io/rendered: "true"
    pressfleet.io/site-id: "01hzy3k5q7m9c2v4b6n8r0t1wx"
    pressfleet.io/client-group-id: "01hzy3k0000000000000000000"
spec:
  # The site's pod and its tasks (backups, restores, imports), which reach
  # what the site reaches: the platform services and S3 (§4.4).
  podSelector:
    matchExpressions:
      - key: pressfleet.io/component
        operator: In
        values:
          - site
          - task
  policyTypes:
    - Egress
  egress:
    # DNS, wherever the cluster's resolver is (kube-system, a node-local
    # cache).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # MariaDB and Valkey in the platform namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "pressfleet"
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
    # The SMTP relay's port, at any address: the relay is named by host
    # name, which a NetworkPolicy can't select, and may be in a private
    # range.
    - ports:
        - protocol: TCP
          port: 587
