# Maintenance routes of PressFleet site 01hzy3k5q7m9c2v4b6n8r0t1wx (design doc §5.4).
#
# Generated by the control plane. While the site is in maintenance mode they
# are applied to the platform namespace. Do not edit: changes are overwritten
# the next time the site is rendered.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "pf-01hzy3k5q7m9c2v4b6n8r0t1wx-preview-maintenance"
  namespace: "pressfleet"
  labels:
    app.kubernetes.io/managed-by: pressfleet
    pressfleet.io/maintenance-for: "01hzy3k5q7m9c2v4b6n8r0t1wx"
spec:
  entryPoints:
    - "websecure"
  routes:
    - kind: Rule
      match: "Host(`blog.preview.example.com`)"
      priority: 100000
      services:
        - name: "maintenance"
          port: 8080
  tls:
    certResolver: "acme-preview"
