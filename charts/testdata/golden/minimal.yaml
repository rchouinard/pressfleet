apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: control-plane
rules:
  # Repository tasks (pods), their Secret volumes, and the NetworkPolicies
  # that deny them the network or allow S3 only. The control plane also
  # reads the image pull Secrets here to copy them into site namespaces.
  - apiGroups: [""]
    resources: [pods]
    verbs: ["get","list","watch","create","delete","deletecollection"]
  - apiGroups: [""]
    resources: [secrets]
    verbs: ["get","list","watch","create","update","patch","delete","deletecollection"]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: ["get","list","watch","create","update","patch","delete","deletecollection"]
  # Repository task streams. No exec: nothing here runs commands in the
  # platform's pods (Traefik's metrics are read over the network, #322).
  - apiGroups: [""]
