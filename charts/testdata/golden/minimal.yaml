        # ACL rule ("#<hex>"), so the configuration holds no usable
        # credential, as on Compose.
        - name: config
          image: "docker.io/valkey/valkey:9.1.2@sha256:ac9c858b86dc81f3482d53a9d854547379a5f41e012500f839ab257c399063e0"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              hash=$(printf %s "$(cat /run/secrets/redis_admin_password)" | sha256sum | cut -d' ' -f1)
              sed "s/@REDIS_ADMIN_PASSWORD_HASH@/$hash/" /etc/valkey-template/valkey.conf > /etc/valkey/valkey.conf
          volumeMounts:
            - name: template
              mountPath: /etc/valkey-template
              readOnly: true
            - name: config
              mountPath: /etc/valkey
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 16Mi
      containers:
        - name: redis
          image: "docker.io/valkey/valkey:9.1.2@sha256:ac9c858b86dc81f3482d53a9d854547379a5f41e012500f839ab257c399063e0"
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: 320Mi
            limits:
              memory: 320Mi
          livenessProbe:
            exec:
              command: ["valkey-cli", "--no-auth-warning", "--user", "healthcheck", "--pass", "nopass", "-e", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["valkey-cli", "--no-auth-warning", "--user", "healthcheck", "--pass", "nopass", "-e", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: template
          configMap:
            name: redis
        # The rendered configuration, in memory.
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Valkey's working directory: nothing is persisted (valkey.conf).
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: secrets
          secret:
            secretName: "pressfleet-platform"
            defaultMode: 0440
            items:
              - key: "redis-admin-password"
                path: redis_admin_password

