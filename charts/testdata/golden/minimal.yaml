# Source: pressfleet/templates/admission-policy.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "control-plane.pressfleet.pressfleet.io"
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: control-plane
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [namespaces]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [rolebindings]
  matchConditions:
    - name: control-plane
      expression: "request.userInfo.username == 'system:serviceaccount:pressfleet:control-plane'"
  variables:
    - name: isNamespace
      expression: "request.resource.resource == 'namespaces'"
    # The namespace concerned: the one written, or the RoleBinding's.
    - name: target
      expression: "variables.isNamespace ? request.name : request.namespace"
  validations:
    - expression: >-
        !variables.isNamespace || request.operation == 'DELETE' ||
        ((has(object.metadata.labels) && (
        (variables.target.startsWith('pf-') &&
        'app.kubernetes.io/managed-by' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/managed-by'] == 'pressfleet') ||
        (variables.target.startsWith('pressfleet-doctor-') &&
        'pressfleet.io/doctor-probe' in object.metadata.labels && object.metadata.labels['pressfleet.io/doctor-probe'] == 'true')) &&
        'pressfleet.io/platform-namespace' in object.metadata.labels && object.metadata.labels['pressfleet.io/platform-namespace'] == 'pressfleet') &&
        'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
        object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted' &&
        (!('pod-security.kubernetes.io/enforce-version' in object.metadata.labels) ||
        object.metadata.labels['pod-security.kubernetes.io/enforce-version'] == 'latest'))
      messageExpression: >-
        'the PressFleet control plane may only write site namespaces (pf-..., labeled app.kubernetes.io/managed-by=pressfleet) and doctor probe namespaces (pressfleet-doctor-..., labeled pressfleet.io/doctor-probe=true), labeled pressfleet.io/platform-namespace=pressfleet, that enforce Pod Security restricted at the latest version, not ' + request.name
    - expression: >-
        !variables.isNamespace || request.operation == 'CREATE' ||
        (has(oldObject.metadata.labels) && (
        (variables.target.startsWith('pf-') &&
        'app.kubernetes.io/managed-by' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'pressfleet') ||
        (variables.target.startsWith('pressfleet-doctor-') &&
        'pressfleet.io/doctor-probe' in oldObject.metadata.labels && oldObject.metadata.labels['pressfleet.io/doctor-probe'] == 'true')) &&
        (!('pressfleet.io/platform-namespace' in oldObject.metadata.labels) || oldObject.metadata.labels['pressfleet.io/platform-namespace'] == 'pressfleet'))
      messageExpression: >-
        'the PressFleet control plane may only change or delete namespaces it created, not ' + request.name
    - expression: >-
        variables.isNamespace ||
        (namespaceObject != null &&
        (has(namespaceObject.metadata.labels) && (
        (variables.target.startsWith('pf-') &&
        'app.kubernetes.io/managed-by' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['app.kubernetes.io/managed-by'] == 'pressfleet') ||
        (variables.target.startsWith('pressfleet-doctor-') &&
        'pressfleet.io/doctor-probe' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['pressfleet.io/doctor-probe'] == 'true')) &&
        'pressfleet.io/platform-namespace' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['pressfleet.io/platform-namespace'] == 'pressfleet'))
      messageExpression: >-
        'the PressFleet control plane may only write RoleBindings in its own namespaces, not in ' + request.namespace
    - expression: >-
        variables.isNamespace || request.operation == 'DELETE' ||
        (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'pressfleet:pressfleet:site' &&
        has(object.subjects) && size(object.subjects) == 1 &&
        object.subjects[0].kind == 'ServiceAccount' &&
        object.subjects[0].name == 'control-plane' &&
        has(object.subjects[0].namespace) && object.subjects[0].namespace == 'pressfleet')
      message: "the PressFleet control plane may only bind the ClusterRole pressfleet:pressfleet:site, to its own ServiceAccount"

