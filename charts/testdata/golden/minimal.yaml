---
# Source: pressfleet/templates/mariadb-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: mariadb
data:
  pressfleet.cnf: |
    # Generated by `make generate` from templates/platform/mariadb.cnf.tmpl. Do not edit.
    # PressFleet MariaDB tuning. Generated by pressfleet; do not edit.
    #
    # Sized for a 768 MiB container limit shared by ~50 WordPress
    # sites (design doc §4.1 Capacity Target). Rough worst case: buffer pool
    # (384 MiB) + log buffer, Aria and key caches (~40 MiB) +
    # max_connections x per-connection buffers (~1 MiB each) stays under the limit.
    [mariadb]
    skip-name-resolve
    performance_schema = OFF
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci

    # InnoDB holds all WordPress data; give it about half the memory.
    innodb_buffer_pool_size = 384M
    innodb_log_file_size = 96M
    innodb_log_buffer_size = 16M
    innodb_flush_log_at_trx_commit = 1

    # Aria (internal temp tables) and MyISAM caches default to far more than
    # a shared host can spare.
    aria_pagecache_buffer_size = 16M
    key_buffer_size = 8M

    # PHP-FPM runs pm = ondemand, so most sites hold few or no connections.
    # Idle connections are dropped quickly to keep the count down.
    max_connections = 150
    thread_cache_size = 32
    wait_timeout = 300
    interactive_timeout = 300

    # Keep per-connection buffers small; they multiply by max_connections.
    sort_buffer_size = 256K
    join_buffer_size = 256K
    read_buffer_size = 128K
    read_rnd_buffer_size = 256K
    tmp_table_size = 16M
    max_heap_table_size = 16M
    max_allowed_packet = 64M

    # ~50 sites x a few dozen tables each.
    table_open_cache = 4000
    table_definition_cache = 3000


---
# Source: pressfleet/templates/redis-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: redis
data:
  valkey.conf: |
    # Generated by `make generate` from templates/platform/valkey.conf.tmpl. Do not edit.
    # PressFleet object cache (Valkey) configuration. Generated by pressfleet; do
    # not edit.
    #
    # One server is shared by every site (design doc §3, §6). The control plane
    # gives each site its own ACL user, logical database, and key prefix at run
    # time; this file only defines the server and the platform's own users.

    # Only the platform network and site networks reach the server, and every
    # client must authenticate (the default user is off), so protected mode, which
    # refuses remote clients when the default user has no password, is not needed.
    bind * -::*
    protected-mode no
    port 6379

    # Each site gets one logical database (restricted with a db=<n> ACL rule), so
    # one site's SCAN, DBSIZE, and FLUSHDB never see another's keys. Database 0 is
    # left unused. Empty databases cost almost nothing.
    databases 1024

    # The cache is sized by the §4.1 capacity budget. WordPress stores most
    # object cache entries without a TTL, so volatile-lru would find nothing to
    # evict and writes would fail once memory is full; allkeys-lru evicts the
    # least recently used entries of any site instead.
    maxmemory 256mb
    maxmemory-policy allkeys-lru

    # No persistence: it is a cache, and WordPress rebuilds it on demand. RDB
    # snapshots would fork the server (doubling memory under write load) and
    # append-only files would add disk I/O for data nobody needs after a restart.
    save ""
    appendonly no

    # Free memory in a background thread, so a site flushing its database or a
    # burst of evictions doesn't stall every other site's requests.
    lazyfree-lazy-user-flush yes
    lazyfree-lazy-eviction yes

    # Users. Passwords are given as SHA-256 hashes ("#<hex>"), so this file never
    # holds a usable credential.
    #
    # The default user is disabled and stripped of all permissions.
    user default off resetpass resetkeys resetchannels -@all
    # The container healthcheck can only PING.
    user healthcheck on nopass resetkeys resetchannels -@all +ping
    # The control plane manages site users and databases.
    user pressfleet on #@REDIS_ADMIN_PASSWORD_HASH@ ~* &* alldbs +@all


---
# Source: pressfleet/templates/traefik-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: traefik
data:
  traefik.yaml: |
    global:
      checkNewVersion: false
      sendAnonymousUsage: false

    log:
      level: INFO
      format: json

    # Request headers are dropped: they carry session cookies and basic auth
    # credentials.
    accessLog:
      format: json
      fields:
        headers:
          defaultMode: drop

    entryPoints:
      web:
        address: ":8000"
        http:
          redirections:
            entryPoint:
              # The Service's port, not the container's.
              to: ":443"
              scheme: https
              permanent: true
      websecure:
        address: ":8443"
        # Routers that name no entry point listen here only.
        asDefault: true
        http:
          tls: {}
      # The SFTP gateway in the control plane (sftp.port on the Service).
      sftp:
        address: ":2222"
      # Ping, for the probes, on loopback only, as on Compose (security
      # review finding F5).
      traefik:
        address: "127.0.0.1:8082"
      # Prometheus metrics, which name every site and its traffic: on the
      # pod network, but the NetworkPolicy "traefik" admits the control
      # plane alone (provisioner.TraefikMetricsReader reads them from the
      # traefik-metrics Service), so it needs no exec into this pod.
      metrics:
        address: ":9100"

    ping:
      entryPoint: traefik

    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true

    # No Kubernetes provider: Traefik has no access to the API, and serves
    # only routes the chart or the control plane wrote (#322, security
    # review K1).
    providers:
      # The platform's own routes and the maintenance page's service
      # (dynamic.yaml below).
      file:
        filename: /etc/traefik/dynamic.yaml
        watch: false
      # The sites' routes and maintenance routes, which the control plane
      # serves on a listener of its own (kubernetes.traefik_provider_listen)
      # that the NetworkPolicy "control-plane" opens to Traefik alone. On
      # an error Traefik keeps the routes it has. The short interval is how
      # long a new site, domain, or maintenance mode takes to route.
      http:
        endpoint: "http://control-plane.pressfleet.svc:8081/traefik/dynamic"
        pollInterval: 2s
        pollTimeout: 5s

    certificatesResolvers:
      # HTTP-01, one certificate per host name: the dashboard domain and,
      # from go-live on, sites' primary domains and aliases.
      acme-http:
        acme:
          caServer: "https://acme-v02.api.letsencrypt.org/directory"
          storage: /var/lib/traefik/acme.json
          httpChallenge:
            entryPoint: web
      # Preview domains (<slug>.<preview base domain>).
      acme-preview:
        acme:
          caServer: "https://acme-v02.api.letsencrypt.org/directory"
          storage: /var/lib/traefik/acme.json
          # No DNS provider: one certificate per preview domain, with
          # HTTP-01, subject to the CA's rate limits.
          httpChallenge:
            entryPoint: web

  # The platform's own routes (Traefik's file provider), which the Compose
  # project puts in the control plane's labels and its own file provider.
  # Site routes are the control plane's (the HTTP provider above).
  dynamic.yaml: |
    http:
      services:
        pf-dashboard:
          loadBalancer:
            servers:
              - url: "http://control-plane.pressfleet.svc:8080"
        # The maintenance page (design doc §5.4), which the control plane's
        # maintenance routes name as pf-maintenance@file
        # (ingress.MaintenanceService).
        pf-maintenance:
          loadBalancer:
            servers:
              - url: "http://maintenance.pressfleet.svc:8080"
    # The SFTP gateway (§5.8). SSH can't be routed by host name, so it has
    # an entry point and a Service port of its own.
    tcp:
      routers:
        pf-sftp:
          rule: "HostSNI(`*`)"
          entryPoints: [sftp]
          service: pf-sftp
      services:
        pf-sftp:
          loadBalancer:
            servers:
              - address: "control-plane.pressfleet.svc:2222"

