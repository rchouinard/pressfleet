apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "data-volume.pressfleet.pressfleet.io"
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: control-plane
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [persistentvolumes]
  matchConditions:
    - name: control-plane
      expression: "request.userInfo.username == 'system:serviceaccount:pressfleet:control-plane'"
  validations:
    - expression: >-
        request.operation != 'CREATE' ||
        (object.spec.persistentVolumeReclaimPolicy == 'Retain' &&
        (!has(object.spec.storageClassName) || object.spec.storageClassName == '') &&
        (has(object.spec.csi) || has(object.spec.nfs)) &&
        has(object.spec.claimRef) && has(object.spec.claimRef.namespace) && has(object.spec.claimRef.name) &&
        object.spec.claimRef.namespace.startsWith('pf-') &&
        object.spec.claimRef.name == 'pressfleet-data' &&
        object.metadata.name == object.spec.claimRef.namespace + '-data' &&
        has(object.metadata.labels) &&
        'pressfleet.io/data-clone' in object.metadata.labels &&
        object.metadata.labels['pressfleet.io/data-clone'] == 'pressfleet' &&
        !('pressfleet.io/data-volume' in object.metadata.labels))
      messageExpression: >-
        'the PressFleet control plane may only create clones of its data volume (Retain, CSI or NFS, no storage class, labeled pressfleet.io/data-clone=pressfleet, bound to pf-.../pressfleet-data and named after that namespace), not ' + object.metadata.name
    - expression: >-
        request.operation != 'UPDATE' ||
        (has(oldObject.spec.claimRef) &&
        oldObject.spec.claimRef.namespace == 'pressfleet' &&
        oldObject.spec.claimRef.name == 'control-plane-data' &&
        object.spec == oldObject.spec &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) ==
        (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []) &&
        has(object.metadata.labels) &&
        'pressfleet.io/data-volume' in object.metadata.labels &&
        object.metadata.labels['pressfleet.io/data-volume'] == 'pressfleet' &&
        object.metadata.labels.all(k, k == 'pressfleet.io/data-volume' ||
        (has(oldObject.metadata.labels) && k in oldObject.metadata.labels && oldObject.metadata.labels[k] == object.metadata.labels[k])) &&
        (!has(oldObject.metadata.labels) || oldObject.metadata.labels.all(k, k in object.metadata.labels)))
      messageExpression: >-
        'the PressFleet control plane may only label the data volume (pressfleet/control-plane-data) as such, not change ' + oldObject.metadata.name
    - expression: >-
        request.operation != 'DELETE' ||
        (has(oldObject.metadata.labels) &&
        'pressfleet.io/data-clone' in oldObject.metadata.labels &&
        oldObject.metadata.labels['pressfleet.io/data-clone'] == 'pressfleet' &&
        oldObject.spec.persistentVolumeReclaimPolicy == 'Retain' &&
        has(oldObject.spec.claimRef) && has(oldObject.spec.claimRef.namespace) &&
        oldObject.spec.claimRef.namespace.startsWith('pf-'))
      messageExpression: >-
        'the PressFleet control plane may only delete clones of its data volume, not ' + oldObject.metadata.name

