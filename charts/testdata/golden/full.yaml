apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  serviceName: redis
  selector:
    matchLabels:
      app.kubernetes.io/name: pressfleet
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pressfleet
        app.kubernetes.io/instance: "pressfleet"
        app.kubernetes.io/version: "0.0.0-dev"
        app.kubernetes.io/managed-by: "Helm"
        helm.sh/chart: "pressfleet-0.0.0-dev"
        app.kubernetes.io/component: redis
      annotations:
        checksum/config: 6cb5cfc7a30a8fa76a24d17da1044d023d8c0edf86e4ce555b79a9cd96fef167
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: "registry-credentials"
      # The image's own user, as on Compose.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Writes valkey.conf with the SHA-256 of the admin password in the
        # ACL rule ("#<hex>"), so the configuration holds no usable
        # credential, as on Compose.
        - name: config
          image: "registry.agency.example/valkey/valkey:9.1.2"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              hash=$(printf %s "$(cat /run/secrets/redis_admin_password)" | sha256sum | cut -d' ' -f1)
              sed "s/@REDIS_ADMIN_PASSWORD_HASH@/$hash/" /etc/valkey-template/valkey.conf > /etc/valkey/valkey.conf
          volumeMounts:
            - name: template
              mountPath: /etc/valkey-template
              readOnly: true
            - name: config
              mountPath: /etc/valkey
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 16Mi
      containers:
        - name: redis
          image: "registry.agency.example/valkey/valkey:9.1.2"
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: 576Mi
            limits:
              memory: 576Mi
          livenessProbe:
            exec:
              command: ["valkey-cli", "--no-auth-warning", "--user", "healthcheck", "--pass", "nopass", "-e", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["valkey-cli", "--no-auth-warning", "--user", "healthcheck", "--pass", "nopass", "-e", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: template
          configMap:
            name: redis
        # The rendered configuration, in memory.
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Valkey's working directory: nothing is persisted (valkey.conf).
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: secrets
          secret:
            secretName: "agency-platform"
            defaultMode: 0440
            items:
              - key: "redis"
                path: redis_admin_password

