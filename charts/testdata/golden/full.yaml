# Source: pressfleet/templates/routes.yaml
# Makes Traefik obtain the preview wildcard certificate with DNS-01 as soon
# as it starts, rather than when the first site appears
# (ingress.PreviewWildcardRouter). The bare base domain itself hosts
# nothing.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pf-preview-wildcard
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: traefik
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: "Host(`preview.agency.example`)"
      services:
        - kind: TraefikService
          name: noop@internal
  tls:
    certResolver: acme-preview
    domains:
      - main: "preview.agency.example"
        sans:
          - "*.preview.agency.example"

