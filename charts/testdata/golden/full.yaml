  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [namespaces]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [rolebindings]
  matchConditions:
    - name: control-plane
      expression: "request.userInfo.username == 'system:serviceaccount:pressfleet:control-plane'"
  variables:
    - name: isNamespace
      expression: "request.resource.resource == 'namespaces'"
    # The namespace concerned: the one written, or the RoleBinding's.
    - name: target
      expression: "variables.isNamespace ? request.name : request.namespace"
  validations:
    - expression: >-
        !variables.isNamespace || request.operation == 'DELETE' ||
        ((has(object.metadata.labels) && (
        (variables.target.startsWith('site-') &&
        'app.kubernetes.io/managed-by' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/managed-by'] == 'pressfleet') ||
        (variables.target.startsWith('pressfleet-doctor-') &&
        'pressfleet.io/doctor-probe' in object.metadata.labels && object.metadata.labels['pressfleet.io/doctor-probe'] == 'true'))) &&
        'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
        object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted')
      messageExpression: >-
        'the PressFleet control plane may only write site namespaces (site-..., labeled app.kubernetes.io/managed-by=pressfleet) and doctor probe namespaces (pressfleet-doctor-..., labeled pressfleet.io/doctor-probe=true) that enforce Pod Security restricted, not ' + request.name
    - expression: >-
        !variables.isNamespace || request.operation == 'CREATE' ||
        (has(oldObject.metadata.labels) && (
        (variables.target.startsWith('site-') &&
        'app.kubernetes.io/managed-by' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'pressfleet') ||
        (variables.target.startsWith('pressfleet-doctor-') &&
        'pressfleet.io/doctor-probe' in oldObject.metadata.labels && oldObject.metadata.labels['pressfleet.io/doctor-probe'] == 'true')))
      messageExpression: >-
        'the PressFleet control plane may only change or delete namespaces it created, not ' + request.name
    - expression: >-
        variables.isNamespace ||
        (namespaceObject != null &&
        (has(namespaceObject.metadata.labels) && (
        (variables.target.startsWith('site-') &&
        'app.kubernetes.io/managed-by' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['app.kubernetes.io/managed-by'] == 'pressfleet') ||
        (variables.target.startsWith('pressfleet-doctor-') &&
        'pressfleet.io/doctor-probe' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['pressfleet.io/doctor-probe'] == 'true'))))
      messageExpression: >-
        'the PressFleet control plane may only write RoleBindings in its own namespaces, not in ' + request.namespace
    - expression: >-
        variables.isNamespace || request.operation == 'DELETE' ||
        (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'pressfleet:pressfleet:site')
      message: "the PressFleet control plane may only bind the ClusterRole pressfleet:pressfleet:site"

