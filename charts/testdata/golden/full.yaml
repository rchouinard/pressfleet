# Source: pressfleet/templates/traefik.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-acme
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: traefik
  annotations:
    # ACME account keys and certificates: losing them means issuing every
    # certificate again, against the CA's rate limits.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: "fast-rwo"
  resources:
    requests:
      storage: "256Mi"

