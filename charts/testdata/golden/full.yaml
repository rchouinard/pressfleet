# Source: pressfleet/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "pressfleet:pressfleet:control-plane"
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: control-plane
rules:
  # Site namespaces, created and deleted with their sites, and doctor's
  # probe namespaces.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  # The RoleBinding in each site namespace that gives the control plane the
  # site ClusterRole there. Kubernetes lets it bind that ClusterRole only.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: ["pressfleet:pressfleet:site"]
  # Doctor (architecture, cgroups, allocatable memory) and per-node host
  # metrics (§7.2).
  - apiGroups: [""]
    resources: [nodes]
    verbs: ["get","list","watch"]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  # Each site namespace's clone of the data volume, through which its tasks
  # mount the data directory, and the label on the data volume's own
  # PersistentVolume that the clones are compared with (#219).
  # data-volume-policy.yaml admits nothing else.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, create, patch, delete]

---
# Source: pressfleet/templates/rbac.yaml
# Everything of one site, in the site's namespace only: the driver binds it
# there with a RoleBinding (ClusterRole name: pressfleet:<platform
# namespace>:site). No ClusterRoleBinding ever names it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "pressfleet:pressfleet:site"
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: control-plane
rules:
  # The site's Deployment, its tasks and SFTP sessions (pods), wp-config.php
  # and task Secrets, its Service and wp-content volume.
  - apiGroups: [""]
    resources: [pods, secrets, services, persistentvolumeclaims, configmaps]
    verbs: ["get","list","watch","create","update","patch","delete","deletecollection"]
  # WP-CLI, probes, and cache purges (exec); task and session streams
  # (attach); logs.
  - apiGroups: [""]
    resources: [pods/exec, pods/attach]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: ["get","list","watch"]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: ["get","list","watch","create","update","patch","delete","deletecollection"]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: ["get","list","watch"]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: ["get","list","watch","create","update","patch","delete","deletecollection"]
  # Routes: IngressRoute and Middleware objects, named as on Compose.
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: ["get","list","watch","create","update","patch","delete","deletecollection"]
  # Container stats (§7.2).
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]

