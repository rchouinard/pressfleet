# Source: pressfleet/templates/traefik-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: traefik
data:
  traefik.yaml: |
    global:
      checkNewVersion: false
      sendAnonymousUsage: false

    log:
      level: INFO
      format: json

    # Request headers are dropped: they carry session cookies and basic auth
    # credentials.
    accessLog:
      format: json
      fields:
        headers:
          defaultMode: drop

    entryPoints:
      web:
        address: ":8000"
        http:
          redirections:
            entryPoint:
              # The Service's port, not the container's.
              to: ":443"
              scheme: https
              permanent: true
      websecure:
        address: ":8443"
        # Routers that name no entry point listen here only.
        asDefault: true
        http:
          tls: {}
        http3:
          advertisedPort: 443
      # The SFTP gateway in the control plane (sftp.port on the Service).
      sftp:
        address: ":2222"
      # Ping (the probes) and Prometheus metrics, on loopback only, as on
      # Compose (security review finding F5): the control plane reads the
      # metrics through the exec API (provisioner.TraefikMetricsReader).
      traefik:
        address: "127.0.0.1:8082"

    ping:
      entryPoint: traefik

    metrics:
      prometheus:
        entryPoint: traefik
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true

    providers:
      # The IngressRoute and Middleware objects of the platform and of every
      # site namespace. A route may only use services and middlewares of its
      # own namespace.
      kubernetesCRD:
        allowCrossNamespace: false
        allowExternalNameServices: false

    certificatesResolvers:
      # HTTP-01, one certificate per host name: the dashboard domain and,
      # from go-live on, sites' primary domains and aliases.
      acme-http:
        acme:
          email: "ops@agency.example"
          caServer: "https://pebble.pressfleet.svc:14000/dir"
          storage: /var/lib/traefik/acme.json
          httpChallenge:
            entryPoint: web
      # Preview domains (<slug>.<preview base domain>).
      acme-preview:
        acme:
          email: "ops@agency.example"
          caServer: "https://pebble.pressfleet.svc:14000/dir"
          storage: /var/lib/traefik/acme.json
          # One wildcard certificate for every preview domain, with DNS-01
          # (see routes.yaml). The provider's credentials come from the
          # files the entrypoint names in <VARIABLE>_FILE variables.
          dnsChallenge:
            provider: "cloudflare"
            resolvers:
              - "1.1.1.1:53"
              - "8.8.8.8:53"

