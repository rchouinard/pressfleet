# Source: pressfleet/templates/traefik.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app.kubernetes.io/name: pressfleet
    app.kubernetes.io/instance: "pressfleet"
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "pressfleet-0.0.0-dev"
    app.kubernetes.io/component: traefik
spec:
  replicas: 1
  # The ACME volume is ReadWriteOnce, and two Traefiks would both try to
  # renew the same certificates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pressfleet
      app.kubernetes.io/component: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pressfleet
        app.kubernetes.io/instance: "pressfleet"
        app.kubernetes.io/version: "0.0.0-dev"
        app.kubernetes.io/managed-by: "Helm"
        helm.sh/chart: "pressfleet-0.0.0-dev"
        app.kubernetes.io/component: traefik
      annotations:
        checksum/config: 985349fe8bd1e69e5b0f9e9887e46a9717d62aade1e1b27fbc9f2452fd82a372
    spec:
      serviceAccountName: traefik
      imagePullSecrets:
        - name: "registry-credentials"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: "registry.agency.example/library/traefik:v3.7.16"
          # Points Traefik at each DNS provider credential file with a
          # <VARIABLE>_FILE variable, so the values never appear in its
          # environment, as the Compose entrypoint does.
          command:
            - /bin/sh
            - -c
            - |
              found=0
              for f in /run/secrets/acme-dns/*; do
                [ -f "$f" ] || continue
                export "${f##*/}_FILE=$f"
                found=$((found + 1))
              done
              echo "pressfleet: starting Traefik with $found DNS provider credential(s)" >&2
              exec traefik --configFile=/etc/traefik/traefik.yaml
          env:
            # Lets the Go runtime collect garbage harder before the memory
            # limit is reached instead of being killed at it.
            - name: GOMEMLIMIT
              value: "192MiB"
            # Extra roots to trust for the ACME server, on top of the system's.
            - name: LEGO_CA_CERTIFICATES
              value: /etc/traefik/acme-ca/ca.pem
            - name: LEGO_CA_SYSTEM_CERT_POOL
              value: "true"
          ports:
            - name: web
              containerPort: 8000
              protocol: TCP
            - name: websecure
              containerPort: 8443
              protocol: TCP
            - name: websecure-udp
              containerPort: 8443
              protocol: UDP
            - name: sftp
              containerPort: 2222
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/traefik/traefik.yaml
              subPath: traefik.yaml
              readOnly: true
            - name: acme
              mountPath: /var/lib/traefik
            - name: tmp
              mountPath: /tmp
            - name: dns-credentials
              mountPath: /run/secrets/acme-dns
              readOnly: true
            - name: acme-ca
              mountPath: /etc/traefik/acme-ca
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 256Mi
          # The ping entry point is on loopback, so the probes run inside
          # the container, as the Compose healthcheck does.
          livenessProbe:
            exec:
              command: ["traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yaml"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yaml"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: traefik
        - name: acme
          persistentVolumeClaim:
            claimName: traefik-acme
        - name: tmp
          emptyDir: {}
        - name: dns-credentials
          secret:
            secretName: "cloudflare-credentials"
            # Readable by Traefik's group (fsGroup) only.
            defaultMode: 0440
        - name: acme-ca
          secret:
            secretName: "pebble-ca"
            items:
              - key: "pebble.minica.pem"
                path: ca.pem

