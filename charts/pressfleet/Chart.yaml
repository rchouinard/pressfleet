apiVersion: v2
name: pressfleet
description: >-
  PressFleet, a self-hostable WordPress application platform, on Kubernetes:
  the control plane and the platform services (Traefik, MariaDB, Valkey,
  VictoriaMetrics, and the maintenance page).
type: application
# The release pipeline stamps both versions with the release's when it
# packages the chart (helm package --version --app-version), so the chart and
# the control plane always come from the same release (design doc §4.8).
version: 0.0.0-dev
appVersion: 0.0.0-dev
kubeVersion: ">=1.35.0-0"
home: https://github.com/rchouinard/pressfleet
sources:
  - https://github.com/rchouinard/pressfleet
keywords:
  - wordpress
  - hosting
