{{- /*
Traefik's static configuration, as templates/platform/traefik.yaml.tmpl
renders it for Compose, with the control plane's HTTP provider in place of
the Docker provider, and its dynamic configuration (dynamic.yaml). Entry
point and resolver names are package ingress's. Traefik doesn't run as root here, so the entry points listen on
unprivileged ports, and the Service maps 80 and 443 to them.
*/ -}}
{{- if and .Values.acme.dnsProvider (not .Values.acme.dnsCredentialsSecret) }}
{{- fail "acme.dnsCredentialsSecret is required with acme.dnsProvider" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "traefik") | nindent 4 }}
data:
  traefik.yaml: |
    global:
      checkNewVersion: false
      sendAnonymousUsage: false

    log:
      level: INFO
      format: json

    # Request headers are dropped: they carry session cookies and basic auth
    # credentials.
    accessLog:
      format: json
      fields:
        headers:
          defaultMode: drop

    entryPoints:
      web:
        address: ":8000"
        http:
          redirections:
            entryPoint:
              # The Service's port, not the container's.
              to: ":443"
              scheme: https
              permanent: true
      websecure:
        address: ":8443"
        # Routers that name no entry point listen here only.
        asDefault: true
        http:
          tls: {}
        {{- if .Values.traefik.service.http3 }}
        http3:
          advertisedPort: 443
        {{- end }}
      # The SFTP gateway in the control plane (sftp.port on the Service).
      sftp:
        address: ":2222"
      # Ping, for the probes, on loopback only, as on Compose (security
      # review finding F5).
      traefik:
        address: "127.0.0.1:8082"
      # Prometheus metrics, which name every site and its traffic: on the
      # pod network, but the NetworkPolicy "traefik" admits the control
      # plane alone (provisioner.TraefikMetricsReader reads them from the
      # traefik-metrics Service), so it needs no exec into this pod.
      metrics:
        address: ":9100"

    ping:
      entryPoint: traefik

    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true

    # No Kubernetes provider: Traefik has no access to the API, and serves
    # only routes the chart or the control plane wrote (#322, security
    # review K1).
    providers:
      # The platform's own routes and the maintenance page's service
      # (dynamic.yaml below).
      file:
        filename: /etc/traefik/dynamic.yaml
        watch: false
      # The sites' routes and maintenance routes, which the control plane
      # serves on a listener of its own (kubernetes.traefik_provider_listen)
      # that the NetworkPolicy "control-plane" opens to Traefik alone. On
      # an error Traefik keeps the routes it has. The short interval is how
      # long a new site, domain, or maintenance mode takes to route.
      http:
        endpoint: {{ printf "http://control-plane.%s.svc:8081/traefik/dynamic" .Release.Namespace | quote }}
        pollInterval: 2s
        pollTimeout: 5s

    certificatesResolvers:
      # HTTP-01, one certificate per host name: the dashboard domain and,
      # from go-live on, sites' primary domains and aliases.
      acme-http:
        acme:
          {{- include "pressfleet.acmeAccount" . | nindent 10 }}
          httpChallenge:
            entryPoint: web
      # Preview domains (<slug>.<preview base domain>).
      acme-preview:
        acme:
          {{- include "pressfleet.acmeAccount" . | nindent 10 }}
          {{- if .Values.acme.dnsProvider }}
          # One wildcard certificate for every preview domain, with DNS-01
          # (see routes.yaml). The provider's credentials come from the
          # files the entrypoint names in <VARIABLE>_FILE variables.
          dnsChallenge:
            provider: {{ .Values.acme.dnsProvider | quote }}
            {{- with .Values.acme.dnsResolvers }}
            resolvers:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
          {{- else }}
          # No DNS provider: one certificate per preview domain, with
          # HTTP-01, subject to the CA's rate limits.
          httpChallenge:
            entryPoint: web
          {{- end }}

  # The platform's own routes (Traefik's file provider), which the Compose
  # project puts in the control plane's labels and its own file provider.
  # Site routes are the control plane's (the HTTP provider above).
  dynamic.yaml: |
    http:
      {{- if or .Values.dashboardDomain (and .Values.acme.dnsProvider .Values.previewBaseDomain) }}
      routers:
        {{- with .Values.dashboardDomain }}
        # The dashboard and API.
        pf-dashboard:
          rule: {{ printf "Host(`%s`)" . | quote }}
          entryPoints: [websecure]
          service: pf-dashboard
          tls:
            certResolver: acme-http
        {{- end }}
        {{- if and .Values.acme.dnsProvider .Values.previewBaseDomain }}
        # Makes Traefik obtain the preview wildcard certificate with
        # DNS-01 as soon as it starts, rather than when the first site
        # appears (ingress.PreviewWildcardRouter). The bare base domain
        # itself hosts nothing.
        pf-preview-wildcard:
          rule: {{ printf "Host(`%s`)" .Values.previewBaseDomain | quote }}
          entryPoints: [websecure]
          service: noop@internal
          tls:
            certResolver: acme-preview
            domains:
              - main: {{ .Values.previewBaseDomain | quote }}
                sans:
                  - {{ printf "*.%s" .Values.previewBaseDomain | quote }}
        {{- end }}
      {{- end }}
      services:
        pf-dashboard:
          loadBalancer:
            servers:
              - url: {{ printf "http://control-plane.%s.svc:8080" .Release.Namespace | quote }}
        # The maintenance page (design doc §5.4), which the control plane's
        # maintenance routes name as pf-maintenance@file
        # (ingress.MaintenanceService).
        pf-maintenance:
          loadBalancer:
            servers:
              - url: {{ printf "http://maintenance.%s.svc:8080" .Release.Namespace | quote }}
    # The SFTP gateway (§5.8). SSH can't be routed by host name, so it has
    # an entry point and a Service port of its own.
    tcp:
      routers:
        pf-sftp:
          rule: "HostSNI(`*`)"
          entryPoints: [sftp]
          service: pf-sftp
      services:
        pf-sftp:
          loadBalancer:
            servers:
              - address: {{ printf "control-plane.%s.svc:2222" .Release.Namespace | quote }}
