{{- /*
Who may reach the platform services (design doc §4.8, §6), in place of the
Compose project's networks. Nothing in the platform namespace accepts
traffic unless a policy below allows it. Site pods are those in namespaces
the control plane created (labeled app.kubernetes.io/managed-by=pressfleet
and pressfleet.io/site-id; admission-policy.yaml keeps anyone else's
namespaces from getting the label through the control plane).
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "pressfleet.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Traefik takes web and SFTP traffic from anywhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "traefik") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pressfleet.selector" (dict "component" "traefik") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: web
        - port: websecure
        {{- if .Values.traefik.service.http3 }}
        - port: websecure-udp
          protocol: UDP
        {{- end }}
        - port: sftp
---
# The dashboard, the API, and the SFTP gateway: from Traefik only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pressfleet.selector" (dict "component" "control-plane") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "pressfleet.peer" "traefik" | nindent 8 }}
      ports:
        - port: http
        - port: sftp
---
# The maintenance page: from Traefik only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maintenance
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "maintenance") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pressfleet.selector" (dict "component" "maintenance") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "pressfleet.peer" "traefik" | nindent 8 }}
      ports:
        - port: http
---
{{- if .Values.mariadb.enabled }}
# MariaDB: the control plane (databases, users, dumps) and site pods
# (WordPress, WP-CLI, and tasks).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "mariadb") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pressfleet.selector" (dict "component" "mariadb") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "pressfleet.peer" "control-plane" | nindent 8 }}
        {{- include "pressfleet.sitePods" . | nindent 8 }}
      ports:
        - port: mysql
---
{{- end }}
# The object cache: the control plane (site ACL users) and site pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pressfleet.selector" (dict "component" "redis") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "pressfleet.peer" "control-plane" | nindent 8 }}
        {{- include "pressfleet.sitePods" . | nindent 8 }}
      ports:
        - port: redis
---
# VictoriaMetrics: the control plane only, as on Compose.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-metrics
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "victoria-metrics") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pressfleet.selector" (dict "component" "victoria-metrics") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "pressfleet.peer" "control-plane" | nindent 8 }}
      ports:
        - port: http
