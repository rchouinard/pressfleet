{{- /*
The control plane (design doc §4.1, §4.8): one replica, replaced rather than
rolled (two would run jobs against the same state), with the data directory
on a ReadWriteMany volume that task pods mount too.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
---
{{- if not .Values.controlPlane.data.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: control-plane-data
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
  annotations:
    # The data directory holds uploads, exports, local backup repositories,
    # and the state database's migration markers: uninstalling the chart
    # keeps it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteMany]
  {{- with .Values.kubernetes.storageClasses.data }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.controlPlane.data.size | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
spec:
  selector:
    {{- include "pressfleet.selector" (dict "root" . "component" "control-plane") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: sftp
      port: 2222
      targetPort: sftp
    # The sites' routes, for Traefik's HTTP provider (traefik-config.yaml).
    - name: traefik-config
      port: 8081
      targetPort: traefik-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    {{- include "pressfleet.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
spec:
  # Zero while a state recovery runs (state-recover.yaml, §5.10).
  replicas: {{ if .Values.recovery.enabled }}0{{ else }}1{{ end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pressfleet.selector" (dict "root" . "component" "control-plane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pressfleet.componentLabels" (dict "root" . "component" "control-plane") | nindent 8 }}
    spec:
      {{- include "pressfleet.controlPlanePodSpec" (dict "root" . "args" (list "serve") "serve" true) | nindent 6 }}
