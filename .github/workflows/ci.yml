name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - uses: ./.github/actions/pnpm-cache
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      # Includes the TypeScript API client (ui/app/api/schema.gen.ts).
      - name: Check generated code is up to date
        run: |
          make generate
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # State database tests run on SQLite and on this PostgreSQL server.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRESSFLEET_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - run: make test

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/pnpm-cache
      - run: pnpm -C ui install --frozen-lockfile
      - name: Lint, typecheck, and unit-test
        run: |
          pnpm -C ui lint
          pnpm -C ui typecheck
          pnpm -C ui test
      - run: pnpm -C ui generate
      # The build job embeds this output rather than building the UI again.
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/.output/public
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    needs: ui
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `git describe` can produce the version
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/.output/public
      # UI=prebuilt embeds the dashboard from the ui job; the build fails if
      # it is missing, so CI can't produce a binary with only the placeholder.
      - run: make build UI=prebuilt
      - run: ./bin/pressfleet version
