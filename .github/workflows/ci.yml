name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # State database tests run on SQLite and on this PostgreSQL server.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRESSFLEET_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - run: make test

  build:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `git describe` can produce the version
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - run: make build
      - run: ./bin/pressfleet version
