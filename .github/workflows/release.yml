name: Release

# Publishes a release when a v* tag is pushed (docs/releasing.md):
#
#   1. The Images workflow pushes control-plane:<tag> and the site image matrix.
#   2. The host CLI is built for linux/amd64 with the dashboard embedded. It
#      embeds the release's platform templates and pinned image list
#      (templates/), and installs control-plane:<tag> (design doc §4.7).
#   3. The Helm chart is packaged with the release's version
#      (scripts/package-chart.sh) and pushed to
#      oci://ghcr.io/rchouinard/pressfleet/charts (design doc §4.8).
#   4. The GitHub release gets the binary, the chart package, SHA256SUMS, SPDX
#      SBOMs of the binary, the chart, and the control plane image, and notes
#      that name the oldest release it upgrades from and the chart's
#      reference (scripts/release-notes.sh).
#
# The release is created only after the images are pushed, so a published
# CLI never points at a control plane image that doesn't exist. Tags with a
# pre-release suffix (v1.2.0-rc.1) become GitHub pre-releases.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' <<<"$TAG"; then
            echo "::error::$TAG is not a semantic version tag (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          # Releases are cut from main, which CI and E2E have already run on.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main"
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >>"$GITHUB_OUTPUT"

  # The platform images the release pins (templates/platform/images.yaml) are
  # third-party, so they're scanned here rather than in the Images workflow.
  platform-images:
    name: Platform images (Trivy)
    needs: check
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - id: images
        name: List the pinned platform images
        run: |
          {
            echo 'list<<EOF'
            sed -n 's/^[a-z-]*: \(.*@sha256:[0-9a-f]\{64\}\)$/\1/p' templates/platform/images.yaml
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/trivy-scan
        with:
          fail-on: CRITICAL
          images: ${{ steps.images.outputs.list }}

  images:
    name: Images
    needs: check
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write

  ui:
    name: UI
    needs: check
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/pnpm-cache
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui generate
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/.output/public
          if-no-files-found: error
          retention-days: 1

  # After the images, so the chart never points at a control plane image that
  # doesn't exist.
  chart:
    name: Helm chart
    needs: [check, images]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write # push the chart
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      TAG: ${{ github.ref_name }}
      REPOSITORY: oci://ghcr.io/rchouinard/pressfleet/charts
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - id: package
        name: Package the chart
        run: echo "path=$(scripts/package-chart.sh "$TAG" dist)" >>"$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"
      - id: push
        name: Push the chart
        env:
          CHART: ${{ steps.package.outputs.path }}
        run: |
          helm push "$CHART" "$REPOSITORY" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' push.log)"
          [[ -n "$digest" ]] || { echo "::error::helm push reported no digest"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          # What a user installs must be this release.
          helm show chart "$REPOSITORY/pressfleet" --version "${TAG#v}" | grep -qx "appVersion: ${TAG#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/pressfleet-*.tgz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish the release
    needs: [check, platform-images, images, ui, chart]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write # create the release
      packages: read # inspect the control plane image
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/rchouinard/pressfleet/control-plane:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the version and the changelog
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/.output/public
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: chart-dist
      - name: Build the CLI
        run: |
          make build UI=prebuilt VERSION="$TAG"
          got="$(./bin/pressfleet version --client)"
          echo "$got"
          # The CLI installs control-plane:<its version>, so the two must match.
          [[ "$got" == "pressfleet $TAG "* ]] || { echo "::error::the binary reports a version other than $TAG"; exit 1; }
          mkdir dist
          cp bin/pressfleet dist/pressfleet-linux-amd64
          cp chart-dist/pressfleet-*.tgz dist/
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        name: Look up the control plane image
        run: |
          # Images publishes a single linux/amd64 manifest, so this digest is
          # the one `pressfleet upgrade` records for the control plane.
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest for $IMAGE"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@v0
        with:
          file: dist/pressfleet-linux-amd64
          format: spdx-json
          output-file: dist/pressfleet-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Name the chart package
        run: echo "CHART_FILE=$(basename dist/pressfleet-*.tgz)" >>"$GITHUB_ENV"
      - uses: anchore/sbom-action@v0
        with:
          file: dist/${{ env.CHART_FILE }}
          format: spdx-json
          output-file: dist/pressfleet-chart.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          output-file: dist/control-plane.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write checksums and notes
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          (cd dist && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
          scripts/release-notes.sh "$TAG" "$DIGEST" "$CHART_DIGEST" >notes.md
          cat notes.md >>"$GITHUB_STEP_SUMMARY"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" dist/* \
            --verify-tag --title "PressFleet $TAG" --notes-file notes.md "${flags[@]}"
