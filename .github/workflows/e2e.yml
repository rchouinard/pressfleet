name: E2E

# End-to-end tests (docs/testing.md): build the control plane image, boot
# the platform with Docker Compose, and drive it through the API
# (control-plane/internal/e2e, job e2e) and through the dashboard in
# Chromium (ui/e2e with Playwright, job dashboard). The two jobs run side
# by side, each on its own runner.
#
#   push to main       always
#   manual             always
#   pull requests      only when labeled `e2e` (booting the platform costs
#                      minutes; add the label to a PR that needs it)
#
# This is a separate workflow so that labeling a PR doesn't rerun CI.
#
# It uses the runner's own Docker Engine rather than a docker:dind service.
# The control plane bind-mounts the data directory at the host's path and
# drives the host daemon through its socket; with dind, those paths would
# have to exist inside the dind container instead of on the runner, which
# breaks that contract. The runner's daemon is already an isolated,
# throwaway Docker host.
#
# Site images: the tests use local images and pull missing ones from GHCR,
# where the Images workflow publishes them from main. When a push or PR
# changes images/, the published images are stale (on main, the Images
# workflow is still publishing the new ones while this runs), so this
# workflow first builds the ones the tests use from the tree: the latest
# WordPress on the two newest PHP branches. The M2 acceptance test also
# pulls Pebble and its DNS server, public images on ghcr.io/letsencrypt.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # pull the site images published by images.yml

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    # The tests run one after another, about 25 minutes on a workstation
    # (go test's own limit is 60m, in the Makefile); a cold runner that
    # also builds the site images needs more.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to diff against the base or previous commit
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      # The site images on GHCR may be private. The tests pull them when
      # they aren't built locally.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Show Docker versions
        run: |
          docker version
          docker compose version
      - id: sites
        name: Decide whether to build the site images
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
          pull_request)
            changed="$(git diff --name-only "$BASE" HEAD)" ;;
          push)
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$BEFORE" HEAD)"
            else
              changed="images/"  # new branch or force push
            fi ;;
          *)
            changed="images/" ;;  # manual runs always test the tree
          esac
          if grep -q '^images/' <<<"$changed"; then build=true; else build=false; fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "Site images built from the tree: \`$build\`" >>"$GITHUB_STEP_SUMMARY"
      - if: steps.sites.outputs.build == 'true'
        name: Build the site images the tests use
        run: make images SITE_PHP="$(images/matrix.sh php | head -n 2 | xargs)"
      - run: make test-e2e
        env:
          # TestUpgradeRecovery downloads the CLI of the minimum
          # upgradable-from release, from a private repository for now.
          GH_TOKEN: ${{ github.token }}

  dashboard:
    name: Dashboard E2E
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    # The suite takes about five minutes on a workstation, in two runs
    # (go test's own limit is 40m, in the Makefile); building the image and,
    # when images/ changed, the site images, takes most of the rest.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to diff against the base or previous commit
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - uses: ./.github/actions/pnpm-cache
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No Chromium on the runner: the suite's browser runs in Playwright's
      # image for the installed version, which TestDashboard pulls and
      # starts (docs/testing.md, "Where the browser runs").
      - run: pnpm -C ui install --frozen-lockfile
      # Same decision as the e2e job: test the tree's site images when
      # images/ changed.
      - id: sites
        name: Decide whether to build the site images
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
          pull_request)
            changed="$(git diff --name-only "$BASE" HEAD)" ;;
          push)
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$BEFORE" HEAD)"
            else
              changed="images/"
            fi ;;
          *)
            changed="images/" ;;
          esac
          if grep -q '^images/' <<<"$changed"; then build=true; else build=false; fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
      - if: steps.sites.outputs.build == 'true'
        name: Build the site images the suite uses
        run: make images SITE_PHP="$(images/matrix.sh php | head -n 2 | xargs)"
      - run: make test-ui-e2e
      # Traces and screenshots of the failed tests, the HTML report, and the
      # platform's and the browser server's container logs
      # (ui/test-results/platform-logs.txt and browser-logs.txt).
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-e2e
          path: |
            ui/test-results/
            ui/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
