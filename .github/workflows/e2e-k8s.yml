name: E2E Kubernetes

# Kubernetes end-to-end tests (docs/testing.md, "Kubernetes end-to-end
# tests"; #228): a kind cluster with Calico, metrics-server, an NFS
# ReadWriteMany class, PostgreSQL, and a registry for the tree's images
# (scripts/kind/cluster.sh), the platform installed with the chart from
# `pressfleet init --target kubernetes`, the driver conformance suite in the
# cluster, and the acceptance tests through the API (make test-k8s-e2e).
#
# Like the Compose workflow (e2e.yml), it runs once per request:
#
#   PR labeled `e2e:k8s`   everything (re-add the label to test new commits)
#   nightly                everything, on main, unless main hasn't changed
#                          since the last nightly run
#   manual                 a tier, or a `go test -run` pattern, on any branch

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "47 6 * * *" # daily 06:47 UTC, after the Compose suite starts
  workflow_dispatch:
    inputs:
      tier:
        description: Tests to run (`smoke` is the install and the acceptance test)
        type: choice
        options: [full, smoke]
        default: full
      run:
        description: Or a `go test -run` pattern, e.g. TestKubernetesConformance (replaces the tier)
        type: string
        default: ""

permissions:
  contents: read
  packages: read # pull the site images published by images.yml

# Adding any other label to a PR also triggers this workflow; such a run
# gets a group of its own, so it doesn't cancel a run in progress.
concurrency:
  group: e2e-k8s-${{ github.ref }}-${{ (github.event_name == 'pull_request' && github.event.label.name != 'e2e:k8s') && github.run_id || 'tests' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    if: github.event_name != 'pull_request' || github.event.label.name == 'e2e:k8s'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read # find the last nightly run
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      tier: ${{ steps.plan.outputs.tier }}
      run: ${{ steps.plan.outputs.run }}
      build_images: ${{ steps.plan.outputs.build_images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to diff against the base or the last tested commit
      - id: plan
        name: Decide what to test
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_RUN: ${{ inputs.run }}
        run: |
          set -euo pipefail
          e2e=true tier=full pattern="" base="" skip=""
          case "$EVENT" in
          pull_request)
            base="$BASE" ;;
          schedule)
            # A commit is tested once a night at most: skip when a finished
            # nightly run already had this commit, whatever its result.
            nightly() {
              gh run list --workflow e2e-k8s.yml --event schedule --branch main --status completed \
                --limit 30 --json headSha,conclusion --jq "$1"
            }
            if nightly '.[] | select(.conclusion == "success" or .conclusion == "failure") | .headSha' |
              grep -qxF "$GITHUB_SHA"; then
              e2e=false skip="main is unchanged since the last nightly run"
            fi
            base="$(nightly 'map(select(.conclusion == "success"))[0].headSha // empty')" ;;
          workflow_dispatch)
            tier="$INPUT_TIER" pattern="$INPUT_RUN"
            if [[ -n "$pattern" ]]; then tier=custom; fi
            base="$(git merge-base origin/main HEAD)" ;;
          esac

          # Without a base to compare with, assume the images changed.
          if [[ -n "$base" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base" HEAD)"
          else
            changed=$'images/'
          fi
          if grep -q '^images/' <<<"$changed"; then build_images=true; else build_images=false; fi

          {
            echo "e2e=$e2e"
            echo "tier=$tier"
            echo "run=$pattern"
            echo "build_images=$build_images"
          } >>"$GITHUB_OUTPUT"
          {
            if [[ -n "$skip" ]]; then echo "Skipped: $skip."; fi
            echo "| | |"
            echo "| --- | --- |"
            echo "| Kubernetes suite | \`$e2e\` |"
            echo "| Tier | \`$tier\` |"
            if [[ -n "$pattern" ]]; then echo "| \`-run\` | \`${pattern//|/\\|}\` |"; fi
            echo "| Site images built from the tree | \`$build_images\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E Kubernetes
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # Creating the cluster takes a few minutes, each test's install about
    # one, and the conformance suite most of the rest (go test's own limit
    # is 150m, in the Makefile); full runs add the kindnet cluster's.
    timeout-minutes: ${{ needs.plan.outputs.tier == 'smoke' && 90 || 230 }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./.github/actions/go-cache
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.plan.outputs.build_images == 'true'
        name: Build the site images the tests use
        run: make images SITE_PHP="$(images/matrix.sh php | head -n 2 | xargs)"
      - name: Run the tests
        env:
          TIER: ${{ needs.plan.outputs.tier }}
          RUN: ${{ needs.plan.outputs.run }}
          KIND_SITE_IMAGES: ${{ needs.plan.outputs.build_images == 'true' && 'local' || 'pull' }}
        # Runners that share a host share its Docker and its one kind
        # cluster (and the kernel's nfsd), and the concurrency group is
        # per ref: without the lock a second PR's run reuses, then
        # deletes, the first one's cluster. The wait counts against the
        # job's timeout.
        run: |
          case "$TIER" in
          smoke) set -- make test-k8s-e2e K8S_TIER=smoke ;;
          *) set -- make test-k8s-e2e RUN="$RUN" ;;
          esac
          lock=/tmp/pressfleet-k8s-e2e.lock
          if ! flock -n "$lock" true; then
            echo "Waiting for another run of the kind tests on this host"
          fi
          flock "$lock" "$@"
      # doctor must fail a CNI that ignores NetworkPolicy (#225). That takes
      # a cluster of its own, with kind's kindnet in place of Calico, which
      # the step creates, tests, and deletes under the same lock once the
      # first cluster is gone (about ten minutes). Full runs only, even
      # when the tests above failed.
      - if: ${{ !cancelled() && needs.plan.outputs.tier == 'full' }}
        name: Run the NetworkPolicy check on kindnet
        env:
          KIND_SITE_IMAGES: ${{ needs.plan.outputs.build_images == 'true' && 'local' || 'pull' }}
        run: |
          lock=/tmp/pressfleet-k8s-e2e.lock
          if ! flock -n "$lock" true; then
            echo "Waiting for another run of the kind tests on this host"
          fi
          flock "$lock" make test-k8s-e2e-kindnet
