[tools]
go = "1.27"
# Lints, renders, and tests the Helm chart (charts/pressfleet).
helm = "4.3"
golangci-lint = "2"
# The dashboard (ui/) is built with Node and pnpm; production needs neither.
node = "24"
pnpm = "10"
# Restic backs up client group repositories (package internal/backup/repository);
# its tests run the real binary.
"aqua:restic/restic" = "0.19.1"
# The Kubernetes end-to-end tests (make test-k8s-e2e, scripts/kind) run a
# kind cluster and drive it with kubectl. kubectl stays within one minor
# release of the node image kind runs (scripts/kind/cluster.sh).
kind = "0.33.0"
kubectl = "1.37.2"
